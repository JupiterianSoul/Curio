<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lost and found · Zoble</title>
  <meta name="description" content="Things people dropped on the Zoble desktop.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="shared.css">
  <style>
    body { background: var(--z-desk); }
    html.curio-framed body { background: var(--z-face); }
    html.curio-framed .lf { padding: 6px; }
    .lf { width: min(100%, 760px); margin: 0 auto; padding: 18px 12px 40px; }
    .lf-win { display: flex; flex-direction: column; }
    .lf-head { display: flex; gap: 12px; align-items: center; padding: 10px 10px 4px; }
    .lf-head img { width: 32px; height: 32px; image-rendering: pixelated; flex: none; }
    .lf-head h1 { font: 700 24px/1.1 var(--c-hand); margin: 0; }
    .lf-head p { margin: 2px 0 0; line-height: 1.4; }
    .lf-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2px; margin: 8px 10px 10px; padding: 6px; max-height: none; }
    .lf-tag { display: grid; grid-template-columns: 32px 1fr; gap: 2px 10px; padding: 8px 6px; align-items: start; }
    .lf-tag img { width: 32px; height: 32px; image-rendering: pixelated; grid-row: span 3; }
    .lf-tag b { font-weight: 700; }
    .lf-tag small { color: var(--ink-3); line-height: 1.3; }
    :root[data-theme="dark"] .lf-tag small { color: var(--ink-2); }
    .lf-tag button { justify-self: start; margin-top: 4px; min-height: 22px !important; height: 22px; }
    .lf-tag.gone { opacity: .45; }
    .lf-tag.mine b::after { content: " (yours)"; font-weight: 400; color: var(--z-gray); }
    .lf-report { margin: 0 10px 10px; }
    .lf-report form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .lf-report input { flex: 1 1 200px; min-width: 0; }
    .lf-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 10px 8px; flex-wrap: wrap; }
    .lf-foot a { color: var(--z-text); }
  </style>
</head>
<body data-title="Lost and found" data-icon="box">
  <main class="lf z98">
    <div class="window lf-win">
      <div class="title-bar"><div class="title-bar-text"><img class="curio-bar__icon" id="ttl-ico" alt=""><span>C:\Recycled\Lost and found</span></div></div>
      <div class="lf-head"><img id="head-ico" alt=""><div><h1>Lost and found</h1><p>Everything people have dropped down the back of the desktop. If it is yours, claim it. Zob will check.</p></div></div>
      <div class="lf-items sunken-panel" id="items" role="list"></div>
      <fieldset class="lf-report"><legend>Report something lost</legend>
        <form id="form"><label for="what">Describe it:</label><input id="what" type="text" maxlength="60" placeholder="a blue mitten, my train of thought..." autocomplete="off"><button class="default" type="submit">Report it</button></form>
      </fieldset>
      <div class="lf-foot"><span id="count"></span><a class="c-btn c-btn--ghost" href="index.html">Back to the desktop</a></div>
      <div class="status-bar"><p class="status-bar-field" id="status">Ready</p><p class="status-bar-field">Zob is on duty</p></div>
    </div>
  </main>
  <script src="games.js"></script>
  <script src="shared.js"></script>
  <script>
    (function () {
      const C = window.Curio;
      C.unlock('lost');
      document.getElementById('ttl-ico').src = C.px('box', 16);
      document.getElementById('head-ico').src = C.px('box', 32);
      const BASE = [
        ['One left sock', 'striped, slightly crunchy', 'doc'],
        ['Your keys', 'no wait, these are someone else\'s', 'lock'],
        ['A perfectly round circle', 'scored 99.8%, then dropped', 'clock'],
        ['Somebody\'s train of thought', 'it was going somewhere important', 'run'],
        ['The TV remote', 'it was in the sofa the whole time', 'gamepad'],
        ['An umbrella', 'still slightly damp, mysteriously', 'globe'],
        ['The point', 'of a conversation from 2021', 'doc'],
        ['Half a password', 'the half without the emoji', 'lock'],
        ['A very small dragon', 'fed, watered, a bit bitey', 'zob'],
        ['The game you just lost', 'sorry. we all lose it eventually.', 'die'],
        ['Seven marbles', 'from the marble run. there were eight.', 'coin'],
        ['A good mood', 'found under the toy box. take it.', 'star']
      ];
      const REPLIES = ['That is not yours. Zob checked the label.', 'Yours! Zob hands it over with a little bow.', 'Zob squints. Zob is not convinced.', 'Claimed. Please sign the invisible form.', 'Somebody already claimed it. Twice.', 'Zob says it is yours if you really need it.'];
      const items = document.getElementById('items');
      const status = document.getElementById('status');
      const paint = () => {
        const mine = C.store.get('hub:lost', []);
        const all = [...mine.map((m) => [m, 'reported by you. Zob is keeping an eye out.', 'box', true]), ...BASE];
        document.getElementById('count').textContent = `${all.length} object${all.length === 1 ? '' : 's'}`;
        items.replaceChildren(...all.map(([name, note, ic, own]) => {
          const t = document.createElement('div');
          t.className = `lf-tag${own ? ' mine' : ''}`;
          t.setAttribute('role', 'listitem');
          t.innerHTML = '<img alt=""><b></b><small></small>';
          t.querySelector('img').src = C.px(ic, 32);
          t.querySelector('b').textContent = name;
          t.querySelector('small').textContent = note;
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = own ? 'Found it!' : 'Claim';
          b.addEventListener('click', () => {
            if (own) {
              C.store.set('hub:lost', C.store.get('hub:lost', []).filter((m) => m !== name));
              C.confetti(60); C.toast('Reunited. Zob is a little emotional.'); paint(); return;
            }
            const r = C.pick(REPLIES);
            status.textContent = r;
            C.toast(r, 2400);
            C.sfx(r.startsWith('Yours') || r.startsWith('Claimed') ? 'success' : 'error');
            if (r.startsWith('Yours')) t.classList.add('gone');
          });
          t.append(b);
          return t;
        }));
      };
      paint();
      document.getElementById('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const v = document.getElementById('what').value.trim();
        if (!v) { C.modal({ icon: 'warn', caption: 'Lost and found', title: '', body: 'Zob cannot look for nothing. He tried once.', buttons: [{ label: 'OK', value: 'ok' }] }); return; }
        const mine = C.store.get('hub:lost', []);
        mine.unshift(v.slice(0, 60));
        C.store.set('hub:lost', mine.slice(0, 8));
        document.getElementById('what').value = '';
        C.sfx('stamp');
        status.textContent = 'Tagged and added to the pile.';
        C.toast('Tagged and added to the pile.');
        paint();
      });
    })();
  </script>
</body>
</html>
