<!doctype html>
<html lang="en" class="z-wait">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zoble 98</title>
  <meta name="description" content="Zoble 98: a whole desktop of free little games, toys and odd corners of the internet. No sign-up, no ads, just poke at things.">
  <meta name="theme-color" content="#008080">
  <link rel="icon" href="icon.svg">
  <link rel="preload" href="zoble-98.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="zoble-98-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="hub.css">
</head>
<body data-nobar class="hub z98">
  <a class="skip" href="#icons">Skip to the desktop icons</a>
  <main class="desktop" id="desktop" aria-label="Zoble 98 desktop">
    <h1 class="sr">Zoble 98</h1>
    <div class="desk-bg" id="deskbg" aria-hidden="true"></div>
    <div class="desk-icons" id="icons" role="group" aria-label="Desktop icons"></div>
    <div class="windows" id="windows"></div>
  </main>
  <div class="taskbar" id="taskbar" role="toolbar" aria-label="Taskbar">
    <button class="start" id="start" type="button" aria-haspopup="menu" aria-expanded="false"><img class="z-px" id="startlogo" alt="" width="16" height="16"><b id="startword">Start</b></button>
    <span class="tb-sep" aria-hidden="true"></span>
    <div class="quick" id="quick" role="group" aria-label="Quick launch"></div>
    <span class="tb-sep tb-sep--q" aria-hidden="true"></span>
    <div class="tasks" id="tasks" role="group" aria-label="Open windows"></div>
    <div class="tray" id="tray" role="group" aria-label="Notification area"></div>
  </div>
  <script src="games.js"></script>
  <script src="shared.js"></script>
  <script src="hub.js"></script>
</body>
</html>
