<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Size of Space · Zoble</title>
  <meta name="description" content="Zoom from a hydrogen atom to the whole observable universe through 101 things drawn to scale. Compare any two, or test yourself in the size quiz.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="size-of-space">
  <div class="stage" id="stage">
    <canvas id="sky" role="img" aria-label="Objects drawn side by side at true relative scale"></canvas>
    <div class="intro" id="intro">
      <h1>Size of Space</h1>
      <p>From you to everything there is. Scroll, swipe, pinch or use the arrow keys. Go left to shrink down to an atom.</p>
    </div>
    <div class="modes" role="tablist" aria-label="Mode">
      <button type="button" role="tab" data-m="explore" aria-selected="true">Explore</button>
      <button type="button" role="tab" data-m="compare" aria-selected="false">Compare</button>
      <button type="button" role="tab" data-m="quiz" aria-selected="false">Quiz</button>
      <button type="button" class="idx-btn" id="idxBtn" aria-label="Index of all objects" title="Index (I)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="lens" id="lens" hidden></div>

    <section class="panel" id="panelExplore" aria-live="polite">
      <div class="info">
        <div class="tag" id="tag">On Earth</div>
        <h2 id="name">Human</h2>
        <div class="size" id="size">1.7 m</div>
        <div class="rel" id="rel"></div>
        <p class="fact" id="fact"></p>
      </div>
      <div class="ctrl">
        <button class="rb" id="prev" type="button" aria-label="Smaller">‹</button>
        <input type="range" id="slider" min="0" max="100" step="0.01" value="0" aria-label="Zoom level">
        <span class="count" id="count">1/101</span>
        <button class="rb" id="next" type="button" aria-label="Bigger">›</button>
        <button class="c-btn tour" id="tour" type="button">Tour</button>
      </div>
    </section>

    <section class="panel" id="panelCompare" hidden>
      <div class="cmp-row">
        <select class="c-input" id="cmpA" aria-label="First object"></select>
        <button class="rb" type="button" id="swap" aria-label="Swap">⇄</button>
        <select class="c-input" id="cmpB" aria-label="Second object"></select>
      </div>
      <p class="cmp-txt" id="cmpTxt"></p>
      <div class="c-row cmp-btns"><button class="c-btn c-btn--ghost" type="button" id="cmpRand">Random pair</button><button class="c-btn c-btn--ghost" type="button" id="cmpCopy">Copy fact</button></div>
    </section>

    <section class="panel" id="panelQuiz" hidden>
      <div class="q-head"><span id="qRound">Round 1 of 10</span><span id="qScore">Score 0</span></div>
      <div id="qBody"></div>
    </section>

    <aside class="drawer" id="drawer" hidden aria-label="Index of objects">
      <div class="drawer__head"><h2>All 101 things</h2><button class="rb" type="button" id="idxClose" aria-label="Close">✕</button></div>
      <input class="c-input" type="search" id="idxSearch" placeholder="Search" aria-label="Search objects">
      <p class="c-muted drawer__seen" id="seenTxt"></p>
      <div id="idxList"></div>
      <h3>Badges</h3>
      <div class="badges" id="badges"></div>
    </aside>
  </div>

  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="planets.js"></script>
  <script src="data.js"></script>
  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>
