<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Cat Exam · Zoble</title>
  <meta name="description" content="Prove you are a real cat in a gauntlet of five-second tests: knock things off tables, ignore humans, fit in tiny boxes.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="cat-exam" data-modes>
  <main class="c-wrap cx-wrap">
    <header class="cx-head">
      <h1 class="c-title cx-title">The Cat Exam</h1>
      <p class="c-sub">The Cat Council only admits real cats. Pass a run of five-second tests to prove you are one. Dogs need not apply.</p>
    </header>

    <section class="cx-board">
      <div class="cx-hud" id="hud" hidden>
        <div class="cx-lives" id="lives" aria-label="Lives"></div>
        <div class="cx-hudstat"><b id="round">1</b><span id="roundLabel">Test</span></div>
        <div class="cx-hudstat"><b id="score">0</b><span>Passed</span></div>
        <div class="cx-hudstat cx-adv"><b id="speed">x1.0</b><span>Speed</span></div>
      </div>

      <div class="cx-stagewrap" id="wrap">
        <svg class="cx-stage" id="stage" viewBox="0 0 400 300" role="application" aria-label="Exam room. Tap, click, or use Space, arrows and number keys."><g id="scene"></g></svg>

        <div class="cx-panel" id="intro">
          <svg class="cx-introcat" viewBox="-80 -150 160 160" aria-hidden="true"><g id="introCat"></g></svg>
          <h2 class="cx-ptitle" id="introTitle">Entrance exam</h2>
          <p class="cx-ptext" id="introText"></p>
          <div class="c-row">
            <button type="button" class="c-btn cx-go" id="startBtn">Begin the exam <span class="c-kbd">Enter</span></button>
            <button type="button" class="c-btn c-btn--ghost cx-adv" id="cardBtn">Report card</button>
          </div>
          <p class="cx-best" id="introBest"></p>
        </div>

        <div class="cx-banner" id="banner" aria-live="assertive"><b id="bannerSay"></b><span id="bannerHint"></span></div>
        <div class="cx-splash" id="splash" aria-live="polite"><svg viewBox="-80 -150 160 160" aria-hidden="true"><g id="splashCat"></g></svg><b id="splashBig"></b><span id="splashSmall"></span></div>
        <div class="cx-ready" id="ready"><b id="readyBig"></b><span id="readySmall"></span></div>

        <div class="cx-panel cx-panel--end" id="end" hidden>
          <div class="cx-diploma" id="diploma">
            <div class="cx-dhead">The Cat Council</div>
            <h2 class="cx-dtitle" id="endTitle"></h2>
            <p class="cx-dtext" id="endText"></p>
            <div class="cx-dstats"><div class="c-stat"><b id="endScore">0</b><span>Tests passed</span></div><div class="c-stat"><b id="endGrade">A</b><span id="endGradeLabel">Grade</span></div><div class="c-stat"><b id="endBest">0</b><span>Best</span></div></div>
            <svg class="cx-seal" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="#e63946"/><circle cx="40" cy="40" r="27" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/><ellipse cx="40" cy="48" rx="11" ry="9" fill="#fff"/><circle cx="28" cy="34" r="5" fill="#fff"/><circle cx="40" cy="29" r="5" fill="#fff"/><circle cx="52" cy="34" r="5" fill="#fff"/></svg>
          </div>
          <div class="c-row">
            <button type="button" class="c-btn cx-go" id="againBtn">Retake the exam</button>
            <button type="button" class="c-btn c-btn--ghost" id="shareBtn">Copy result</button>
          </div>
        </div>

        <div class="cx-timer" aria-hidden="true"><i id="timer"></i><svg class="cx-yarn" id="yarn" viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="#ff7aa2" stroke="#3a2418" stroke-width="2.5"/><path d="M5 10q10 6 20 0M4 17q11 6 22 0M9 25q6-10 4-22" stroke="#3a2418" stroke-width="1.6" fill="none" opacity=".6"/></svg></div>
      </div>
      <div class="cx-pad" id="pad" aria-label="On-screen controls">
        <button type="button" data-k="left" aria-label="Left">◀</button>
        <button type="button" data-k="act" aria-label="Action">Pounce</button>
        <button type="button" data-k="right" aria-label="Right">▶</button>
      </div>
      <p class="cx-tip c-muted">Tap or click the scene. Keys: <span class="c-kbd">Space</span> pounce, <span class="c-kbd">←</span><span class="c-kbd">→</span> move, <span class="c-kbd">1</span>-<span class="c-kbd">4</span> pick.</p>
    </section>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="art.js"></script>
  <script src="games.js"></script>
  <script src="game.js"></script>
</body>
</html>
