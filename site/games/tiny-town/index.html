<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tiny Town · Curio</title>
  <meta name="description" content="Tap the sea to build a cosy little town. Houses, roofs, arches and gardens arrange themselves.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <style>
    .c-wrap { padding-top: 10px; padding-bottom: 16px; }
    .tt-head { text-align: center; }
    .tt-head .c-title { margin: 0; font-size: clamp(26px, 4.5vw, 38px); }
    .tt-head .c-sub { margin: 2px 0 10px; font-size: 15px; }
    .tt-stage { position: relative; height: max(360px, calc(100dvh - var(--bar-h) - 230px)); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); background: #8ccbd6; }
    #cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .tt-tip { position: absolute; left: 12px; bottom: 10px; right: 12px; text-align: center; pointer-events: none; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.35); transition: opacity .6s ease; }
    .tt-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center; margin-top: 12px; }
    .tt-pal { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .sw { width: 30px; height: 30px; border-radius: 9px; cursor: pointer; border: 2px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); padding: 0; touch-action: manipulation; transition: transform .12s ease; font-size: 15px; line-height: 1; }
    .sw:hover { transform: translateY(-2px); }
    .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); transform: translateY(-2px); }
    .sw.mix { background: conic-gradient(#f6d47a, #e9776b, #b8a3d9, #8fc3e8, #a9c98a, #f6d47a); }
    .tt-mode { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
    .tt-mode button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink-2); touch-action: manipulation; }
    .tt-mode button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    #cv.rm { cursor: not-allowed; }
    .tt-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .tt-btns .c-btn { padding: 8px 14px; font-size: 14px; }
    @media (max-width: 520px) {
      .tt-stage { height: max(340px, calc(100dvh - var(--bar-h) - 300px)); }
      .sw { width: 28px; height: 28px; }
      .tt-btns .c-btn { padding: 8px 11px; font-size: 13px; }
    }
  </style>
</head>
<body data-game="tiny-town">
  <main class="c-wrap">
    <div class="tt-head">
      <h1 class="c-title">Tiny Town</h1>
      <p class="c-sub">Tap the sea to build. Stack up, and the houses sort out their own roofs, doors, arches and gardens.</p>
    </div>
    <div class="tt-stage" id="stage">
      <canvas id="cv" role="img" aria-label="An isometric seaside town made of coloured blocks. Click the water or a block to build. Switch to Remove, right-click or long-press to remove. Pinch to zoom."></canvas>
      <div class="tt-tip" id="tip">Click to build · Remove tool (X), right-click or long-press to remove · pinch to zoom</div>
    </div>
    <div class="tt-tools">
      <div class="tt-mode" role="group" aria-label="Tool">
        <button type="button" id="mBuild" aria-pressed="true" title="Build (B)">🧱 Build</button>
        <button type="button" id="mRemove" aria-pressed="false" title="Remove (X)">🧹 Remove</button>
      </div>
      <div class="tt-pal" id="pal" role="toolbar" aria-label="Block colour"></div>
      <div class="tt-btns">
        <button class="c-btn c-btn--ghost" type="button" id="undo" aria-label="Undo">↶ Undo</button>
        <button class="c-btn c-btn--ghost" type="button" id="rotL" aria-label="Rotate view left">⟲</button>
        <button class="c-btn c-btn--ghost" type="button" id="rotR" aria-label="Rotate view right">⟳</button>
        <button class="c-btn c-btn--ghost" type="button" id="night">🌙 Night</button>
        <button class="c-btn c-btn--ghost" type="button" id="clear">🌊 Clear</button>
        <button class="c-btn" type="button" id="png">📷 Save PNG</button>
      </div>
    </div>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script>
  (() => {
    const N = 12, H = 10, K = 0.86;
    const PAL = ['#f4e9d8', '#fbfaf6', '#f6d47a', '#f4a96a', '#e9776b', '#eda3b8', '#b8a3d9', '#8fc3e8', '#6fbfb3', '#a9c98a', '#c9745a', '#8e9aa8'];
    const NAMES = ['Cream', 'Chalk', 'Butter', 'Apricot', 'Coral', 'Rose', 'Lilac', 'Sky', 'Teal', 'Sage', 'Brick', 'Slate'];
    const SCALE = [392, 440, 494, 587, 659, 784, 880, 988, 1175, 1319];
    const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
    const cv = document.getElementById('cv'), g = cv.getContext('2d');
    const stage = document.getElementById('stage');
    const shA = document.createElement('canvas'), shB = document.createElement('canvas');
    let W = 0, Hc = 0, dpr = 1, s = 30, ox = 0, oy = 0;
    let grid = new Uint8Array(N * N * H);
    let colour = 0, ang = Math.PI / 4, angTarget = ang, cs = Math.cos(ang), sn = Math.sin(ang);
    let night = 0, nightTarget = 0;
    let undo = [], cells = [], hits = [], glows = [], puffs = [], drops = new Map();
    let hover = null, shadowDirty = true, t = 0, stars = [];
    let s0 = 30, zoom = 1, panX = 0, panY = 0, rmMode = false, spinAcc = 0;
    const at = (x, y, z) => (x < 0 || y < 0 || x >= N || y >= N || z < 0 || z >= H) ? 0 : grid[(z * N + y) * N + x];
    const put = (x, y, z, v) => { grid[(z * N + y) * N + x] = v; };
    const hash = (x, y, z, k = 0) => {
      let h = (x * 374761 + y * 668265 + z * 214748 + k * 127412 + 99991) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177); h = Math.imul(h ^ (h >>> 16), 668265263); h ^= h >>> 15;
      return ((h >>> 0) % 100000) / 100000;
    };
    const rgbOf = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    const RGB = PAL.map(rgbOf);
    const ROOF = RGB.map((c) => [c[0] * 0.42 + 120 * 0.5, c[1] * 0.38 + 52 * 0.5, c[2] * 0.36 + 44 * 0.5]);
    const STONE = [196, 188, 172], CREAM = [250, 244, 230], GLASS = [62, 92, 122], LIT = [255, 210, 120], WOOD = [120, 74, 50];
    const NIGHT = [22, 30, 66];
    function col(c, f = 1, a = 1) {
      let r = c[0] * f, gg = c[1] * f, b = c[2] * f;
      const k = night * 0.6;
      r = r * (1 - k) + NIGHT[0] * k; gg = gg * (1 - k) + NIGHT[1] * k; b = b * (1 - k) + NIGHT[2] * k;
      return a < 1 ? `rgba(${r | 0},${gg | 0},${b | 0},${a})` : `rgb(${r | 0},${gg | 0},${b | 0})`;
    }
    function P(x, y, z) {
      const cx = x - N / 2, cy = y - N / 2;
      return [ox + (cx * cs - cy * sn) * s, oy + (cx * sn + cy * cs) * s * 0.5 - z * s * K];
    }
    const visN = (nx, ny, nz) => (nx * sn + ny * cs) * 2 * K + nz > 0.001;
    const rotX = (nx, ny) => nx * cs - ny * sn;
    function poly(pts, fill, seam = true) {
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
      g.closePath(); g.fillStyle = fill; g.fill();
      if (seam) { g.strokeStyle = fill; g.lineWidth = 0.7; g.stroke(); }
    }
    function mkFace(x, y, z, d) {
      const [nx, ny] = DIRS[d];
      let ax, ay, bx, by;
      if (d === 0) { ax = x + 1; ay = y; bx = x + 1; by = y + 1; }
      else if (d === 1) { ax = x + 1; ay = y + 1; bx = x; by = y + 1; }
      else if (d === 2) { ax = x; ay = y + 1; bx = x; by = y; }
      else { ax = x; ay = y; bx = x + 1; by = y; }
      return { ax, ay, bx, by, nx, ny, z };
    }
    const FP = (f, u, v, d = 0) => P(f.ax + (f.bx - f.ax) * u + f.nx * d, f.ay + (f.by - f.ay) * u + f.ny * d, f.z + v);
    const fpoly = (f, uv, fill, d = 0, seam = false) => poly(uv.map(([u, v]) => FP(f, u, v, d)), fill, seam);
    const frect = (f, u0, v0, u1, v1, fill, d = 0) => fpoly(f, [[u0, v0], [u1, v0], [u1, v1], [u0, v1]], fill, d);
    function archUV(u0, u1, v0, vTop, rise, n = 10) {
      const pts = [[u0, v0], [u1, v0], [u1, vTop]];
      for (let i = 1; i < n; i++) { const a = i / n; pts.push([u1 - (u1 - u0) * a, vTop + Math.sin(Math.PI * a) * rise]); }
      pts.push([u0, vTop]);
      return pts;
    }
    function archFace(f, fill) {
      g.beginPath();
      [[0, 0], [0, 1], [1, 1], [1, 0]].map(([u, v]) => FP(f, u, v)).forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
      g.closePath();
      archUV(0.14, 0.86, 0, 0, 0.62).map(([u, v]) => FP(f, u, v)).forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
      g.closePath();
      g.fillStyle = fill; g.fill('evenodd');
    }
    function wallShade(nx, ny) { return 0.93 - 0.17 * rotX(nx, ny); }

    function windowAt(f, u0, v0, u1, v1, lit, shade, kind, shutter) {
      const mid = (u0 + u1) / 2;
      if (kind === 1) {
        fpoly(f, archUV(u0 - 0.04, u1 + 0.04, v0 - 0.04, v1 - 0.06, 0.12), col(CREAM, shade));
        fpoly(f, archUV(u0, u1, v0, v1 - 0.06, 0.1), glassCol(lit, shade));
      } else {
        frect(f, u0 - 0.04, v0 - 0.04, u1 + 0.04, v1 + 0.04, col(CREAM, shade));
        frect(f, u0, v0, u1, v1, glassCol(lit, shade));
        frect(f, u0, (v0 + v1) / 2 - 0.012, u1, (v0 + v1) / 2 + 0.012, col(CREAM, shade));
      }
      if (night < 0.5) fpoly(f, [[u0, v1 - 0.02], [u0 + (u1 - u0) * 0.45, v1 - 0.02], [u0, v0 + (v1 - v0) * 0.35]], `rgba(255,255,255,${0.22 * (1 - night * 2)})`);
      frect(f, mid - 0.011, v0, mid + 0.011, v1 - (kind === 1 ? 0 : 0), col(CREAM, shade));
      if (shutter) {
        const sc = shutter;
        frect(f, u0 - 0.15, v0 - 0.02, u0 - 0.05, v1 + 0.02, col(sc, shade));
        frect(f, u1 + 0.05, v0 - 0.02, u1 + 0.15, v1 + 0.02, col(sc, shade));
      }
      frect(f, u0 - 0.07, v0 - 0.09, u1 + 0.07, v0 - 0.04, col(STONE, shade * 0.95), 0.03);
      if (lit && night > 0.05) glows.push([FP(f, mid, (v0 + v1) / 2, 0.05), 1]);
    }
    function glassCol(lit, shade) {
      if (lit) {
        const k = night;
        const r = GLASS[0] * shade * (1 - k) + LIT[0] * k, gg = GLASS[1] * shade * (1 - k) + LIT[1] * k, b = GLASS[2] * shade * (1 - k) + LIT[2] * k;
        return `rgb(${r | 0},${gg | 0},${b | 0})`;
      }
      return col(GLASS, shade * 0.9);
    }
    function doorSide(x, y) {
      const start = Math.floor(hash(x, y, 0, 7) * 4);
      for (let i = 0; i < 4; i++) {
        const d = (start + i) % 4;
        if (!at(x + DIRS[d][0], y + DIRS[d][1], 0)) return d;
      }
      return -1;
    }
    const SHUT = [[70, 120, 110], [60, 90, 140], [150, 70, 70], [90, 120, 70]];

    function drawWall(x, y, z, d, c, f, floating, door) {
      const shade = wallShade(f.nx, f.ny);
      if (floating) {
        archFace(f, col(c, shade));
        const arc = [];
        for (let i = 0; i <= 12; i++) { const a = i / 12; arc.push(FP(f, 0.14 + 0.72 * a, Math.sin(Math.PI * a) * 0.62)); }
        g.beginPath(); arc.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
        g.strokeStyle = col(STONE, shade * 0.85); g.lineWidth = Math.max(1.5, s * 0.06); g.stroke();
        const lit = hash(x, y, z, d + 20) < 0.72;
        windowAt(f, 0.42, 0.74, 0.58, 0.9, lit, shade, 0, null);
        return;
      }
      fpoly(f, [[0, 0], [1, 0], [1, 1], [0, 1]], col(c, shade), 0, true);
      const hv = hash(x, y, z, d);
      if (z === 0) frect(f, 0, 0, 1, 0.12, col([c[0] * 0.5 + STONE[0] * 0.5, c[1] * 0.5 + STONE[1] * 0.5, c[2] * 0.5 + STONE[2] * 0.5], shade * 0.88));
      if (door) {
        fpoly(f, archUV(0.33, 0.67, 0.12, 0.5, 0.12), col(CREAM, shade));
        fpoly(f, archUV(0.37, 0.63, 0.12, 0.48, 0.1), col(WOOD, shade));
        frect(f, 0.495, 0.14, 0.505, 0.55, col(WOOD, shade * 0.75));
        const st = col(STONE, shade * 1.02), top = col(STONE, 1.08);
        poly([FP(f, 0.28, 0.12, 0), FP(f, 0.72, 0.12, 0), FP(f, 0.72, 0.12, 0.24), FP(f, 0.28, 0.12, 0.24)], top);
        poly([FP(f, 0.28, 0, 0.24), FP(f, 0.72, 0, 0.24), FP(f, 0.72, 0.12, 0.24), FP(f, 0.28, 0.12, 0.24)], st);
        poly([FP(f, 0.24, 0.0, 0.24), FP(f, 0.76, 0.0, 0.24), FP(f, 0.76, 0.0, 0.42), FP(f, 0.24, 0.0, 0.42)], col(STONE, 0.95));
        const lamp = FP(f, 0.76, 0.5, 0.04);
        g.fillStyle = night > 0.2 ? `rgba(255,220,140,${night})` : col([60, 60, 60]);
        g.beginPath(); g.arc(lamp[0], lamp[1], Math.max(1.5, s * 0.045), 0, 7); g.fill();
        if (night > 0.05) glows.push([lamp, 0.8]);
        return;
      }
      const lit = hash(x, y, z, d + 20) < 0.72;
      const kind = hv < 0.25 ? 1 : 0;
      const shutter = hv > 0.62 ? SHUT[Math.floor(hash(x, y, z, 5) * 4)] : null;
      if (z === 0 || hv < 0.45 || shutter) {
        const w = shutter ? 0.17 : 0.18;
        windowAt(f, 0.5 - w, z === 0 ? 0.36 : 0.32, 0.5 + w, z === 0 ? 0.74 : 0.76, lit, shade, kind, shutter);
      } else {
        windowAt(f, 0.14, 0.34, 0.4, 0.76, lit, shade, kind, null);
        windowAt(f, 0.6, 0.34, 0.86, 0.76, hash(x, y, z, d + 40) < 0.7, shade, kind, null);
      }
      if (hv > 0.85 && z > 0) {
        frect(f, 0.3, 0.16, 0.7, 0.24, col(WOOD, shade), 0.05);
        for (let i = 0; i < 4; i++) {
          const p = FP(f, 0.34 + i * 0.105, 0.27, 0.05);
          g.fillStyle = col(i % 2 ? [240, 110, 130] : [255, 200, 80]);
          g.beginPath(); g.arc(p[0], p[1], Math.max(1.2, s * 0.035), 0, 7); g.fill();
        }
      }
    }

    function drawGable(x, y, z, c, axisX) {
      const rh = 0.52, ov = 0.1, top = z + 1;
      const r = ROOF[c.idx];
      let pts, ends;
      if (axisX) {
        const l = at(x - 1, y, z) ? 0 : 0.07, rr = at(x + 1, y, z) ? 0 : 0.07;
        const x0 = x - l, x1 = x + 1 + rr;
        pts = [
          { p: [[x0, y - ov, top - 0.07], [x1, y - ov, top - 0.07], [x1, y + 0.5, top + rh], [x0, y + 0.5, top + rh]], n: [0, -1] },
          { p: [[x0, y + 1 + ov, top - 0.07], [x1, y + 1 + ov, top - 0.07], [x1, y + 0.5, top + rh], [x0, y + 0.5, top + rh]], n: [0, 1] }
        ];
        ends = [];
        if (!at(x - 1, y, z)) ends.push({ p: [[x, y, top], [x, y + 1, top], [x, y + 0.5, top + rh]], n: [-1, 0] });
        if (!at(x + 1, y, z)) ends.push({ p: [[x + 1, y, top], [x + 1, y + 1, top], [x + 1, y + 0.5, top + rh]], n: [1, 0] });
      } else {
        const l = at(x, y - 1, z) ? 0 : 0.07, rr = at(x, y + 1, z) ? 0 : 0.07;
        const y0 = y - l, y1 = y + 1 + rr;
        pts = [
          { p: [[x - ov, y0, top - 0.07], [x - ov, y1, top - 0.07], [x + 0.5, y1, top + rh], [x + 0.5, y0, top + rh]], n: [-1, 0] },
          { p: [[x + 1 + ov, y0, top - 0.07], [x + 1 + ov, y1, top - 0.07], [x + 0.5, y1, top + rh], [x + 0.5, y0, top + rh]], n: [1, 0] }
        ];
        ends = [];
        if (!at(x, y - 1, z)) ends.push({ p: [[x, y, top], [x + 1, y, top], [x + 0.5, y, top + rh]], n: [0, -1] });
        if (!at(x, y + 1, z)) ends.push({ p: [[x, y + 1, top], [x + 1, y + 1, top], [x + 0.5, y + 1, top + rh]], n: [0, 1] });
      }
      const hitPolys = [];
      for (const e of ends) {
        if (!visN(e.n[0], e.n[1], 0)) continue;
        const sp = e.p.map((q) => P(q[0], q[1], q[2]));
        poly(sp, col(c, wallShade(e.n[0], e.n[1])));
        hitPolys.push(sp);
        const m = P(e.p[2][0] * 0.98 + e.p[0][0] * 0.01 + e.p[1][0] * 0.01 + e.n[0] * 0.01, e.p[2][1] * 0.98 + e.p[0][1] * 0.01 + e.p[1][1] * 0.01 + e.n[1] * 0.01, top + rh * 0.38);
        g.fillStyle = hash(x, y, z, 31) < 0.5 ? col(CREAM, wallShade(e.n[0], e.n[1])) : glassCol(false, 1);
        g.beginPath(); g.arc(m[0], m[1], s * 0.07, 0, 7); g.fill();
      }
      pts.sort((a, b) => (a.n[0] * sn + a.n[1] * cs) - (b.n[0] * sn + b.n[1] * cs));
      for (const sl of pts) {
        const nz = 0.55, nh = 0.83;
        if (!visN(sl.n[0] * nh, sl.n[1] * nh, nz)) continue;
        const sp = sl.p.map((q) => P(q[0], q[1], q[2]));
        const f = 0.95 - 0.2 * rotX(sl.n[0], sl.n[1]) + 0.08 * (sl.n[0] * sn + sl.n[1] * cs);
        poly(sp, col(r, f));
        hitPolys.push(sp);
        g.strokeStyle = col(r, f * 0.82); g.lineWidth = Math.max(0.8, s * 0.025);
        for (let i = 1; i < 4; i++) {
          const a = i / 4;
          const p0 = [sp[0][0] + (sp[3][0] - sp[0][0]) * a, sp[0][1] + (sp[3][1] - sp[0][1]) * a];
          const p1 = [sp[1][0] + (sp[2][0] - sp[1][0]) * a, sp[1][1] + (sp[2][1] - sp[1][1]) * a];
          g.beginPath(); g.moveTo(p0[0], p0[1]); g.lineTo(p1[0], p1[1]); g.stroke();
        }
        g.strokeStyle = col(r, f * 0.7); g.lineWidth = Math.max(1, s * 0.04);
        g.beginPath(); g.moveTo(sp[0][0], sp[0][1]); g.lineTo(sp[1][0], sp[1][1]); g.stroke();
      }
      if (hash(x, y, z, 9) < 0.32) {
        const cx = x + (axisX ? 0.68 : 0.28), cy = y + (axisX ? 0.28 : 0.68);
        box(cx, cy, top + 0.15, 0.16, 0.16, rh + 0.16, [170, 96, 80]);
      }
      return hitPolys;
    }
    function box(x, y, z0, wx, wy, h, c) {
      const faces = [
        { n: [1, 0], p: [[x + wx, y, z0], [x + wx, y + wy, z0], [x + wx, y + wy, z0 + h], [x + wx, y, z0 + h]] },
        { n: [-1, 0], p: [[x, y, z0], [x, y + wy, z0], [x, y + wy, z0 + h], [x, y, z0 + h]] },
        { n: [0, 1], p: [[x, y + wy, z0], [x + wx, y + wy, z0], [x + wx, y + wy, z0 + h], [x, y + wy, z0 + h]] },
        { n: [0, -1], p: [[x, y, z0], [x + wx, y, z0], [x + wx, y, z0 + h], [x, y, z0 + h]] }
      ];
      for (const f of faces) if (visN(f.n[0], f.n[1], 0)) poly(f.p.map((q) => P(q[0], q[1], q[2])), col(c, wallShade(f.n[0], f.n[1])));
      poly([[x, y], [x + wx, y], [x + wx, y + wy], [x, y + wy]].map((q) => P(q[0], q[1], z0 + h)), col(c, 0.7));
    }
    function drawSpire(x, y, z, c) {
      const ov = 0.08, top = z + 1, apex = [x + 0.5, y + 0.5, top + 1.05];

    document.getElementById('mRemove').addEventListener('click', () => setMode(true));
    cv.addEventListener('wheel', (e) => {
      const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const unit = e.deltaMode === 1 ? 16 : 1;
      if (e.ctrlKey) { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * unit * 0.01), mx, my); return; }
      if (zoom > 1.001) { e.preventDefault(); panX -= e.deltaX * unit; panY -= e.deltaY * unit; place2(); return; }
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        e.preventDefault();
        spinAcc += e.deltaX * unit;
        if (Math.abs(spinAcc) > 140) { rotate(spinAcc > 0 ? 1 : -1); spinAcc = 0; }
      }
    }, { passive: false });
    addEventListener('curio:touchpad', (e) => { if (e.detail) Curio.toast('Touchpad mode: click to build, pinch to zoom, two-finger swipe sideways to rotate. Remove tool is X', 3800); });
    if (!Curio.touchpad && !Curio.store.get('tp-hint-tiny-town', false) && matchMedia('(pointer: fine)').matches) { Curio.store.set('tp-hint-tiny-town', true); setTimeout(() => Curio.toast('Tip: on a laptop touchpad, turn on Touchpad mode in the top bar. Pinch zooms, two-finger swipe rotates', 4200), 1800); }
    function paintPal() { sws.forEach((b, i) => b.setAttribute('aria-pressed', String(i === colour))); }

    function rotate(dir) { angTarget += dir * Math.PI / 2; save(); tone(dir > 0 ? 520 : 440, 0.25, 'sine', 0.05); setTimeout(() => tone(dir > 0 ? 660 : 350, 0.2, 'sine', 0.04), 90); }
    document.getElementById('rotL').addEventListener('click', () => rotate(-1));
    document.getElementById('rotR').addEventListener('click', () => rotate(1));
    const nightB = document.getElementById('night');
    function paintNight() { nightB.textContent = nightTarget ? '☀️ Day' : '🌙 Night'; }
    function toggleNight() { nightTarget = nightTarget ? 0 : 1; paintNight(); save(); tone(nightTarget ? 330 : 660, 0.4, 'sine', 0.05); }
    nightB.addEventListener('click', toggleNight);
    function doUndo() {
      if (!undo.length) { Curio.toast('Nothing to undo'); return; }
      grid = undo.pop(); changed(); tone(300, 0.12, 'sine', 0.06);
    }
    document.getElementById('undo').addEventListener('click', doUndo);
    document.getElementById('clear').addEventListener('click', () => {
      if (!grid.some((v) => v)) return;
      snapshot(); grid = new Uint8Array(N * N * H); changed();
      Curio.toast('Back to open sea. Undo brings the town back.');
      tone(260, 0.5, 'sine', 0.06);
    });
    document.getElementById('png').addEventListener('click', () => {
      const h = hover; hover = null; render(); hover = h;
      cv.toBlob((b) => {
        if (!b) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download = 'tiny-town.png'; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        Curio.toast('Postcard saved');
      });
    });
    addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('input,textarea')) return;
      const k = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); doUndo(); }
      else if (k === 'q') rotate(-1);
      else if (k === 'e' || k === 'r') rotate(1);
      else if (k === 'n') toggleNight();
      else if (k === 'b') setMode(false);
      else if (k === 'x' || k === 'delete' || k === 'backspace') { e.preventDefault(); setMode(true); }
      else if (k === '[' || k === ']') { colour = (colour + (k === ']' ? 1 : PAL.length)) % (PAL.length + 1); paintPal(); save(); tone(SCALE[colour % SCALE.length], 0.1, 'sine', 0.05); }
      else if (k === '+' || k === '=') zoomAt(1.2, W / 2, Hc / 2);
      else if (k === '-' || k === '_') zoomAt(1 / 1.2, W / 2, Hc / 2);
      else if (k === '0') { zoom = 1; place2(); }
    });

    let last = performance.now(), raf = 0;
    function frame(now) {
      raf = 0;
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; t += dt;
      if (Math.abs(angTarget - ang) > 0.0005) {
        ang += (angTarget - ang) * Math.min(1, dt * 7);
        if (Math.abs(angTarget - ang) < 0.0005) ang = angTarget;
        cs = Math.cos(ang); sn = Math.sin(ang); sortCells(); shadowDirty = true;
      }
      if (night !== nightTarget) { night += Math.sign(nightTarget - night) * dt * 1.6; if (Math.abs(night - nightTarget) < 0.02) night = nightTarget; }
      render();
      if (!document.hidden) raf = requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); } });
    addEventListener('resize', resize);
    load(); paintPal(); paintNight();
    cs = Math.cos(ang); sn = Math.sin(ang);
    resize();
    raf = requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
