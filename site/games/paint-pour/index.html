<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paint Pour · Zoble</title>
  <meta name="description" content="Fluid art without the mess. Pour acrylics onto a canvas, swirl them, tilt it, grow cells and save your masterpiece.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <style>
    .c-wrap { padding-top: 12px; padding-bottom: 16px; }
    .pp-head { text-align: center; }
    .pp-head .c-title { margin: 0; font-size: clamp(26px, 4.5vw, 38px); }
    .pp-head .c-sub { margin: 2px 0 10px; font-size: 15px; }
    .pp-stage { position: relative; height: max(330px, calc(100dvh - var(--bar-h) - 250px)); perspective: 1100px; }
    .pp-tilt { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; transition: transform .35s cubic-bezier(.2, .9, .3, 1.2); box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 18px 40px -12px rgba(40, 30, 20, .45); background: #f6f1e7; }
    .pp-tilt::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 6px rgba(255,255,255,.55), inset 0 0 0 7px rgba(0,0,0,.08); }
    #paint { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    .pp-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); pointer-events: none; background: rgba(20,16,12,.55); color: #fff; padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 700; transition: opacity .6s ease; white-space: nowrap; }
    .pp-hint.gone { opacity: 0; }
    .pp-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center; margin-top: 12px; }
    .pp-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
    .seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink-2); touch-action: manipulation; }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .cup { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--surface); cursor: pointer; box-shadow: 0 0 0 1.5px var(--line); transition: transform .12s ease; touch-action: manipulation; padding: 0; }
    .cup:hover { transform: scale(1.1); }
    .cup[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.1); }
    .chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; touch-action: manipulation; }
    .chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
    .chip i { display: inline-flex; height: 12px; border-radius: 4px; overflow: hidden; }
    .chip i b { width: 8px; height: 12px; }
    .pad { display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(2, 30px); gap: 3px; }
    .pad button { border: 0; border-radius: 9px; background: var(--surface-2); cursor: pointer; font-size: 14px; font-weight: 900; color: var(--ink-2); touch-action: none; user-select: none; -webkit-user-select: none; }
    .pad button:active, .pad button.on { background: var(--accent); color: #fff; }
    .pad .u { grid-column: 2; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
    .pp-tools .c-btn { padding: 8px 15px; font-size: 14px; }
    .lbl { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
    html[data-mode="simple"] .adv-only, html[data-mode="advanced"] .simple-only { display: none !important; }
    body[data-game="paint-pour"] { background-color: color-mix(in oklab, #e9e2d4 40%, var(--bg)); background-image: radial-gradient(circle at 8% 18%, color-mix(in oklab, #ef476f 30%, transparent) 0 7px, transparent 8px), radial-gradient(circle at 92% 30%, color-mix(in oklab, #20c4cb 30%, transparent) 0 11px, transparent 12px), radial-gradient(circle at 85% 82%, color-mix(in oklab, #ffd166 40%, transparent) 0 6px, transparent 7px), radial-gradient(circle at 12% 74%, color-mix(in oklab, #7a4fe0 25%, transparent) 0 9px, transparent 10px), radial-gradient(circle at 50% 96%, color-mix(in oklab, #ff9f1c 25%, transparent) 0 5px, transparent 6px); background-size: 420px 380px; }
    .pp-brush { font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", "Snell Roundhand", cursive; font-weight: 700; font-size: clamp(36px, 6vw, 54px) !important; letter-spacing: .01em; color: #9b1d64; position: relative; display: inline-block; padding: 0 10px; }
    .pp-drips { position: absolute; left: 12%; right: 12%; bottom: -10px; height: 16px; background: radial-gradient(circle at 10% 0, #ef476f 0 5px, transparent 6px), radial-gradient(ellipse at 10% 40%, #ef476f 0 3px, transparent 4px), radial-gradient(circle at 46% 0, #ff9f1c 0 6px, transparent 7px), radial-gradient(ellipse at 46% 60%, #ff9f1c 0 3px, transparent 4px), radial-gradient(circle at 80% 0, #20c4cb 0 5px, transparent 6px), radial-gradient(ellipse at 80% 50%, #20c4cb 0 2.5px, transparent 3.5px); animation: pp-drip 3.5s ease-in-out infinite; transform-origin: top; }
    @keyframes pp-drip { 50% { transform: scaleY(1.35); } }
    :root[data-look="midnight"] .pp-brush, :root[data-look="arcade"] .pp-brush { color: #ff7ad9; }
    @media (prefers-color-scheme: dark) { :root:not([data-look]) .pp-brush { color: #ff7ad9; } }
    .pp-tilt { border: 10px solid #fdfbf6; outline: 2px solid color-mix(in oklab, #6b4a22 30%, transparent); }
    .pp-stage::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 46%; height: 14px; transform: translateX(-50%); background: linear-gradient(180deg, #8a5a2a, #5e3c1a); border-radius: 0 0 8px 8px; z-index: -1; }
    .pp-surprise { background: linear-gradient(90deg, #ef476f, #ff9f1c, #ffd166); color: #2b1145; border: 0; }
    html[data-mode="simple"] .pp-tools { gap: 12px; }
    html[data-mode="simple"] #palettes .chip { padding: 9px 15px; font-size: 15px; }
    html[data-mode="simple"] #palettes .chip i b { width: 12px; height: 18px; }
    html[data-mode="simple"] #palettes .chip i { height: 18px; }
    html[data-mode="simple"] .pp-tools .c-btn { padding: 11px 20px; font-size: 16px; }
    html[data-mode="simple"] .pp-stage { height: max(330px, calc(100dvh - var(--bar-h) - 270px)); }
    .pp-order { max-width: 760px; margin: 0 auto 10px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 8px 12px; border-radius: 4px; background: #fffdf3; color: #2b2118; border: 1px solid #e3d6b8; box-shadow: 3px 4px 0 rgba(60, 40, 10, .15); transform: rotate(-.5deg); font-size: 14px; }
    .pp-order__tag { grid-row: span 3; font: 800 11px/1.2 ui-monospace, monospace; text-transform: uppercase; letter-spacing: .1em; background: #ef476f; color: #fff; padding: 6px 8px; border-radius: 4px; text-align: center; }
    .pp-order__tag b { display: block; font-size: 18px; }
    .pp-order p { margin: 0; font-weight: 700; }
    .pp-order ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; }
    .pp-order li::before { content: '○ '; }
    .pp-order li.ok { color: #1d8a52; } .pp-order li.ok::before { content: '● '; }
    .pp-order__btns { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .pp-order__btns .c-btn { padding: 5px 12px; font-size: 13px; }
    .pp-order__stat { font-size: 12px; color: #7a6040; margin-left: auto; }
    .pp-gal { position: fixed; inset: 0; z-index: 1200; display: grid; place-items: center; padding: 16px; background: rgba(20, 14, 8, .55); }
    .pp-gal__box { width: min(760px, 100%); max-height: 82dvh; overflow: auto; background: #f4efe4; color: #2b2118; border-radius: 6px; padding: 14px 16px; }
    .pp-gal__box header { display: flex; align-items: center; justify-content: space-between; }
    .pp-gal__box h2 { margin: 0; font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 32px; }
    .pp-gal__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; margin-top: 10px; }
    .pp-gal__grid figure { margin: 0; position: relative; padding: 8px; background: #fff; box-shadow: 0 0 0 6px #3a2a1a, 0 8px 18px rgba(0, 0, 0, .3); }
    .pp-gal__grid img { width: 100%; display: block; }
    .pp-gal__grid figcaption { font-size: 11px; text-align: center; margin-top: 4px; }
    .pp-gal__dl, .pp-gal__del { position: absolute; top: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .6); color: #fff; cursor: pointer; display: grid; place-items: center; text-decoration: none; font-size: 13px; }
    .pp-gal__dl { left: 4px; } .pp-gal__del { right: 4px; }
    @media (prefers-reduced-motion: reduce) { .pp-drips { animation: none; } }
    @media (max-width: 560px) {
      .pp-order { grid-template-columns: 1fr; } .pp-order__tag { grid-row: auto; display: flex; gap: 6px; justify-content: center; align-items: center; } .pp-order__tag b { display: inline; font-size: 13px; }
      .pp-head .c-sub { font-size: 13px; }
      .pp-stage { height: max(300px, calc(100dvh - var(--bar-h) - 330px)); }
      .cup { width: 28px; height: 28px; }
    }
  </style>
</head>
<body data-game="paint-pour" data-modes>
  <main class="c-wrap">
    <div class="pp-head">
      <h1 class="c-title pp-brush">Paint Pour<span class="pp-drips" aria-hidden="true"></span></h1>
      <p class="c-sub">Hold to pour, drag to swirl, tilt to let it run. No smock required.</p>
    </div>
    <div class="pp-order adv-only" id="order" aria-live="polite">
      <div class="pp-order__tag">Commission <b id="ordN">#1</b></div>
      <p id="ordText"></p>
      <ul id="ordReq"></ul>
      <div class="pp-order__btns"><button type="button" class="c-btn" id="deliver">📦 Deliver</button><button type="button" class="c-btn c-btn--ghost" id="skipOrd">Another client</button><span class="pp-order__stat" id="ordStat"></span></div>
    </div>
    <div class="pp-stage" id="stage">
      <div class="pp-tilt" id="tilt">
        <canvas id="paint" role="img" aria-label="A canvas covered in poured acrylic paint. Hold to pour paint, drag to swirl it."></canvas>
      </div>
      <div class="pp-hint" id="hint">Hold anywhere to pour</div>
    </div>
    <div class="pp-tools">
      <div class="pp-group">
        <div class="seg" role="group" aria-label="Tool">
          <button type="button" data-tool="pour" aria-pressed="true" title="Pour (P)">🫗 Pour</button>
          <button type="button" data-tool="swirl" aria-pressed="false" title="Swirl (S)">🌀 Swirl</button>
        </div>
        <div class="pp-group adv-only" id="cups" role="group" aria-label="Paint cup"></div>
      </div>
      <div class="pp-group adv-only">
        <span class="lbl">Tilt</span>
        <div class="pad" id="pad" aria-label="Tilt the canvas">
          <button type="button" class="u" data-tx="0" data-ty="1" aria-label="Tilt up">▲</button>
          <button type="button" class="l" data-tx="-1" data-ty="0" aria-label="Tilt left">◀</button>
          <button type="button" class="d" data-tx="0" data-ty="-1" aria-label="Tilt down">▼</button>
          <button type="button" class="r" data-tx="1" data-ty="0" aria-label="Tilt right">▶</button>
        </div>
        <button type="button" class="chip" id="cells" aria-pressed="false" title="Cells (C)">🫧 Cells</button>
      </div>
      <div class="pp-group" id="palettes" role="group" aria-label="Palettes"></div>
      <div class="pp-group">
        <button type="button" class="c-btn pp-surprise" id="auto" title="Surprise pour (R)">✨ Surprise pour</button>
        <button type="button" class="c-btn c-btn--ghost" id="clear" title="Clean (X)">🧽 Clean</button>
        <button type="button" class="c-btn c-btn--ghost adv-only" id="save">💾 Save PNG</button>
        <button type="button" class="c-btn c-btn--ghost adv-only" id="keep" title="Keep in the gallery (K)">🖼️ Keep</button>
        <button type="button" class="c-btn c-btn--ghost adv-only" id="galBtn" title="Gallery (G)">🗂️ Gallery</button>
      </div>
    </div>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script>
  (() => {
    const PALETTES = {
      sunset: { name: 'Sunset', base: '#f6f1e7', cell: '#fff4dc', colors: ['#2b1145', '#9b1d64', '#ef476f', '#ff9f1c', '#ffd166'] },
      ocean: { name: 'Ocean', base: '#f6f1e7', cell: '#ffffff', colors: ['#0b3c5d', '#1d7fb8', '#4fc3e8', '#e8f6ff', '#d4a857'] },
      galaxy: { name: 'Galaxy', base: '#0d0c18', cell: '#f4f1ff', colors: ['#100c2c', '#3a1f8a', '#7a4fe0', '#20c4cb', '#ff7ad9'] },
      candy: { name: 'Candy', base: '#fffaf3', cell: '#ffffff', colors: ['#ff6f91', '#ffc2d1', '#7fd8d4', '#b4f8c8', '#fbe7a1'] },
      earth: { name: 'Earth', base: '#efe6d6', cell: '#f8efdc', colors: ['#3d2c1e', '#8a5a44', '#c98b5a', '#e8d5b5', '#5f7161'] },
      gold: { name: 'Gold & Ink', base: '#f4efe4', cell: '#e9c76b', colors: ['#111111', '#34343a', '#c9a227', '#f1e3b0', '#ffffff'] }
    };
    const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];

    let paletteKey = Curio.store.get('paint-pour:palette', 'sunset');
    if (!PALETTES[paletteKey]) paletteKey = 'sunset';
    let cup = -1, tool = 'pour', cellsOn = false, job = null;
    const stage = document.getElementById('stage');
    const tiltEl = document.getElementById('tilt');
    let canvas = document.getElementById('paint');
    const hint = document.getElementById('hint');
    const forceCpu = /[?&]gl=0/.test(location.search);

    const VERT = `precision highp float;
attribute vec2 aPosition;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform vec2 texelSize;
void main () {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0); vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y); vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;
    const HEAD = `precision highp float; precision highp sampler2D;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
`;
    const FRAG = {
      copy: `uniform sampler2D uTex; void main () { gl_FragColor = texture2D(uTex, vUv); }`,
      clear: `uniform sampler2D uTex; uniform float value; void main () { gl_FragColor = value * texture2D(uTex, vUv); }`,
      splatVel: `uniform sampler2D uTarget; uniform float aspectRatio; uniform vec3 color; uniform vec2 point; uniform float radius;
void main () { vec2 p = vUv - point; p.x *= aspectRatio; vec3 s = exp(-dot(p, p) / radius) * color; gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + s, 1.0); }`,
      splatDye: `uniform sampler2D uTarget; uniform float aspectRatio; uniform vec4 color; uniform vec2 point; uniform float radius;
void main () { vec2 p = vUv - point; p.x *= aspectRatio; float d = length(p); float f = (1.0 - smoothstep(radius * 0.72, radius, d)) * color.a; vec4 c = texture2D(uTarget, vUv); gl_FragColor = mix(c, vec4(color.rgb, 1.0), f); }`,
      advect: `uniform sampler2D uVelocity; uniform sampler2D uSource; uniform vec2 texelSize; uniform float dt; uniform float dissipation; uniform vec2 drift; uniform float edgeZero;
void main () {
  vec4 here = texture2D(uSource, vUv);
  vec2 coord = vUv - dt * (texture2D(uVelocity, vUv).xy * texelSize + drift * smoothstep(0.05, 0.7, here.a));
  vec4 r = texture2D(uSource, coord);
  if (edgeZero > 0.5) { vec2 o = step(vec2(0.0), coord) * step(coord, vec2(1.0)); r *= o.x * o.y; }
  gl_FragColor = r / (1.0 + dissipation * dt);
}`,
      curl: `uniform sampler2D uVelocity;
void main () { float L = texture2D(uVelocity, vL).y; float R = texture2D(uVelocity, vR).y; float T = texture2D(uVelocity, vT).x; float B = texture2D(uVelocity, vB).x; gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0); }`,
      vorticity: `uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float curl; uniform float dt;
void main () {
  float L = texture2D(uCurl, vL).x; float R = texture2D(uCurl, vR).x; float T = texture2D(uCurl, vT).x; float B = texture2D(uCurl, vB).x; float C = texture2D(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L)); force /= length(force) + 0.0001; force *= curl * C; force.y *= -1.0;
  vec2 v = texture2D(uVelocity, vUv).xy + force * dt; v = min(max(v, -1000.0), 1000.0); gl_FragColor = vec4(v, 0.0, 1.0);
}`,
      tilt: `uniform sampler2D uVelocity; uniform sampler2D uDye; uniform vec2 force;
void main () { float a = texture2D(uDye, vUv).a; gl_FragColor = vec4(texture2D(uVelocity, vUv).xy + force * (0.15 + a), 0.0, 1.0); }`,
      divergence: `uniform sampler2D uVelocity; uniform vec4 sources[16]; uniform float aspectRatio;
void main () {
  float L = texture2D(uVelocity, vL).x; float R = texture2D(uVelocity, vR).x; float T = texture2D(uVelocity, vT).y; float B = texture2D(uVelocity, vB).y;
  vec2 C = texture2D(uVelocity, vUv).xy;
  if (vL.x < 0.0) { L = -C.x; } if (vR.x > 1.0) { R = -C.x; } if (vT.y > 1.0) { T = -C.y; } if (vB.y < 0.0) { B = -C.y; }
  float div = 0.5 * (R - L + T - B);
  for (int i = 0; i < 16; i++) { vec4 s = sources[i]; vec2 p = vUv - s.xy; p.x *= aspectRatio; div -= s.w * exp(-dot(p, p) / s.z); }
  gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
}`,
      pressure: `uniform sampler2D uPressure; uniform sampler2D uDivergence;
void main () { float L = texture2D(uPressure, vL).x; float R = texture2D(uPressure, vR).x; float T = texture2D(uPressure, vT).x; float B = texture2D(uPressure, vB).x; float d = texture2D(uDivergence, vUv).x; gl_FragColor = vec4((L + R + B + T - d) * 0.25, 0.0, 0.0, 1.0); }`,
      gradient: `uniform sampler2D uPressure; uniform sampler2D uVelocity;
void main () { float L = texture2D(uPressure, vL).x; float R = texture2D(uPressure, vR).x; float T = texture2D(uPressure, vT).x; float B = texture2D(uPressure, vB).x; vec2 v = texture2D(uVelocity, vUv).xy - vec2(R - L, T - B); gl_FragColor = vec4(v, 0.0, 1.0); }`,
      display: `uniform sampler2D uDye; uniform vec3 base; uniform vec2 dyeTexel; uniform float time;
float lum (vec2 uv) { vec4 x = texture2D(uDye, uv); vec3 c = x.rgb + base * (1.0 - x.a); return dot(c, vec3(0.3, 0.59, 0.11)) + x.a * 0.25; }
float hash (vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main () {
  vec4 d = texture2D(uDye, vUv);
  vec3 col = d.rgb + base * (1.0 - d.a);
  vec2 tx = vec2(dyeTexel.x * 1.5, 0.0); vec2 ty = vec2(0.0, dyeTexel.y * 1.5);
  vec2 g = vec2(lum(vUv + tx) - lum(vUv - tx), lum(vUv + ty) - lum(vUv - ty));
  vec3 n = normalize(vec3(-g * 4.0, 1.0));
  vec3 l = normalize(vec3(-0.45, 0.55, 0.9));
  float diff = dot(n, l);
  float spec = pow(max(dot(reflect(-l, n), vec3(0.0, 0.0, 1.0)), 0.0), 36.0);
  float wet = smoothstep(0.0, 0.5, d.a);
  col = col * (0.82 + 0.2 * diff) + vec3(spec) * 0.5 * wet;
  col += (hash(floor(gl_FragCoord.xy)) - 0.5) * 0.025 * (1.0 - wet);
  vec2 q = vUv - 0.5; col *= 1.0 - dot(q, q) * 0.25;
  gl_FragColor = vec4(col, 1.0);
}`
    };

    function makeGL(cv) {
      const attrs = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
      let gl = cv.getContext('webgl2', attrs);
      const isGL2 = !!gl;
      if (!gl) gl = cv.getContext('webgl', attrs);
      if (!gl) return null;
      let type, internal, filter;
      if (isGL2) {
        if (!gl.getExtension('EXT_color_buffer_float')) return null;
        type = gl.HALF_FLOAT; internal = gl.RGBA16F; filter = gl.LINEAR;
      } else {
        const h = gl.getExtension('OES_texture_half_float');
        if (!h) return null;
        type = h.HALF_FLOAT_OES; internal = gl.RGBA;
        filter = gl.getExtension('OES_texture_half_float_linear') ? gl.LINEAR : gl.NEAREST;
      }
      function shader(t, src) {
        const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }
      const vs = shader(gl.VERTEX_SHADER, VERT);
      const progs = {};
      for (const k in FRAG) {
        const p = gl.createProgram();
        gl.attachShader(p, vs); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, HEAD + FRAG[k]));

        const dur = Curio.rand(1.2, 2.4);
        autoQueue.push({ start: t, dur, x: Curio.rand(0.2, 0.8), y: Curio.rand(0.22, 0.78), cupIdx: Math.random() < 0.6 ? -1 : Curio.randInt(0, 4), off: Math.random() * 3 });
        t += dur * Curio.rand(0.5, 0.9);
      }
      autoQueue.push({ start: t + 0.3, dur: 1.6, swirl: true, x: Curio.rand(0.3, 0.7), y: Curio.rand(0.3, 0.7), a: Math.random() * 6 });
      autoClock = 0;
    }
    let autoClock = 0;

    let raf = 0, last = 0, time = 0, frames = 0, slowT = 1 / 60, quality = 1;
    let pIters = 36;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      frames++;
      const raw = (now - (last || now)) / 1000;
      const dt = Math.min(1 / 30, Math.max(1 / 240, raw || 1 / 60)); last = now;
      if (raw > 0 && raw < 0.5 && sim.kind === 'gl' && quality > 0.25) {
        slowT = slowT * 0.97 + raw * 0.03;
        if (frames > 60 && slowT > 0.034) { quality = Math.max(0.25, quality * 0.7); pIters = quality < 0.6 ? 16 : 26; slowT = 1 / 60; frames = 0; sim.size(canvas.width, canvas.height, quality); }
      }
      time += dt;
      sources.length = 0;
      let pouring = false, swirlSpeed = 0;
      const asp = W / H;
      for (const q of pointers.values()) {
        const dx = q.x - q.px, dy = q.y - q.py;
        q.vx = q.vx * 0.5 + (dx / dt) * 0.5; q.vy = q.vy * 0.5 + (dy / dt) * 0.5;
        const speed = Math.hypot(q.vx * asp, q.vy);
        const yUp = sim.flipY ? 1 - q.y : q.y;
        if (tool === 'pour') {
          pouring = true; pourTime += dt;
          const steps = Math.max(1, Math.ceil(Math.hypot(dx * asp, dy) / 0.01));
          for (let s = 1; s <= steps; s++) {
            const x = q.px + dx * s / steps, y = q.py + dy * s / steps;
            sim.splatDye(x, y, cupColor(pourTime), 0.024, 1);
          }
          sources.push({ x: q.x, y: yUp, r: 0.045, s: 42 }); note(q.x, yUp, dt);
          if (speed > 0.05) sim.splatVel(q.x, q.y, q.vx * 70 * asp, q.vy * 70, 0.04);
          if (cellsOn && Math.random() < dt * 9) addCell(q.x + Curio.rand(-0.03, 0.03), yUp + Curio.rand(-0.03, 0.03));
        } else {
          if (speed > 0.01) sim.splatVel(q.x, q.y, q.vx * 150, q.vy * 150, 0.065);
          swirlSpeed = Math.max(swirlSpeed, speed);
          if (cellsOn && speed > 0.3 && Math.random() < dt * 12) addCell(q.x + Curio.rand(-0.04, 0.04), yUp + Curio.rand(-0.04, 0.04));
        }
        q.px = q.x; q.py = q.y;
      }
      if (autoQueue.length) {
        autoClock += dt;
        for (const a of autoQueue) {
          const local = autoClock - a.start;
          if (local < 0 || local > a.dur) continue;
          const yy = sim.flipY ? 1 - a.y : a.y;
          if (a.swirl) {
            const ang = a.a + local * 4, rad = 0.12;
            const x = a.x + Math.cos(ang) * rad / asp, y = a.y + Math.sin(ang) * rad;
            sim.splatVel(x, sim.flipY ? 1 - y : y, -Math.sin(ang) * 260, (sim.flipY ? -1 : 1) * Math.cos(ang) * 260, 0.07);
            swirlSpeed = Math.max(swirlSpeed, 0.8);
          } else {
            pouring = true;
            const cs = pal().colors;
            const col = hex(a.cupIdx >= 0 ? cs[a.cupIdx] : cs[Math.floor((local + a.off) / 0.26) % cs.length]);
            sim.splatDye(a.x, yy, col, 0.024, 1);
            sources.push({ x: a.x, y: a.y, r: 0.045, s: 42 }); note(a.x, a.y, dt);
            if (cellsOn && Math.random() < dt * 9) addCell(a.x + Curio.rand(-0.03, 0.03), a.y + Curio.rand(-0.03, 0.03));
          }
        }
        if (autoQueue.every((a) => autoClock > a.start + a.dur)) autoQueue = [];
      }
      const cellCol = hex(pal().cell);
      for (let i = cells.length - 1; i >= 0; i--) {
        const c = cells[i];
        c.age += dt;
        if (c.age < c.life) {
          if (sources.length < 16) sources.push({ x: c.x, y: c.y, r: c.r * 1.5, s: 15 });
          sim.splatDye(c.x, sim.flipY ? 1 - c.y : c.y, cellCol, c.r * 0.7, 0.9);
          if (c.age === dt && time - lastBloop > 0.05) { lastBloop = time; bloop(Curio.rand(500, 900)); }
        } else cells.splice(i, 1);
      }
      const tl = tiltActive();
      sim.step(dt, sources, tl);
      sim.render(hex(pal().base), time);
      updateSound(dt, pouring, swirlSpeed, now);
      if (job) { if (pouring) job.pour += dt; if (swirlSpeed > 0.05) job.swirl += dt; }
    }
    const start = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; for (const k of tiltKeys) tiltKeys.delete(k); if (SND.ready) { const t = SND.ac.currentTime; SND.pour.g.gain.setTargetAtTime(0, t, 0.02); SND.swirl.g.gain.setTargetAtTime(0, t, 0.02); } };
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));

    const tiltKeys = new Set();
    const padBtns = new Map();
    function tiltActive() {
      let x = 0, y = 0;
      for (const k of tiltKeys) { const [a, b] = k.split(',').map(Number); x += a; y += b; }
      x = Math.max(-1, Math.min(1, x)); y = Math.max(-1, Math.min(1, y));
      tilt[0] += (x - tilt[0]) * 0.15; tilt[1] += (y - tilt[1]) * 0.15;
      if (Math.abs(tilt[0]) < 0.01) tilt[0] = 0; if (Math.abs(tilt[1]) < 0.01) tilt[1] = 0;
      tiltEl.style.transform = (tilt[0] || tilt[1]) ? `rotateX(${(tilt[1] * 7).toFixed(2)}deg) rotateY(${(tilt[0] * 7).toFixed(2)}deg)` : '';
      return tilt;
    }
    document.querySelectorAll('#pad button').forEach((b) => {
      const key = `${b.dataset.tx},${b.dataset.ty}`;
      padBtns.set(key, b);
      const on = (e) => { e.preventDefault(); sound(); tiltKeys.add(key); b.classList.add('on'); hint.classList.add('gone'); };
      const off = () => { tiltKeys.delete(key); b.classList.remove('on'); };
      const latchOff = () => { if (!(Curio.touchpad && b.dataset.latch)) off(); };
      b.addEventListener('pointerdown', (e) => {
        if (Curio.touchpad && e.pointerType === 'mouse') {
          e.preventDefault();
          if (b.dataset.latch) { delete b.dataset.latch; off(); return; }
          padBtns.forEach((o) => { if (o.dataset.latch) { delete o.dataset.latch; tiltKeys.delete(`${o.dataset.tx},${o.dataset.ty}`); o.classList.remove('on'); } });
          b.dataset.latch = '1'; on(e); return;
        }
        on(e);
      });
      b.addEventListener('pointerup', latchOff); b.addEventListener('pointerleave', latchOff); b.addEventListener('pointercancel', latchOff);
      b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') on(e); });
      b.addEventListener('keyup', off);
    });
    const ARROWS = { ArrowUp: '0,1', ArrowDown: '0,-1', ArrowLeft: '-1,0', ArrowRight: '1,0' };
    addEventListener('keydown', (e) => {
      if (ARROWS[e.key]) { e.preventDefault(); tiltKeys.add(ARROWS[e.key]); padBtns.get(ARROWS[e.key])?.classList.add('on'); }
      else if (e.ctrlKey || e.metaKey || e.altKey || (e.target.closest && e.target.closest('input,select,textarea'))) return;
      else if (e.key === 'c' || e.key === 'C') toggleCells();
      else if (e.key === 'p' || e.key === 'P') document.querySelector('[data-tool="pour"]').click();
      else if (e.key === 's' || e.key === 'S') document.querySelector('[data-tool="swirl"]').click();
      else if (/^[0-5]$/.test(e.key)) cupsEl.querySelector(`[data-cup="${e.key === '0' ? -1 : +e.key - 1}"]`)?.click();
    });
    addEventListener('keyup', (e) => { if (ARROWS[e.key]) { tiltKeys.delete(ARROWS[e.key]); padBtns.get(ARROWS[e.key])?.classList.remove('on'); } });
    addEventListener('blur', () => { tiltKeys.clear(); padBtns.forEach((b) => { b.classList.remove('on'); delete b.dataset.latch; }); });
    addEventListener('curio:touchpad', () => { tiltKeys.clear(); padBtns.forEach((b) => { b.classList.remove('on'); delete b.dataset.latch; }); });

    document.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => {
      tool = b.dataset.tool;
      document.querySelectorAll('[data-tool]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      canvas.style.cursor = tool === 'pour' ? 'crosshair' : 'grab';
    }));

    const cupsEl = document.getElementById('cups');
    function buildCups() {
      cupsEl.innerHTML = '';
      const cs = pal().colors;
      const mix = document.createElement('button');
      mix.type = 'button'; mix.className = 'cup'; mix.title = 'Dirty cup: all colours layered'; mix.setAttribute('aria-label', 'Dirty cup, all colours layered');
      mix.style.background = `conic-gradient(${cs.map((c, i) => `${c} ${i * 20}% ${(i + 1) * 20}%`).join(',')})`;
      mix.dataset.cup = -1;
      cupsEl.append(mix);
      cs.forEach((c, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'cup'; b.style.background = c; b.dataset.cup = i; b.setAttribute('aria-label', `Paint colour ${i + 1}`);
        cupsEl.append(b);
      });
      cupsEl.querySelectorAll('.cup').forEach((b) => {
        b.setAttribute('aria-pressed', String(+b.dataset.cup === cup));
        b.addEventListener('click', () => {
          cup = +b.dataset.cup;
          cupsEl.querySelectorAll('.cup').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
          if (tool !== 'pour') document.querySelector('[data-tool="pour"]').click();
        });
      });
    }
    const palEl = document.getElementById('palettes');
    for (const k in PALETTES) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.pal = k;
      const sw = document.createElement('i');
      PALETTES[k].colors.forEach((c) => { const s = document.createElement('b'); s.style.background = c; sw.append(s); });
      b.append(sw, document.createTextNode(PALETTES[k].name));
      b.addEventListener('click', () => setPalette(k));
      palEl.append(b);
    }
    function setPalette(k) {
      paletteKey = k; Curio.store.set('paint-pour:palette', k);
      if (job) job.pal[k] = 1;
      palEl.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pal === k)));
      tiltEl.style.background = pal().base;
      buildCups();
    }
    function toggleCells() {
      cellsOn = !cellsOn;
      const b = document.getElementById('cells');
      b.setAttribute('aria-pressed', String(cellsOn));
      if (cellsOn && job) job.cells = true;
      if (cellsOn) {
        Curio.toast('Silicone added. Pour or swirl to grow cells');
        cellBloom(16);
      }
    }
    document.getElementById('cells').addEventListener('click', toggleCells);
    document.getElementById('auto').addEventListener('click', surprise);
    document.getElementById('clear').addEventListener('click', () => {
      sim.clear(); autoQueue = []; cells.length = 0; spots.length = 0;
      if (job) resetJob();
      if (navigator.vibrate) navigator.vibrate(10);
      tiltEl.animate([{ filter: 'brightness(1.4)' }, { filter: 'none' }], { duration: 350 });
      Curio.beep(700, 0.06, 'sine', 0.05);
    });
    document.getElementById('save').addEventListener('click', () => {
      sim.render(hex(pal().base), time);
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = `paint-pour-${Date.now()}.png`;
      document.body.append(a); a.click(); a.remove();
      Curio.toast('Saved. Frame it, obviously');
    });

    let rt = 0;
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
    setPalette(paletteKey);
    resize();
    surprise();
    start();
    const SIMPLE = Curio.simple;
    job = { pal: {}, cells: false, tilt: 0, swirl: 0, pour: 0 };
    const resetJob = () => { job.pal = { [paletteKey]: 1 }; job.cells = cellsOn; job.tilt = 0; job.swirl = 0; job.pour = 0; };
    resetJob();
    const ORDERS = [
      { who: 'A seaside cafe', want: 'something calm for above the counter', req: [['pal', 'ocean'], ['cells'], ['tilt', 2]] },
      { who: 'A planetarium gift shop', want: 'a nebula, please, very sparkly', req: [['pal', 'galaxy'], ['swirl', 2], ['cells']] },
      { who: 'A bakery', want: 'sweet and loud for the window', req: [['pal', 'candy'], ['pour', 8]] },
      { who: 'A hotel lobby', want: 'black and gold, quietly expensive', req: [['pal', 'gold'], ['tilt', 3], ['swirl', 1]] },
      { who: 'A pottery studio', want: 'warm earth tones, nothing shiny', req: [['pal', 'earth'], ['pour', 6], ['tilt', 1]] },
      { who: 'A jazz bar', want: 'a sunset that melts a little', req: [['pal', 'sunset'], ['tilt', 4]] },
      { who: 'A dentist', want: 'two palettes, so patients have something to look at', req: [['pals', 2], ['cells'], ['swirl', 1]] },
      { who: 'A yoga room', want: 'cells, cells and more cells', req: [['cells'], ['pour', 10], ['swirl', 2]] },
      { who: 'A record label', want: 'three palettes in one wild cover', req: [['pals', 3], ['tilt', 2]] },
      { who: 'A library', want: 'a slow ocean, poured carefully', req: [['pal', 'ocean'], ['pour', 12]] }
    ];
    const ost = Curio.store.get('paint-pour:orders', { i: Curio.randInt(0, ORDERS.length - 1), done: 0, stars: 0, saved: 0 });
    const reqText = ([k, v]) => k === 'pal' ? `${PALETTES[v].name} palette` : k === 'pals' ? `${v} palettes mixed` : k === 'cells' ? 'Cells turned on' : k === 'tilt' ? `Tilted for ${v}s` : k === 'swirl' ? `Swirled for ${v}s` : `Poured for ${v}s`;
    const reqOk = ([k, v]) => k === 'pal' ? !!job.pal[v] : k === 'pals' ? Object.keys(job.pal).length >= v : k === 'cells' ? job.cells : job[k] >= v;
    function paintOrder() {
      const o = ORDERS[ost.i % ORDERS.length];
      document.getElementById('ordN').textContent = `#${ost.done + 1}`;
      document.getElementById('ordText').textContent = `${o.who} wants ${o.want}.`;
      const ul = document.getElementById('ordReq'); ul.textContent = '';
      for (const r of o.req) { const li = document.createElement('li'); li.textContent = reqText(r); if (reqOk(r)) li.className = 'ok'; ul.append(li); }
      document.getElementById('ordStat').textContent = `${ost.done} delivered · ${'★'.repeat(Math.min(5, ost.stars))}${ost.stars > 5 ? ` +${ost.stars - 5}` : ''}`;
    }
    setInterval(() => { if (!SIMPLE && !document.hidden) { if (tilt[0] || tilt[1]) job.tilt += 0.25; paintOrder(); } }, 250);
    document.getElementById('deliver').addEventListener('click', () => {
      const o = ORDERS[ost.i % ORDERS.length];
      const miss = o.req.filter((r) => !reqOk(r));
      if (miss.length) { Curio.toast(`Not yet: ${miss.map(reqText).join(', ')}`); Curio.beep(220, 0.12, 'triangle', 0.05); if (navigator.vibrate) navigator.vibrate([20, 40, 20]); return; }
      ost.done++; ost.stars += 1 + (Object.keys(job.pal).length > 1 ? 1 : 0); ost.i = (ost.i + Curio.randInt(1, ORDERS.length - 1)) % ORDERS.length;
      Curio.store.set('paint-pour:orders', ost);
      keep(true);
      Curio.confetti(); [523, 659, 784].forEach((f, i) => setTimeout(() => Curio.beep(f, 0.12, 'triangle', 0.06), i * 90));
      Curio.toast(`📦 ${o.who} loves it. Fresh canvas on the easel.`);
      sim.clear(); autoQueue = []; cells.length = 0; spots.length = 0; resetJob(); paintOrder();
    });
    document.getElementById('skipOrd').addEventListener('click', () => { ost.i = (ost.i + 1) % ORDERS.length; Curio.store.set('paint-pour:orders', ost); paintOrder(); });
    function snap(w) { sim.render(hex(pal().base), time); const c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * H / W); c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height); return c; }
    function keep(quiet) {
      const gal = Curio.store.get('paint-pour:gallery', []);
      gal.unshift({ t: Date.now(), pal: paletteKey, img: snap(220).toDataURL('image/jpeg', 0.75) }); gal.length = Math.min(gal.length, 12);
      Curio.store.set('paint-pour:gallery', gal);
      ost.saved++; Curio.store.set('paint-pour:orders', ost);
      if (!quiet) { Curio.toast('🖼️ Hung on the gallery wall'); Curio.beep(880, 0.08, 'triangle', 0.05); }
    }
    document.getElementById('keep').addEventListener('click', () => keep(false));
    function openGallery() {
      const gal = Curio.store.get('paint-pour:gallery', []);
      const back = document.createElement('div'); back.className = 'pp-gal';
      back.innerHTML = '<div class="pp-gal__box" role="dialog" aria-modal="true" aria-label="Gallery"><header><h2>Gallery wall</h2><button type="button" class="c-btn c-btn--ghost" data-a="x" aria-label="Close">✕</button></header><div class="pp-gal__grid"></div></div>';
      const grid = back.querySelector('.pp-gal__grid');
      const paint = () => {
        grid.textContent = '';
        if (!gal.length) { grid.innerHTML = '<p class="c-muted">Empty walls. Press 🖼️ Keep or deliver a commission.</p>'; return; }
        gal.forEach((g, i) => {
          const f = document.createElement('figure');
          const img = document.createElement('img'); img.src = g.img; img.alt = `${PALETTES[g.pal] ? PALETTES[g.pal].name : ''} pour`;
          const cap = document.createElement('figcaption'); cap.textContent = new Date(g.t).toLocaleDateString();
          const dl = document.createElement('a'); dl.href = g.img; dl.download = `paint-pour-${g.t}.jpg`; dl.textContent = '⬇'; dl.className = 'pp-gal__dl'; dl.setAttribute('aria-label', 'Download');
          const del = document.createElement('button'); del.type = 'button'; del.className = 'pp-gal__del'; del.textContent = '✕'; del.setAttribute('aria-label', 'Delete');
          del.addEventListener('click', () => { gal.splice(i, 1); Curio.store.set('paint-pour:gallery', gal); paint(); });
          f.append(img, cap, dl, del); grid.append(f);
        });
      };
      const close = () => { back.remove(); removeEventListener('keydown', onKey, true); };
      const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
      addEventListener('keydown', onKey, true);
      back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('[data-a="x"]')) close(); });
      document.body.append(back); paint();
    }
    document.getElementById('galBtn').addEventListener('click', openGallery);
    addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey || (e.target.closest && e.target.closest('input,select,textarea,button'))) return;
      const k = e.key.toLowerCase();
      if (k === 'r') surprise();
      else if (k === 'x') document.getElementById('clear').click();
      else if (!SIMPLE && k === 'k') keep(false);
      else if (!SIMPLE && k === 'g' && !document.querySelector('.pp-gal')) openGallery();
    });
    paintOrder();
    window.__pp = { frames: () => frames, sim, toggleCells, surprise, setTool: (t) => document.querySelector(`[data-tool="${t}"]`).click() };
  })();
  </script>
</body>
