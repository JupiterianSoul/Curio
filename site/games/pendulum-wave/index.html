<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pendulum Wave · Zoble</title>
  <meta name="description" content="A row of pendulums tuned so they drift into snakes, waves and chaos, then snap back into a single line every 60 seconds. With chimes.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <style>
    .c-wrap { padding-top: 12px; padding-bottom: 16px; }
    .pw-head { text-align: center; }
    .pw-head .c-title { margin: 0; font-size: clamp(26px, 4.5vw, 38px); }
    .pw-head .c-sub { margin: 2px 0 10px; font-size: 15px; }
    .pw-stage { position: relative; height: max(340px, calc(100dvh - var(--bar-h) - 250px)); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); background: #070914; }
    #pend { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #pend:active { cursor: grabbing; }
    .pw-hud { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; color: rgba(230, 236, 255, .8); font-weight: 800; font-size: 13px; gap: 10px; }
    .pw-clock { font-variant-numeric: tabular-nums; }
    .pw-bar { width: 120px; height: 6px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 6px; }
    .pw-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7af0ff, #c58bff); }
    .pw-moment { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; color: #fff; font-weight: 900; font-size: 18px; letter-spacing: .02em; opacity: 0; transition: opacity .6s ease; pointer-events: none; text-shadow: 0 0 18px rgba(160, 200, 255, .8); }
    .pw-moment.on { opacity: .9; }
    .pw-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center; margin-top: 12px; }
    .pw-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; justify-content: center; }
    .seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink-2); touch-action: manipulation; }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .pw-tools label { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; color: var(--ink-2); }
    .pw-tools input[type=range] { width: 110px; accent-color: var(--accent); }
    .pw-tools .c-btn { padding: 8px 15px; font-size: 14px; }
    .th { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); cursor: pointer; padding: 0; touch-action: manipulation; }
    .th[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
    .pw-keys { text-align: center; font-size: 13px; margin: 10px 0 0; }
    @media (hover: none) and (pointer: coarse) { .pw-keys { display: none; } }
    .val { min-width: 36px; font-variant-numeric: tabular-nums; color: var(--ink); }
    @media (max-width: 560px) {
      .pw-head .c-sub { font-size: 13px; }
      .pw-stage { height: max(330px, calc(100dvh - var(--bar-h) - 360px)); }
    }
  </style>
</head>
<body data-game="pendulum-wave">
  <main class="c-wrap">
    <div class="pw-head">
      <h1 class="c-title">Pendulum Wave</h1>
      <p class="c-sub">Every pendulum is a tiny bit faster than its neighbour. Give it sixty seconds.</p>
    </div>
    <div class="pw-stage" id="stage">
      <canvas id="pend" role="img" aria-label="A row of glowing pendulums swinging at slightly different speeds, forming waves. Drag or use the arrow keys to rotate the camera."></canvas>
      <div class="pw-hud">
        <div><div class="pw-clock" id="clock">0.0 s</div><div class="pw-bar"><i id="prog"></i></div></div>
        <div class="pw-clock" id="sync">Back in line in 60 s</div>
      </div>
      <div class="pw-moment" id="moment"></div>
    </div>
    <div class="pw-tools">
      <div class="pw-group">
        <div class="seg" role="group" aria-label="Camera">
          <button type="button" data-cam="three" aria-pressed="true">3/4</button>
          <button type="button" data-cam="side" aria-pressed="false">Side</button>
          <button type="button" data-cam="top" aria-pressed="false">Top</button>
          <button type="button" data-cam="end" aria-pressed="false">End</button>
        </div>
        <button type="button" class="c-btn c-btn--ghost" id="play">❚❚ Pause</button>
        <button type="button" class="c-btn" id="release">↺ Release</button>
      </div>
      <div class="pw-group">
        <label>Speed <input type="range" id="speed" min="0" max="100" value="40" aria-label="Speed"><span class="val" id="speedV">1x</span></label>
        <label>Pendulums <input type="range" id="count" min="15" max="24" value="15" aria-label="Number of pendulums"><span class="val" id="countV">15</span></label>
      </div>
      <div class="pw-group" id="themes" role="group" aria-label="Colour theme"></div>
    </div>
    <p class="c-muted pw-keys">Drag to spin the camera, or use <span class="c-kbd">←</span> <span class="c-kbd">→</span> <span class="c-kbd">↑</span> <span class="c-kbd">↓</span>. <span class="c-kbd">1</span>-<span class="c-kbd">4</span> views, <span class="c-kbd">Space</span> pause, <span class="c-kbd">R</span> release. Touchpad mode (top bar): click to grab the view, click again to let go.</p>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script>
  (() => {
    const T = 60, K = 51, AMP = 0.42;
    const THEMES = {
      rainbow: { name: 'Rainbow', c: (k) => `hsl(${k * 300}, 95%, 64%)`, bg: ['#070914', '#141233'] },
      aurora: { name: 'Aurora', c: (k) => `hsl(${160 + k * 120}, 90%, ${62 + k * 8}%)`, bg: ['#03110f', '#0b1c33'] },
      sunset: { name: 'Sunset', c: (k) => `hsl(${40 - k * 75}, 98%, ${62 - k * 4}%)`, bg: ['#12060c', '#2a0d26'] },
      ice: { name: 'Ice', c: (k) => `hsl(${195 + k * 25}, ${70 + k * 25}%, ${88 - k * 26}%)`, bg: ['#050b14', '#0d2034'] },
      gold: { name: 'Gold', c: (k) => `hsl(${42 + Math.sin(k * 6.28) * 6}, 90%, ${55 + k * 20}%)`, bg: ['#0c0905', '#221a0c'] }
    };
    const CAMS = { three: { yaw: 0.72, pitch: 0.3 }, side: { yaw: 1.42, pitch: 0.12 }, top: { yaw: 0, pitch: 1.5 }, end: { yaw: 0.02, pitch: 0.06 } };
    const SCALE = [0, 2, 4, 7, 9];

    const canvas = document.getElementById('pend');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    const clockEl = document.getElementById('clock'), syncEl = document.getElementById('sync'), progEl = document.getElementById('prog'), momentEl = document.getElementById('moment');
    let W = 0, H = 0, dpr = 1;
    let n = Curio.store.get('pendulum-wave:count', 15);
    let theme = Curio.store.get('pendulum-wave:theme', 'rainbow');
    if (!THEMES[theme]) theme = 'rainbow';
    let t = 0, rate = 1, playing = true;
    let cam = { yaw: 0.72, pitch: 0.3 }, camT = { ...cam }, camKey = 'three';
    let pend = [];
    const LMAX = 1;

    function build() {
      pend = [];
      const longest = 1 / (K * K);
      for (let i = 0; i < n; i++) {
        const f = (K + i) / T;
        const L = (1 / ((K + i) * (K + i))) / longest * LMAX;
        pend.push({ i, f, L, z: (i - (n - 1) / 2) * (2.0 / Math.max(14, n - 1)), trail: [], prev: AMP, flash: 0, note: 0 });
      }
      pend.forEach((p) => { const deg = Math.round(p.i * 14 / Math.max(1, n - 1)); p.note = 55 + SCALE[deg % 5] + 12 * Math.floor(deg / 5); });
    }

    function resize() {
      const r = stage.getBoundingClientRect();
      W = r.width; H = r.height; dpr = Math.min(2, devicePixelRatio || 1);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    }

    function project(x, y, z) {
      const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
      const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
      const yc = y - 0.45;
      const y2 = yc * cp - z1 * sp, z2 = yc * sp + z1 * cp;
      const d = 3.6, f = Math.min(W, H * 1.25) * 1.25;
      const s = f / (d + z2);
      return { x: W / 2 + x1 * s, y: H * 0.5 - y2 * s, s, z: z2 };
    }

    const theta = (p, tt) => AMP * Math.cos(2 * Math.PI * p.f * tt);
    function bobPos(p, tt) {
      const th = theta(p, tt);
      return { x: p.L * Math.sin(th) * 0.95, y: 1 - p.L * Math.cos(th), z: p.z };
    }

    let master = null, notesThisSec = 0, noteClock = 0;
    function audio() {
      if (Curio.muted) return null;
      const a = Curio.audioContext(); if (!a) return null;
      if (!master) {
        const out = a.createGain(); out.gain.value = 0.7;
        const dl = a.createDelay(1); dl.delayTime.value = 0.33;
        const fb = a.createGain(); fb.gain.value = 0.3;
        const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2000;
        const inp = a.createGain();
        inp.connect(out); inp.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(out);
        out.connect(a.destination);
        master = inp;
      }
      return a;
    }
    function chime(m, vol = 1) {
      const a = audio(); if (!a) return;
      const now = a.currentTime, f = 440 * Math.pow(2, (m - 69) / 12), v = 0.07 * vol;
      [[1, 1, 1.6], [2.76, 0.3, 0.6], [5.4, 0.12, 0.25]].forEach(([mult, g0, dur]) => {
        const o = a.createOscillator(), g = a.createGain();
        o.type = 'sine'; o.frequency.value = f * mult;
        g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(v * g0, now + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        o.connect(g); g.connect(master); o.start(now); o.stop(now + dur + 0.05);
      });
    }

    const moments = [[T / 4, 'Quarter time: four little waves'], [T / 3, 'Three snakes'], [T / 2, 'Halfway: two lines'], [T * 2 / 3, 'Three again'], [T * 3 / 4, 'Four waves'], [T, 'Back in line ✨']];
    let momentTimer = 0, lastCycle = 0;
    function showMoment(text) {
      momentEl.textContent = text; momentEl.classList.add('on');
      clearTimeout(momentTimer); momentTimer = setTimeout(() => momentEl.classList.remove('on'), 2600);
    }

    function draw() {
      const th = THEMES[theme];
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = ctx.createRadialGradient(W / 2, H * 0.35, 10, W / 2, H * 0.5, Math.max(W, H) * 0.8);
      g.addColorStop(0, th.bg[1]); g.addColorStop(1, th.bg[0]);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      const fy = 1 - LMAX - 0.12;
      ctx.lineWidth = 1;
      for (let k = -4; k <= 4; k++) {
        const a = project(-0.8, fy, k * 0.3), b = project(0.8, fy, k * 0.3);
        ctx.strokeStyle = 'rgba(150,170,255,.07)'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      for (let k = -4; k <= 4; k++) {
        const a = project(k * 0.2, fy, -1.2), b = project(k * 0.2, fy, 1.2);
        ctx.strokeStyle = 'rgba(150,170,255,.07)'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }

      const zr = 1.12;
      const b1 = project(0, 1, -zr), b2 = project(0, 1, zr);
      const legs = [[-zr], [zr]];
      ctx.strokeStyle = 'rgba(190,200,230,.35)'; ctx.lineWidth = 3;
      for (const [z] of legs) {
        const a = project(0, 1, z), b = project(0, fy, z);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      const bar = ctx.createLinearGradient(b1.x, b1.y - 4, b1.x, b1.y + 4);
      bar.addColorStop(0, '#dfe6f5'); bar.addColorStop(1, '#6f7a92');
      ctx.strokeStyle = bar; ctx.lineWidth = Math.max(3, 0.03 * b1.s); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b1.x, b1.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();

      const items = pend.map((p) => {
        const b = bobPos(p, t);
        return { p, piv: project(0, 1, p.z), bob: project(b.x, b.y, b.z), color: th.c(n > 1 ? p.i / (n - 1) : 0) };
      });
      items.sort((a, b) => b.bob.z - a.bob.z);

      ctx.globalCompositeOperation = 'lighter';
      for (const it of items) {
        const tr = it.p.trail;
        if (tr.length < 2) continue;
        let prev = project(tr[0].x, tr[0].y, tr[0].z);
        ctx.strokeStyle = it.color;
        for (let k = 1; k < tr.length; k++) {
          const q = project(tr[k].x, tr[k].y, tr[k].z);
          ctx.globalAlpha = (k / tr.length) * 0.5;
          ctx.lineWidth = Math.max(1, 0.035 * q.s * (k / tr.length));
          ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(q.x, q.y); ctx.stroke();
          prev = q;
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      for (const it of items) {
        const { piv, bob, color, p } = it;
        ctx.strokeStyle = 'rgba(220,230,255,.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(piv.x, piv.y); ctx.lineTo(bob.x, bob.y); ctx.stroke();
        const r = Math.max(3, 0.045 * bob.s);
        ctx.globalCompositeOperation = 'lighter';
        const gl = ctx.createRadialGradient(bob.x, bob.y, 0, bob.x, bob.y, r * (4 + p.flash * 4));
        gl.addColorStop(0, color); gl.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.35 + p.flash * 0.5;
        ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(bob.x, bob.y, r * (4 + p.flash * 4), 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
        const sg = ctx.createRadialGradient(bob.x - r * 0.35, bob.y - r * 0.35, r * 0.1, bob.x, bob.y, r);
        sg.addColorStop(0, '#ffffff'); sg.addColorStop(0.35, color); sg.addColorStop(1, 'rgba(0,0,0,.6)');
        ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(bob.x, bob.y, r, 0, 7); ctx.fill();
      }
    }

    function hud() {
      const cyc = t % T;
      clockEl.textContent = `${cyc.toFixed(1)} s`;
      syncEl.textContent = `Back in line in ${Math.ceil(T - cyc)} s`;
      progEl.style.width = `${(cyc / T) * 100}%`;
    }

    let raf = 0, last = 0, trailAcc = 0;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
      cam.yaw += (camT.yaw - cam.yaw) * Math.min(1, dt * 4);
      cam.pitch += (camT.pitch - cam.pitch) * Math.min(1, dt * 4);
      if (playing) {
        const t0 = t;
        t += dt * rate;
        noteClock += dt;
        if (noteClock > 1) { noteClock = 0; notesThisSec = 0; }
        for (const p of pend) {
          const a0 = Math.cos(2 * Math.PI * p.f * t0), a1 = Math.cos(2 * Math.PI * p.f * t);
          if (a0 < 0 && a1 >= 0 || a0 > 0 && a1 <= 0) {
            p.flash = 1;
            const up = Math.sin(2 * Math.PI * p.f * t) < 0;
            if (up && notesThisSec < 22) { notesThisSec++; chime(p.note, rate > 2 ? 0.6 : 1); }
          }
          p.flash *= Math.pow(0.03, dt);
        }
        for (const [mt, text] of moments) {
          const c0 = t0 % T, c1 = t % T;
          const crossed = mt === T ? Math.floor(t / T) > Math.floor(t0 / T) : c0 < mt && c1 >= mt;
          if (crossed) {
            showMoment(text);
            if (mt === T) { [0, 2, 4].forEach((d, k) => setTimeout(() => chime(72 + SCALE[d], 1.4), k * 120)); }
          }
        }
        trailAcc += dt;
        if (trailAcc > 1 / 50) {
          trailAcc = 0;
          for (const p of pend) { p.trail.push(bobPos(p, t)); if (p.trail.length > 34) p.trail.shift(); }
        }
      }
      hud();
      draw();
    }
    const start = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; };
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));

    let drag = null;
    Curio.drag(canvas, {
      start(q) { drag = { x: q.clientX, y: q.clientY, yaw: camT.yaw, pitch: camT.pitch }; audio(); },
      move(q) {
        if (!drag) return;
        camT.yaw = drag.yaw + (q.clientX - drag.x) * 0.008;
        camT.pitch = Math.max(-0.2, Math.min(1.55, drag.pitch + (q.clientY - drag.y) * 0.006));
        cam.yaw = camT.yaw; cam.pitch = camT.pitch;
        if (Math.abs(q.clientX - drag.x) + Math.abs(q.clientY - drag.y) > 6) setCamButtons(null);
      },
      end() { drag = null; }
    });
    function nudge(dy, dp) {
      camT.yaw += dy; camT.pitch = Math.max(-0.2, Math.min(1.55, camT.pitch + dp));
      setCamButtons(null);
    }

    function setCamButtons(k) { document.querySelectorAll('[data-cam]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cam === k))); }
    function setCam(k) { camKey = k; camT = { ...CAMS[k] }; setCamButtons(k); }
    document.querySelectorAll('[data-cam]').forEach((b) => b.addEventListener('click', () => setCam(b.dataset.cam)));

    const playBtn = document.getElementById('play');
    function setPlaying(v) { playing = v; playBtn.textContent = v ? '❚❚ Pause' : '▶ Play'; }
    playBtn.addEventListener('click', () => { audio(); setPlaying(!playing); });
    function release() {
      t = 0; pend.forEach((p) => { p.trail = []; p.flash = 0; });
      audio();
      showMoment('Released. All in a line');
      setPlaying(true);
    }
    document.getElementById('release').addEventListener('click', release);

    const speedEl = document.getElementById('speed'), speedV = document.getElementById('speedV');
    const readSpeed = () => { rate = 0.25 * Math.pow(16, speedEl.value / 100); speedV.textContent = `${rate < 1 ? rate.toFixed(2).replace(/0$/, '') : rate.toFixed(1).replace(/\.0$/, '')}x`; };
    speedEl.value = Curio.store.get('pendulum-wave:speed', 50);
    speedEl.addEventListener('input', () => { readSpeed(); Curio.store.set('pendulum-wave:speed', +speedEl.value); });
    readSpeed();
    const countEl = document.getElementById('count'), countV = document.getElementById('countV');
    countEl.value = n; countV.textContent = n;
    countEl.addEventListener('input', () => { n = +countEl.value; countV.textContent = n; Curio.store.set('pendulum-wave:count', n); build(); release(); });

    const themesEl = document.getElementById('themes');
    for (const k in THEMES) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'th'; b.dataset.theme = k; b.title = THEMES[k].name; b.setAttribute('aria-label', `${THEMES[k].name} theme`);
      b.style.background = `linear-gradient(135deg, ${THEMES[k].c(0)}, ${THEMES[k].c(0.5)}, ${THEMES[k].c(1)})`;
      b.addEventListener('click', () => { theme = k; Curio.store.set('pendulum-wave:theme', k); themesEl.querySelectorAll('.th').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); });
      themesEl.append(b);
    }
    themesEl.querySelector(`[data-theme="${theme}"]`).setAttribute('aria-pressed', 'true');

    addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('button, input') && (e.key === ' ' || e.key === 'Enter')) return;
      if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
      else if (e.key === 'r' || e.key === 'R') release();
      else if (e.key >= '1' && e.key <= '4') setCam(['three', 'side', 'top', 'end'][+e.key - 1]);
      else if (e.target.closest?.('input')) return;
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); nudge(-0.12, 0); }
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); nudge(0.12, 0); }
      else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); nudge(0, 0.1); }
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); nudge(0, -0.1); }
    });
    addEventListener('resize', resize);

    resize(); build(); start();
    if (!Curio.touchpad && matchMedia('(pointer: fine)').matches && !Curio.store.get('tp-hint-pendulum-wave', false)) { Curio.store.set('tp-hint-pendulum-wave', true); setTimeout(() => Curio.toast('Tip: on a laptop touchpad, turn on Touchpad mode in the top bar: click to grab the camera, click again to let go', 4200), 1800); }
    window.__pw = { setT: (v) => { t = v; pend.forEach((p) => { p.trail = []; for (let k = 34; k > 0; k--) p.trail.push(bobPos(p, v - k / 50 * rate)); }); }, setCam };
  })();
  </script>
</body>
</html>
