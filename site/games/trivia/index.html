<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trivia Night · Zoble</title>
  <meta name="description" content="Over 850 questions in ten categories. Classic, survival, a 60 second blitz and a daily quiz. Pull up a stool at the quiz table.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="trivia">
  <main class="c-wrap">
    <section id="menu" class="tv-head">
      <svg class="tv-hero" viewBox="0 0 420 150" role="img" aria-label="A chalkboard reading Trivia Night framed by marquee lights">
        <defs><linearGradient id="hb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4a3a"/><stop offset="1" stop-color="#1e3326"/></linearGradient></defs>
        <rect x="40" y="8" width="340" height="134" rx="16" fill="#8d5a2b"/>
        <rect x="52" y="20" width="316" height="110" rx="8" fill="url(#hb)"/>
        <g fill="#ffd54a">
          <circle class="bulb" cx="60" cy="14" r="4"/><circle class="bulb" cx="90" cy="14" r="4"/><circle class="bulb" cx="120" cy="14" r="4"/><circle class="bulb" cx="150" cy="14" r="4"/><circle class="bulb" cx="180" cy="14" r="4"/><circle class="bulb" cx="210" cy="14" r="4"/><circle class="bulb" cx="240" cy="14" r="4"/><circle class="bulb" cx="270" cy="14" r="4"/><circle class="bulb" cx="300" cy="14" r="4"/><circle class="bulb" cx="330" cy="14" r="4"/><circle class="bulb" cx="360" cy="14" r="4"/>
          <circle class="bulb" cx="60" cy="136" r="4"/><circle class="bulb" cx="90" cy="136" r="4"/><circle class="bulb" cx="120" cy="136" r="4"/><circle class="bulb" cx="150" cy="136" r="4"/><circle class="bulb" cx="180" cy="136" r="4"/><circle class="bulb" cx="210" cy="136" r="4"/><circle class="bulb" cx="240" cy="136" r="4"/><circle class="bulb" cx="270" cy="136" r="4"/><circle class="bulb" cx="300" cy="136" r="4"/><circle class="bulb" cx="330" cy="136" r="4"/><circle class="bulb" cx="360" cy="136" r="4"/>
        </g>
        <text x="210" y="74" text-anchor="middle" font-size="38" font-weight="900" fill="#f4f1e8" font-family="Georgia, serif" letter-spacing="2">TRIVIA</text>
        <text x="210" y="112" text-anchor="middle" font-size="26" font-weight="700" fill="#ffd54a" font-family="Georgia, serif" font-style="italic">Night</text>
        <g stroke="#f4f1e8" stroke-width="2" fill="none" opacity=".55"><path d="M86 100 q10 -20 22 0"/><path d="M312 52 l10 10 m0 -10 l-10 10"/><circle cx="330" cy="104" r="8"/></g>
        <text x="96" y="58" font-size="28" fill="#f4f1e8" opacity=".6" font-family="Georgia, serif">?</text>
      </svg>
      <h1 class="c-title">Trivia Night</h1>
      <p class="c-sub">Pull up a stool. <span id="qCount">850+</span> questions in ten categories, no phones under the table.</p>
      <div class="tv-label">Format</div>
      <div class="tv-modes" id="modes">
        <button type="button" class="tv-mode" data-m="classic"><i>🍻</i><b>Classic</b><span>15 questions, 20 s each</span></button>
        <button type="button" class="tv-mode" data-m="survival"><i>❤️</i><b>Survival</b><span>3 lives, how far?</span></button>
        <button type="button" class="tv-mode" data-m="blitz"><i>⚡</i><b>Blitz</b><span>60 seconds, go go go</span></button>
        <button type="button" class="tv-mode" data-m="daily"><i>📅</i><b>Daily</b><span id="dailySub">10 for everyone today</span></button>
      </div>
      <div class="tv-label">Pick a category</div>
      <div class="tv-cats" id="cats"></div>
      <div class="tv-rules" id="rules"></div>
      <p class="c-muted" style="margin-top:12px;font-size:14px">Keys: <span class="c-kbd">1</span> to <span class="c-kbd">4</span> answer, <span class="c-kbd">F</span> 50:50, <span class="c-kbd">S</span> skip, <span class="c-kbd">Z</span> freeze, <span class="c-kbd">Esc</span> quit</p>
    </section>

    <section id="game" class="tv-game" hidden>
      <div class="tv-stage" id="stage">
        <div class="tv-stats">
          <div class="c-stat"><b id="sQ">1/15</b><span id="sQLabel">Question</span></div>
          <div class="c-stat"><b id="sScore">0</b><span>Score</span></div>
          <div class="c-stat"><b id="sStreak">0</b><span>Streak</span></div>
        </div>
        <div class="tv-timer" aria-hidden="true"><i id="bar"></i></div>
        <div class="tv-meta"><span class="tv-chip" id="chip"></span><span class="tv-flame" id="flame" aria-hidden="true"></span><span class="tv-secs" id="secs">20s</span></div>
        <div class="tv-card" id="card">
          <p class="tv-q" id="q" aria-live="polite"></p>
          <div class="tv-opts" id="opts"></div>
        </div>
        <div class="tv-life">
          <button type="button" class="c-btn c-btn--ghost" id="fifty">✂️ 50:50</button>
          <button type="button" class="c-btn c-btn--ghost" id="skip">⏭️ Skip</button>
          <button type="button" class="c-btn c-btn--ghost" id="freeze">🧊 Freeze</button>
        </div>
        <p class="tv-note" id="note"></p>
      </div>
    </section>

    <section id="result" class="tv-result" hidden>
      <div class="c-card">
        <svg class="tv-ring" id="ring" viewBox="0 0 150 150" aria-hidden="true"></svg>
        <h2 class="c-title" id="rTitle" style="font-size:28px;margin-top:6px">Final score</h2>
        <div class="tv-big" id="rScore">0</div>
        <p class="c-muted" id="rLine" style="margin:4px 0 0;font-weight:700"></p>
        <div class="tv-dots" id="rDots" aria-hidden="true"></div>
        <p id="rQuip" style="margin:0 0 10px;color:var(--ink-2)"></p>
        <div class="tv-new-badges" id="rBadges"></div>
        <div class="tv-catbars" id="rCats"></div>
        <div class="c-row" style="justify-content:center;margin-top:12px">
          <button type="button" class="c-btn" id="again">Play again</button>
          <button type="button" class="c-btn c-btn--ghost" id="share">📋 Share</button>
          <button type="button" class="c-btn c-btn--ghost" id="back">Menu</button>
        </div>
      </div>
      <div class="tv-review" id="review"></div>
    </section>

    <section class="c-card tv-panel" id="panel">
      <div class="tv-ptabs" role="tablist">
        <button type="button" role="tab" data-tab="stats" aria-selected="true">Your stats</button>
        <button type="button" role="tab" data-tab="badges" aria-selected="false">Badges <span id="badgeCount"></span></button>
      </div>
      <div data-pane="stats"><div class="tv-stattbl" id="statTbl"></div><div class="tv-catbars" id="allCats" style="max-width:none"></div></div>
      <div data-pane="badges" hidden><div class="tv-badges" id="badgeList"></div></div>
    </section>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
