<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sketch Artist · Curio</title>
  <meta name="description" content="Witnesses describe the suspect, you draw them. Then see how close your police sketch really was.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="sketch-artist">
  <main class="c-wrap sk">
    <section id="home" class="sk-home" hidden>
      <header class="sk-hero">
        <h1 class="c-title">Sketch Artist</h1>
        <p class="c-sub">Witnesses describe the suspect. You draw them. Justice is served, roughly.</p>
        <div class="sk-rank c-card">
          <span class="sk-rank__emoji" id="rankEmoji" aria-hidden="true">✏️</span>
          <div class="sk-rank__main">
            <small>Your rank</small>
            <b id="rankTitle">Rookie</b>
            <div class="sk-rank__bar" aria-hidden="true"><i id="rankBar"></i></div>
            <span class="sk-rank__next" id="rankNext"></span>
          </div>
          <div class="sk-rank__stats">
            <div class="c-stat"><b id="statSolved">0</b><span>Solved</span></div>
            <div class="c-stat"><b id="statAvg">-</b><span>Avg best</span></div>
            <div class="c-stat"><b id="statSketches">0</b><span>Sketches</span></div>
          </div>
        </div>
        <div class="c-row sk-hero__cta">
          <button class="c-btn" id="startBtn" type="button">Take the next case</button>
          <button class="c-btn c-btn--ghost" id="randomBtn" type="button">Random case</button>
        </div>
      </header>
      <div class="sk-tabs" role="tablist" aria-label="Views">
        <button class="sk-tab is-on" type="button" role="tab" data-tab="board" aria-selected="true">🗂️ Case board</button>
        <button class="sk-tab" type="button" role="tab" data-tab="gallery" aria-selected="false">🖼️ Gallery</button>
      </div>
      <div id="board" class="sk-board"></div>
      <div id="gallery" class="sk-gallery" hidden></div>
    </section>

    <section id="case" class="sk-case" hidden>
      <div class="sk-casehead">
        <button class="sk-back" id="backBtn" type="button" aria-label="Back to the case board">←</button>
        <div class="sk-casehead__txt">
          <span class="sk-casehead__no"><span id="caseNo">Case #01</span> · <span id="caseBest"></span></span>
          <h2 id="caseName">Case</h2>
          <p id="caseCrime"></p>
        </div>
      </div>
      <div class="sk-desk">
        <aside class="sk-wit" aria-label="Witness statements">
          <div class="sk-wit__head"><b>Witness statements</b><button class="sk-link" id="skipBtn" type="button">Show all</button></div>
          <ol id="feed" class="sk-feed" aria-live="polite"></ol>
        </aside>
        <div class="sk-padcol">
          <div class="sk-pad" id="pad" data-tool="p">
            <svg class="sk-guide" viewBox="0 0 300 400" aria-hidden="true">
              <ellipse cx="150" cy="212" rx="72" ry="90"/>
              <path d="M128 296V322M172 296V322M30 400C34 358 66 340 121 322M179 322C234 340 266 358 270 400"/>
              <path class="sk-guide__aux" d="M92 207H208M150 126V302M136 240H164M126 272H174"/>
            </svg>
            <canvas id="cv" role="img" aria-label="Sketch pad. Draw the suspect with your mouse, pen or finger."></canvas>
          </div>
          <div class="sk-tools" role="toolbar" aria-label="Drawing tools">
            <div class="sk-tools__grp">
              <button class="sk-tool" type="button" data-tool="p" aria-pressed="true" title="Pencil (P)" aria-label="Pencil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-5L16 4l4 4L9 19z M14 6l4 4"/></svg></button>
              <button class="sk-tool" type="button" data-tool="e" aria-pressed="false" title="Eraser (E)" aria-label="Eraser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20h12M5 15l9-9 5 5-8 9H9z M9 11l5 5"/></svg></button>
            </div>
            <div class="sk-tools__grp">
              <button class="sk-tool sk-size" type="button" data-size="0" aria-pressed="false" title="Fine (1)" aria-label="Fine line"><i style="--d:4px"></i></button>
              <button class="sk-tool sk-size" type="button" data-size="1" aria-pressed="true" title="Medium (2)" aria-label="Medium line"><i style="--d:8px"></i></button>
              <button class="sk-tool sk-size" type="button" data-size="2" aria-pressed="false" title="Thick (3)" aria-label="Thick line"><i style="--d:14px"></i></button>
            </div>
            <div class="sk-tools__grp">
              <button class="sk-tool" type="button" id="undoBtn" title="Undo (U or Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h10a6 6 0 010 12h-3"/></svg></button>
              <button class="sk-tool" type="button" id="clearBtn" title="Clear page" aria-label="Clear page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16 M10 11v6 M14 11v6 M6 7l1 13h10l1-13 M9 7V4h6v3"/></svg></button>
              <button class="sk-tool" type="button" id="guideBtn" aria-pressed="true" title="Face guide (G)" aria-label="Face outline guide"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="11" rx="6" ry="8" stroke-dasharray="2.5 2.5"/><path d="M9 10h.01M15 10h.01M10 15h4"/></svg></button>
            </div>
          </div>
          <button class="c-btn sk-submit" id="submitBtn" type="button">Submit sketch 🚔</button>
        </div>
      </div>
    </section>

    <section id="reveal" class="sk-reveal" hidden>
      <div class="sk-compare" id="compare">
        <figure class="sk-polaroid sk-polaroid--you">
          <div class="sk-polaroid__frame sk-paper"><img id="youImg" alt="Your sketch"></div>
          <figcaption>Your sketch</figcaption>
        </figure>
        <figure class="sk-polaroid sk-polaroid--real">
          <div class="sk-polaroid__frame sk-mug"><div id="realFrame"></div><img id="ghostImg" class="sk-ghost" alt=""></div>
          <figcaption id="realCap">Suspect</figcaption>
        </figure>
      </div>
      <div class="sk-overlay-row"><button class="sk-chip" id="overlayBtn" type="button" aria-pressed="false">👁️ Overlay my sketch on the mugshot</button></div>
      <div class="sk-result c-card" id="result" aria-live="polite">
        <div class="sk-result__top">
          <div class="sk-score"><b id="pct">0%</b><span>likeness</span></div>
          <div class="sk-stamp" id="stamp"></div>
        </div>
        <p class="sk-verdict" id="verdict"></p>
        <ul class="sk-check" id="checklist"></ul>
        <div class="sk-wrong" id="wrongGuy" hidden>
          <span class="sk-mini" id="wrongFace"></span>
          <p><small>Arrested by mistake</small><b id="wrongName"></b><span>has been released with an apology muffin.</span></p>
        </div>
        <p class="sk-bestline c-muted" id="bestLine"></p>
        <div class="c-row">
          <button class="c-btn" id="nextBtn" type="button">Next case →</button>
          <button class="c-btn c-btn--ghost" id="retryBtn" type="button">Redraw</button>
          <button class="c-btn c-btn--ghost" id="boardBtn" type="button">Case board</button>
        </div>
      </div>
    </section>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="face.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
