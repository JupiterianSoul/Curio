<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aim Trainer · Curio</title>
  <meta name="description" content="Five ways to train your aim: classic, gridshot, flick, tracking and precision, with skins, a daily challenge and a stats dashboard.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="aim-trainer">
  <main class="c-wrap at-wrap">
    <div class="at-head">
      <h1 class="c-title">Aim Trainer</h1>
      <p class="c-sub">Five drills for your mouse hand (or your finger). Pick one and see how sharp you really are.</p>
    </div>

    <div class="at-modes" id="modes" role="group" aria-label="Drill"></div>
    <div class="at-opts">
      <div class="at-seg" role="group" aria-label="Difficulty" id="diffs"></div>
      <button class="at-chip" id="daily" type="button" aria-pressed="false">📅 Daily</button>
      <button class="at-chip" id="settingsBtn" type="button" aria-pressed="false">🎨 Look</button>
    </div>

    <div class="at-arena" id="arena">
      <canvas id="cv" role="img" aria-label="Aim trainer play area. Targets appear here; click or tap them."></canvas>
      <div class="at-hud" id="hud" aria-hidden="true"><div class="at-hud-side" id="hudL"></div><div class="at-hud-side" id="hudR"></div></div>
      <div class="at-bar" aria-hidden="true"><i id="bar"></i></div>
      <div class="at-screen" id="startScreen">
        <div>
          <div class="at-art" id="startArt" aria-hidden="true"></div>
          <span class="at-kick" id="startKick">Drill</span>
          <h2 id="startTitle">Classic</h2>
          <p id="startDesc"></p>
          <button class="c-btn at-go" id="go" type="button">Start</button>
          <div class="at-small" id="startBest"></div>
        </div>
      </div>
      <div class="at-screen" id="countScreen" hidden aria-live="assertive"><div><div class="at-count" id="count">3</div></div></div>
      <div class="at-screen" id="pauseScreen" hidden>
        <div>
          <h2>Paused</h2>
          <p>You looked away, so the clock stopped.</p>
          <div class="c-row"><button class="c-btn" id="resume" type="button">Resume</button><button class="c-btn c-btn--ghost" id="quit" type="button">Quit</button></div>
        </div>
      </div>
      <div class="at-screen" id="endScreen" hidden aria-live="polite">
        <div>
          <svg class="at-medal" id="medal" viewBox="0 0 100 100" aria-hidden="true"></svg>
          <span class="at-kick" id="endKick"></span>
          <div class="at-score" id="endScore">0</div>
          <div class="at-unit" id="endUnit"></div>
          <div id="endNew"></div>
          <div class="at-verdict" id="endVerdict"></div>
          <div class="at-tiles" id="endTiles"></div>
          <div class="c-row">
            <button class="c-btn" id="again" type="button">Play again</button>
            <button class="c-btn c-btn--ghost" id="share" type="button">🔗 Share</button>
            <button class="c-btn c-btn--ghost" id="menu" type="button">Drills</button>
          </div>
        </div>
      </div>
    </div>
    <p class="at-foot c-muted">Keys: <span class="c-kbd">1</span>-<span class="c-kbd">5</span> pick a drill · <span class="c-kbd">Space</span> start · <span class="c-kbd">R</span> restart · <span class="c-kbd">Esc</span> stop</p>

    <section class="c-card at-break" id="breakdown" aria-live="polite"></section>

    <nav class="at-tabs">
      <button class="at-chip" type="button" data-panel="stats" aria-pressed="false">📊 Stats</button>
      <button class="at-chip" type="button" data-panel="badges" aria-pressed="false">🏆 Badges <em id="achCount">0</em></button>
      <button class="at-chip" type="button" data-panel="help" aria-pressed="false">❓ How to play</button>
    </nav>
    <section class="c-card at-info" id="info" hidden></section>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="game.js"></script>
</body>
</html>
