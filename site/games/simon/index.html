<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sequence Memory · Zoble</title>
  <meta name="description" content="Pads light up in a growing sequence. Repeat it. Classic Simon, 3x3 and 4x4 grids, reverse, speed and chaos modes, six instruments and a daily sequence.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="fx.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="simon">
  <main class="c-wrap sm">
    <header>
      <h1 class="c-title">Sequence Memory</h1>
      <p class="c-sub">Watch the pads light up, then play them back. One more note every level. How long can you keep the tune in your head?</p>
    </header>
    <div class="sm-opts" id="opts">
      <div class="sm-opt"><span>Board</span><div id="oLayout"></div></div>
      <div class="sm-opt"><span>Mode</span><div id="oMode"></div></div>
      <div class="sm-opt"><span>Sound</span><div id="oSound"></div></div>
    </div>
    <div class="sm-hud">
      <div class="c-stat"><b id="level">0</b><span>Level</span></div>
      <div class="sm-lives" id="lives" aria-label="Lives"></div>
      <div class="c-stat"><b id="best">-</b><span>Best</span></div>
    </div>
    <p class="sm-status" id="status" aria-live="polite">Ready when you are.</p>
    <div class="sm-stage" id="stage">
      <div class="sm-aura" aria-hidden="true"></div>
      <div class="sm-board" id="board" role="group" aria-label="Pads"></div>
      <button class="c-btn sm-start" id="start" type="button">Start</button>
      <svg class="sm-timer" id="timer" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46"/></svg>
    </div>
    <div class="sm-cta">
      <label class="fx-toggle"><input type="checkbox" id="chance"> Second chance (one replay)</label>
    </div>
    <div id="tabs"></div>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="fx.js"></script>
  <script src="game.js"></script>
</body>
</html>
