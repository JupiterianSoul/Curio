<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marble Run · Zoble</title>
  <meta name="description" content="Build a marble run from ramps, funnels, bumpers, see-saws, xylophone bars and an elevator, then release a flood of marbles.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="marble-run" data-modes>
  <main class="c-wrap mr-main">
    <div class="mr-stage" id="stage">
      <canvas id="board" role="img" aria-label="Marble run board. Drag pieces from the palette onto the board, drag to move them, then release marbles."></canvas>
      <div class="mr-intro" id="intro">
        <h1>Marble Run <span class="mr-tag" aria-hidden="true">workshop 3</span></h1>
        <p class="simple-only">Drag a few pieces onto the pegboard, then hit Release. Or press Surprise me.</p>
        <p class="adv-only">Drag pieces onto the board, tilt them, then hit Release and listen to the clatter.</p>
      </div>
      <div class="mr-count" aria-live="polite"><b id="nMarbles">0</b> marbles</div>
      <div class="mr-paused" id="pausedTag">PAUSED</div>
      <div class="mr-sel" id="selBar" role="toolbar" aria-label="Selected piece">
        <button type="button" data-sel="ccw" title="Rotate left (Q)" aria-label="Rotate left">⟲</button>
        <button type="button" data-sel="cw" title="Rotate right (E)" aria-label="Rotate right">⟳</button>
        <button type="button" data-sel="flip" title="Mirror (F)" aria-label="Mirror">⇋</button>
        <button type="button" data-sel="note" title="Change note" aria-label="Change note">♪</button>
        <button type="button" data-sel="del" title="Delete (Del)" aria-label="Delete piece">🗑</button>
      </div>
    </div>
    <div class="mr-book adv-only" id="bookPanel" hidden>
      <h2>Workshop jobs</h2>
      <ol class="mr-jobs" id="jobs"></ol>
      <h2>Tally</h2>
      <div class="mr-tally"><div class="c-stat"><b id="tM">0</b><span>marbles</span></div><div class="c-stat"><b id="tN">0</b><span>notes</span></div><div class="c-stat"><b id="tB">0</b><span>bells</span></div><div class="c-stat"><b id="tP">0</b><span>pieces</span></div></div>
      <h2>Saved tracks</h2>
      <div class="mr-slots" id="slots"></div>
      <div class="mr-share"><button type="button" class="mr-b" id="copyCode">📋 Copy code</button><button type="button" class="mr-b" id="pasteCode">📥 Paste code</button></div>
    </div>
    <div class="mr-tools">
      <div class="mr-palette" id="palette" role="toolbar" aria-label="Pieces"></div>
      <div class="mr-actions">
        <button type="button" class="c-btn mr-go" id="release">▶ Release</button>
        <button type="button" class="mr-b mr-sur simple-only" id="surprise">🎲 Surprise me</button>
        <button type="button" class="mr-b adv-only" id="pause" aria-pressed="false">⏸ Pause</button>
        <button type="button" class="mr-b" id="undo">↶ Undo</button>
        <button type="button" class="mr-b adv-only" id="clearM">🫧 Clear marbles</button>
        <label class="mr-b mr-presets adv-only">📐 <select id="preset" aria-label="Load a preset track">
          <option value="">Presets…</option>
        </select></label>
        <button type="button" class="mr-b" id="reset">🗑 Empty board</button>
        <button type="button" class="mr-b adv-only" id="book" aria-pressed="false">📒 Notebook</button>
      </div>
    </div>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="physics.js"></script>
  <script src="game.js"></script>
</body>
</html>
