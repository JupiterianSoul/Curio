<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Slime · Zoble</title>
  <meta name="description" content="A squishy virtual slime. Poke it, stretch it, pinch it, slap it. Glitter, clear, cloud and butter slime with crunchy add-ins.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <style>
    .c-wrap { padding-top: 12px; padding-bottom: 16px; }
    .sl-head { text-align: center; }
    .sl-head .c-title { margin: 0; font-size: clamp(26px, 4.5vw, 38px); }
    .sl-head .c-sub { margin: 2px 0 10px; font-size: 15px; }
    .sl-stage { position: relative; height: max(340px, calc(100dvh - var(--bar-h) - 270px)); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); }
    #slime { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    #slime.grabbing { cursor: grabbing; }
    .sl-tip { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; pointer-events: none; font-size: 13px; font-weight: 700; color: rgba(20, 50, 44, .55); }
    .sl-tools { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: center; margin-top: 12px; }
    .sl-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .lbl { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-right: 2px; }
    .seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; gap: 2px; }
    .seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; cursor: pointer; color: var(--ink-2); touch-action: manipulation; }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); cursor: pointer; box-shadow: 0 0 0 1.5px var(--line); padding: 0; touch-action: manipulation; transition: transform .12s ease; }
    .sw:hover { transform: scale(1.1); }
    .sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); transform: scale(1.1); }
    .chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 11px; font-weight: 800; font-size: 13px; cursor: pointer; touch-action: manipulation; }
    .chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
    .sl-tools .c-btn { padding: 8px 16px; font-size: 15px; }
    html[data-mode="simple"] .adv-only, html[data-mode="advanced"] .simple-only { display: none !important; }
    body[data-game="slime"] { background-color: color-mix(in oklab, #b8f0dc 30%, var(--bg)); background-image: conic-gradient(color-mix(in oklab, #ff8cc6 10%, transparent) 25%, transparent 0 50%, color-mix(in oklab, #ff8cc6 10%, transparent) 0 75%, transparent 0); background-size: 56px 56px; }
    .sl-logo { position: relative; display: inline-block; font-family: "Chalkboard SE", "Comic Neue", "Comic Sans MS", "Arial Rounded MT Bold", ui-rounded, var(--font); font-weight: 900; font-size: clamp(38px, 7vw, 60px) !important; color: #39d39b; -webkit-text-stroke: 2px #136b4e; paint-order: stroke fill; letter-spacing: .02em; text-shadow: 0 4px 0 #136b4e; transform: rotate(-2deg); }
    .sl-drip { position: absolute; left: 10%; right: 8%; top: 80%; height: 16px; pointer-events: none; background: radial-gradient(ellipse 5px 12px at 18% 0, #39d39b 98%, transparent), radial-gradient(ellipse 4px 8px at 52% 0, #39d39b 98%, transparent), radial-gradient(ellipse 5px 15px at 84% 0, #39d39b 98%, transparent); animation: sl-drip 4s ease-in-out infinite; transform-origin: top; }
    @keyframes sl-drip { 50% { transform: scaleY(1.4); } }
    .sl-stage { border: 4px solid #39d39b; border-radius: 28px; }
    .sl-head .c-sub { margin-top: 14px !important; }
    .sl-jars { display: flex; gap: 10px; overflow-x: auto; padding: 4px 4px 8px; max-width: 100%; scrollbar-width: thin; }
    .sl-jar { flex: none; width: 74px; position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; cursor: pointer; color: var(--ink); font-weight: 800; font-size: 12px; padding: 0; transition: transform .2s cubic-bezier(.2, 1.7, .4, 1); }
    .sl-jar__lid { width: 46px; height: 10px; border-radius: 4px 4px 2px 2px; background: linear-gradient(180deg, #ff8cc6, #d64f93); box-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
    .sl-jar__goo { width: 54px; height: 46px; border-radius: 10px 10px 18px 18px; border: 3px solid rgba(255, 255, 255, .85); box-shadow: 0 0 0 1.5px var(--line), inset 0 -6px 10px rgba(0, 0, 0, .12); margin-top: -3px; }
    .sl-jar__goo.is-glit { background-blend-mode: screen; box-shadow: 0 0 0 1.5px var(--line), inset 0 0 12px #fff; }
    .sl-jar:hover { transform: translateY(-4px) rotate(-3deg); }
    .sl-jar:active { transform: scale(.92); }
    .sl-jar[aria-pressed="true"] .sl-jar__goo { box-shadow: 0 0 0 3px var(--accent); }
    .sl-jar:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
    html[data-mode="simple"] .sl-tools .c-btn { padding: 12px 22px; font-size: 17px; }
    .sl-order { max-width: 720px; margin: 0 auto 10px; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 18px; background: var(--surface); border: 2px dashed #39d39b; }
    .sl-order__face { font-size: 34px; line-height: 1; flex: none; animation: sl-bob 2.4s ease-in-out infinite; }
    @keyframes sl-bob { 50% { transform: translateY(-3px) rotate(4deg); } }
    .sl-order__txt { flex: 1; min-width: 0; font-size: 14px; display: flex; flex-direction: column; }
    .sl-order__txt small { color: var(--ink-3); font-size: 12px; }
    .sl-order__btns { display: flex; gap: 6px; flex: none; }
    .sl-order__btns .c-btn { padding: 7px 12px; font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { .sl-drip, .sl-order__face { animation: none; } }
    @media (max-width: 560px) {
      .sl-order { flex-wrap: wrap; } .sl-order__btns { width: 100%; justify-content: flex-end; }
      .sl-head .c-sub { font-size: 13px; }
      .sl-stage { height: max(320px, calc(100dvh - var(--bar-h) - 360px)); }
      .sw { width: 27px; height: 27px; }
      .seg button { padding: 7px 9px; font-size: 13px; white-space: nowrap; }
      .sl-tip { font-size: 11px; padding: 0 12px; }
    }
  </style>
</head>
<body data-game="slime" data-modes>
  <main class="c-wrap">
    <div class="sl-head">
      <h1 class="c-title sl-logo">Slime<span class="sl-drip" aria-hidden="true"></span></h1>
      <p class="c-sub">Zero mess, maximum squish. It forgives every poke, eventually.</p>
    </div>
    <div class="sl-order adv-only" id="order" aria-live="polite">
      <div class="sl-order__face" id="ordFace" aria-hidden="true">🧒</div>
      <div class="sl-order__txt"><b id="ordWho"></b><span id="ordWant"></span><small id="ordStat"></small></div>
      <div class="sl-order__btns"><button type="button" class="c-btn" id="sell">💰 Sell</button><button type="button" class="c-btn c-btn--ghost" id="nextOrd" aria-label="Next customer">⏭</button></div>
    </div>
    <div class="sl-stage" id="stage">
      <canvas id="slime" role="img" aria-label="A blob of slime on a craft mat. Tap to poke, hold or use the Squish tool to squish, drag to stretch."></canvas>
      <div class="sl-tip" id="tip">Tap to poke · Hold to squish · Drag to stretch · Two fingers to pull apart</div>
    </div>
    <div class="sl-tools">
      <div class="sl-group">
        <div class="seg adv-only" role="group" aria-label="Hand tool">
          <button type="button" data-tool="hand" aria-pressed="true" title="Hand (1)">✋ Hand</button>
          <button type="button" data-tool="pinch" aria-pressed="false" title="Pinch (2)">🤏 Pinch</button>
          <button type="button" data-tool="poke" aria-pressed="false" title="Poke (3)">👉 Poke</button>
          <button type="button" data-tool="squish" aria-pressed="false" title="Squish (4)">🫳 Squish</button>
        </div>
        <button type="button" class="c-btn" id="slap" title="Slap (Space)">👋 Slap</button>
        <button type="button" class="c-btn c-btn--ghost simple-only" id="surprise" title="Surprise me (R)">🎲 Surprise me</button>
        <button type="button" class="c-btn c-btn--ghost adv-only" id="png" title="Photo (E)">📷 Photo</button>
      </div>
      <div class="sl-jars simple-only" id="jars" role="group" aria-label="Slime jars"></div>
      <div class="sl-group adv-only" role="group" aria-label="Texture"><span class="lbl">Type</span><span class="sl-group" id="types"></span></div>
      <div class="sl-group adv-only" role="group" aria-label="Colour" id="colors"></div>
      <div class="sl-group adv-only" role="group" aria-label="Add-ins"><span class="lbl">Add</span><span class="sl-group" id="addins"></span></div>
    </div>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script>
  (() => {
    const COLORS = [
      ['Mint', '#6fe3bf'], ['Bubblegum', '#ff8cc6'], ['Grape', '#a98bff'], ['Sky', '#62c4ff'],
      ['Lemon', '#ffe066'], ['Peach', '#ffa86e'], ['Lime', '#b4ec52'], ['Galaxy', '#3d2b86'],
      ['Cherry', '#ff4d6d'], ['Lagoon', '#1fb5a8'], ['Matcha', '#9cc45e'], ['Lavender', '#cdb0ff'], ['Coral', '#ff7b5c'], ['Midnight', '#2b3a78']
    ];
    const TYPES = {
      glossy: { name: 'Glossy', gloss: 1, alpha: 1, glitter: 0 },
      glitter: { name: 'Glitter', gloss: 0.9, alpha: 1, glitter: 1 },
      clear: { name: 'Clear', gloss: 1.2, alpha: 0.32, glitter: 0 },
      cloud: { name: 'Cloud', gloss: 0.25, alpha: 1, glitter: 0 },
      butter: { name: 'Butter', gloss: 0.45, alpha: 1, glitter: 0 },
      jelly: { name: 'Jelly', gloss: 1.15, alpha: 0.62, glitter: 0 },
      holo: { name: 'Holo', gloss: 1.1, alpha: 0.55, glitter: 1 }
    };
    const ADDINS = { beads: '🫧 Foam beads', sprinkles: '🍬 Sprinkles', stars: '⭐ Charms', bubbles: '◌ Bubbles' };

    const canvas = document.getElementById('slime');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    const tip = document.getElementById('tip');
    let W = 0, H = 0, dpr = 1, R = 120, home = { x: 0, y: 0 };
    let color = Curio.store.get('slime:color', 0), type = Curio.store.get('slime:type', 'glossy');
    if (!TYPES[type]) type = 'glossy';
    const addins = Curio.store.get('slime:addins', { beads: false, sprinkles: false, stars: false, bubbles: false });
    let tool = 'hand';
    const SIMPLE = Curio.simple;
    if (SIMPLE && (color > 7 || ['jelly', 'holo'].includes(type))) { color = 0; type = 'glossy'; }
    if (color >= COLORS.length || color < 0) color = 0;

    const N = 64;
    let pts = [], A0 = 1, L0 = 1, restScale = 1, restTarget = 1;
    const bg = document.createElement('canvas'), bgc = bg.getContext('2d');

    const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
    const css = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

    function paintBg() {
      bg.width = canvas.width; bg.height = canvas.height;
      const dark = Curio.isDark();
      bgc.setTransform(dpr, 0, 0, dpr, 0, 0);
      const g = bgc.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, dark ? '#173d37' : '#cfeee3'); g.addColorStop(1, dark ? '#10302b' : '#bfe5d8');
      bgc.fillStyle = g; bgc.fillRect(0, 0, W, H);
      const step = 28;
      bgc.lineWidth = 1;
      for (let x = (W / 2) % step, i = 0; x < W; x += step, i++) {
        bgc.strokeStyle = dark ? 'rgba(160,230,210,.08)' : 'rgba(40,120,100,.12)';
        bgc.beginPath(); bgc.moveTo(x + 0.5, 0); bgc.lineTo(x + 0.5, H); bgc.stroke();
      }
      for (let y = (H / 2) % step; y < H; y += step) {
        bgc.strokeStyle = dark ? 'rgba(160,230,210,.08)' : 'rgba(40,120,100,.12)';
        bgc.beginPath(); bgc.moveTo(0, y + 0.5); bgc.lineTo(W, y + 0.5); bgc.stroke();
      }
      bgc.strokeStyle = dark ? 'rgba(160,230,210,.18)' : 'rgba(40,120,100,.28)';
      for (let x = (W / 2) % (step * 5); x < W; x += step * 5) { bgc.beginPath(); bgc.moveTo(x + 0.5, 0); bgc.lineTo(x + 0.5, H); bgc.stroke(); }
      for (let y = (H / 2) % (step * 5); y < H; y += step * 5) { bgc.beginPath(); bgc.moveTo(0, y + 0.5); bgc.lineTo(W, y + 0.5); bgc.stroke(); }
      bgc.fillStyle = dark ? 'rgba(160,230,210,.3)' : 'rgba(40,120,100,.4)';
      for (let x = 0; x < W; x += 7) bgc.fillRect(x, 0, 1, x % 35 === 0 ? 10 : 5);
      const v = bgc.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
      v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, dark ? 'rgba(0,0,0,.35)' : 'rgba(0,60,40,.12)');
      bgc.fillStyle = v; bgc.fillRect(0, 0, W, H);
      tip.style.color = dark ? 'rgba(200,240,230,.5)' : 'rgba(20,70,60,.55)';
    }

    function build() {
      pts = [];
      const ph = Math.random() * 6;
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const rr = R * (1 + 0.035 * Math.sin(3 * a + ph) + 0.02 * Math.sin(5 * a + ph * 2));
        pts.push({ x: home.x + Math.cos(a) * rr * 1.05, y: home.y + Math.sin(a) * rr * 0.92, vx: 0, vy: 0, ox: Math.cos(a) * rr, oy: Math.sin(a) * rr });
      }
      A0 = 0; let per = 0;
      for (let i = 0; i < N; i++) { const p = pts[i], q = pts[(i + 1) % N]; A0 += p.ox * q.oy - q.ox * p.oy; per += Math.hypot(q.ox - p.ox, q.oy - p.oy); }
      A0 /= 2; L0 = per / N;
    }

    function resize() {
      const r = stage.getBoundingClientRect();
      const oldW = W, oldH = H, oldR = R;
      dpr = Math.min(2, devicePixelRatio || 1);
      W = r.width; H = r.height;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      R = Math.max(70, Math.min(W, H) * 0.28);
      home = { x: W / 2, y: H / 2 - 6 };
      if (!pts.length) build();
      else {
        const k = R / oldR;
        for (const p of pts) { p.x = home.x + (p.x - oldW / 2) * k; p.y = home.y + (p.y - oldH / 2 + 6) * k; p.ox *= k; p.oy *= k; }
        A0 *= k * k; L0 *= k;
      }
      paintBg();
    }

    function centroid() {
      let x = 0, y = 0;
      for (const p of pts) { x += p.x; y += p.y; }
      return { x: x / N, y: y / N };
    }
    function area() {
      let a = 0;
      for (let i = 0; i < N; i++) { const p = pts[i], q = pts[(i + 1) % N]; a += p.x * q.y - q.x * p.y; }
      return a / 2;
    }

    const grabs = new Map();
    let squish = null;

    function step(dt) {
      const c = centroid();
      let num = 0, den = 0;
      for (const p of pts) { const dx = p.x - c.x, dy = p.y - c.y; num += p.ox * dy - p.oy * dx; den += p.ox * dx + p.oy * dy; }
      const th = Math.atan2(num, den), co = Math.cos(th), si = Math.sin(th);
      restScale += (restTarget - restScale) * Math.min(1, dt * 5);
      const s = restScale;
      const A = area(), P = 2600 * ((A0 * s * s) / Math.max(1, A) - 1);
      const kShape = 26, kHome = 2.2;
      const hx = (home.x - c.x) * kHome, hy = (home.y - c.y) * kHome;
      for (const p of pts) {
        const gx = c.x + (co * p.ox - si * p.oy) * s, gy = c.y + (si * p.ox + co * p.oy) * s;
        p.fx = (gx - p.x) * kShape + hx; p.fy = (gy - p.y) * kShape + hy;
      }
      for (let i = 0; i < N; i++) {
        const p = pts[i], q = pts[(i + 1) % N];
        const dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 0.001, ux = dx / L, uy = dy / L;
        const rv = (q.vx - p.vx) * ux + (q.vy - p.vy) * uy;
        const F = 300 * (L - L0 * s) + 8 * rv;
        p.fx += F * ux; p.fy += F * uy; q.fx -= F * ux; q.fy -= F * uy;
        const nx = dy * P * 0.5, ny = -dx * P * 0.5;
        p.fx += nx; p.fy += ny; q.fx += nx; q.fy += ny;
        const r2 = pts[(i + 2) % N];
        const ex = r2.x - p.x, ey = r2.y - p.y, E = Math.hypot(ex, ey) || 0.001;
        const F2 = 50 * (E - L0 * 2 * s * 0.995);
        p.fx += F2 * ex / E; p.fy += F2 * ey / E; r2.fx -= F2 * ex / E; r2.fy -= F2 * ey / E;
      }
      for (const g of grabs.values()) {
        if (!g.active) continue;
        const mx = g.x - g.sx, my = g.y - g.sy;
        for (const w of g.w) {
          const p = pts[w.i];
          const tx = w.x0 + mx * w.k, ty = w.y0 + my * w.k;
          p.fx += (tx - p.x) * 650 * w.k - p.vx * 14 * w.k;
          p.fy += (ty - p.y) * 650 * w.k - p.vy * 14 * w.k;
        }
      }
      if (squish) {
        for (const p of pts) {
          const dx = p.x - squish.x, dy = p.y - squish.y, d = Math.hypot(dx, dy) || 1;
          const f = 900 * squish.amt * Math.exp(-(d * d) / (R * R * 1.4));
          p.fx += (dx / d) * f; p.fy += (dy / d) * f;
        }
      }
      const damp = Math.exp(-2.4 * dt);
      for (const p of pts) {
        p.vx = (p.vx + p.fx * dt) * damp; p.vy = (p.vy + p.fy * dt) * damp;
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (p.x < 4) { p.x = 4; p.vx *= -0.3; } if (p.x > W - 4) { p.x = W - 4; p.vx *= -0.3; }
        if (p.y < 4) { p.y = 4; p.vy *= -0.3; } if (p.y > H - 4) { p.y = H - 4; p.vy *= -0.3; }
      }
    }

    function sample(s) {
      s = ((s % N) + N) % N;
      const i = Math.floor(s), t = s - i, p = pts[i], q = pts[(i + 1) % N];
      return { x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t };
    }
    function mapSF(s, f, c) {
      const b = sample(s);
      return { x: c.x + (b.x - c.x) * f, y: c.y + (b.y - c.y) * f };
    }
    function locate(x, y, c) {
      const dx = x - c.x, dy = y - c.y, d = Math.hypot(dx, dy);
      if (d < 0.001) return { s: 0, f: 0 };
      const ux = dx / d, uy = dy / d;
      let best = null;
      for (let i = 0; i < N; i++) {
        const p = pts[i], q = pts[(i + 1) % N];
        const ex = q.x - p.x, ey = q.y - p.y;
        const den = ux * ey - uy * ex;
        if (Math.abs(den) < 1e-9) continue;
        const wx = p.x - c.x, wy = p.y - c.y;
        const t = (wx * ey - wy * ex) / den, u = (wx * uy - wy * ux) / den;
        if (t > 0 && u >= 0 && u <= 1 && (!best || t < best.t)) best = { t, s: i + u };
      }
      if (!best) return null;
      return { s: best.s, f: d / best.t };
    }

    const parts = [];
    function seedParts() {
      parts.length = 0;
      const add = (kind, n, fn) => { for (let i = 0; i < n; i++) parts.push({ kind, s: Math.random() * N, f: Math.sqrt(Math.random()) * 0.88, ph: Math.random() * 6.28, rot: Math.random() * 6.28, ...fn(i) }); };
      if (TYPES[type].glitter) add('glitter', 260, () => ({ size: Curio.rand(1.2, 2.6), c: Curio.pick(['#ffffff', '#ffe9a8', '#ffd1f0', '#c6f2ff', '#e0d1ff']) }));
      if (type === 'cloud') add('puff', 26, () => ({ size: Curio.rand(0.16, 0.3) }));
      if (type === 'clear') add('bubble', 18, () => ({ size: Curio.rand(2, 7) }));
      if (addins.beads) add('bead', 46, () => ({ size: Curio.rand(4.5, 6.5), c: Curio.pick(['#ffffff', '#ff9ccf', '#8fd9ff', '#fff07a', '#b9f78b', '#d2b4ff']) }));
      if (addins.sprinkles) add('sprinkle', 40, () => ({ size: Curio.rand(6, 9), c: Curio.pick(['#ff5a8a', '#ffd23f', '#3ec7ff', '#7cf07c', '#ffffff', '#b07cff']) }));
      if (addins.stars) add('star', 9, () => ({ size: Curio.rand(7, 10), c: Curio.pick(['#ffd23f', '#ff7eb6', '#7ee0ff']) }));
      if (addins.bubbles) add('bubble', 22, () => ({ size: Curio.rand(2, 6) }));
      parts.sort((a, b) => (a.kind === 'puff' ? -1 : 0) - (b.kind === 'puff' ? -1 : 0));
    }

    const holes = [];
    const ripples = [];

    function smoothPath(c2, list, scale, cx, cy) {
      const n = list.length;

        if (!g.active && !g.squish && !g.tp && g.inside && performance.now() - g.t0 > 230 && g.moved <= 9) {
          g.squish = true; squish = { x: g.x, y: g.y, amt: 0 }; restTarget = 1.14; squelch(0.7); crunch(6);
        }
      }
      if (squish) {
        squish.amt = Math.min(1, squish.amt + dt * 1.6);
        bubbleT -= dt;
        if (bubbleT < 0) { bubbleT = Curio.rand(0.25, 0.6); squelch(0.35); crunch(3); }
      }
      let pull = 0;
      for (const g of grabs.values()) if (g.active) { pull += Math.hypot(g.x - g.lx, g.y - g.ly) / Math.max(dt, 0.001) / 1500; g.lx = g.x; g.ly = g.y; }
      stretchSound(Math.min(1, pull));
      const sub = Math.max(1, Math.round(dt / (1 / 240)));
      for (let i = 0; i < sub; i++) step(dt / sub);
      for (let i = holes.length - 1; i >= 0; i--) {
        const h = holes[i]; h.age += dt; h.heal = Math.min(1, h.heal + dt * 3);
        if (h.age > h.life) { holes.splice(i, 1); healPop(); }
      }
      for (let i = ripples.length - 1; i >= 0; i--) { ripples[i].t += dt * 1.8; if (ripples[i].t > 1) ripples.splice(i, 1); }
      draw();
    }
    const start = () => { if (!raf) { last = 0; raf = requestAnimationFrame(frame); } };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; stretchSound(0); };
    document.addEventListener('visibilitychange', () => (document.hidden ? stop() : start()));

    document.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => {
      tool = b.dataset.tool;
      document.querySelectorAll('[data-tool]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    }));
    document.getElementById('slap').addEventListener('click', slap);
    addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
      if (e.key === ' ') { e.preventDefault(); slap(); }
      else if (/^[1-4]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) document.querySelectorAll('[data-tool]')[+e.key - 1].click();
      else if (e.key === 'p' || e.key === 'P') { const c = centroid(); poke(c.x + Curio.rand(-R, R) * 0.5, c.y + Curio.rand(-R, R) * 0.5, false); }
    });

    const typesEl = document.getElementById('types');
    for (const k in TYPES) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.type = k; b.textContent = TYPES[k].name;
      b.addEventListener('click', () => { type = k; Curio.store.set('slime:type', k); syncUi(); seedParts(); squelch(0.6); noteRecipe(); });
      typesEl.append(b);
    }
    const colorsEl = document.getElementById('colors');
    COLORS.forEach(([name, hex], i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sw'; b.dataset.i = i; b.title = name; b.setAttribute('aria-label', `${name} slime`);
      b.style.background = `radial-gradient(circle at 35% 30%, #fff 0 8%, ${hex} 40%, ${css(mix(rgb(hex), [10, 0, 30], 0.3))})`;
      b.addEventListener('click', () => { color = i; Curio.store.set('slime:color', i); syncUi(); squelch(0.4); noteRecipe(); });
      colorsEl.append(b);
    });
    const addEl = document.getElementById('addins');
    for (const k in ADDINS) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.dataset.add = k; b.textContent = ADDINS[k];
      b.addEventListener('click', () => { addins[k] = !addins[k]; Curio.store.set('slime:addins', addins); syncUi(); seedParts(); if (addins[k]) { crunch(10); squelch(0.5); } });
      addEl.append(b);
    }
    function syncUi() {
      typesEl.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.type === type)));
      colorsEl.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.i === color)));
      addEl.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(!!addins[b.dataset.add])));
    }

    const JARS = [
      { name: 'Mint cloud', type: 'cloud', color: 0, add: [] },
      { name: 'Unicorn', type: 'glitter', color: 1, add: ['stars'] },
      { name: 'Crunchy', type: 'glossy', color: 3, add: ['beads'] },
      { name: 'Lemon butter', type: 'butter', color: 4, add: [] },
      { name: 'Fishbowl', type: 'clear', color: 3, add: ['beads', 'bubbles'] },
      { name: 'Galaxy', type: 'glitter', color: 7, add: ['stars', 'sprinkles'] },
      { name: 'Birthday', type: 'glossy', color: 5, add: ['sprinkles'] }
    ];
    function setRecipe(t, c, adds) {
      type = t; color = c; for (const k in addins) addins[k] = adds.includes(k);
      Curio.store.set('slime:type', t); Curio.store.set('slime:color', c); Curio.store.set('slime:addins', addins);
      syncUi(); seedParts(); squelch(0.8); crunch(8); slap();
      if (navigator.vibrate) navigator.vibrate([10, 30, 14]);
      noteRecipe();
    }
    const jarsEl = document.getElementById('jars');
    JARS.forEach((j) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'sl-jar'; b.title = j.name;
      const hx = COLORS[j.color][1];
      b.innerHTML = '<i class="sl-jar__lid"></i><i class="sl-jar__goo"></i><span></span>';
      b.querySelector('.sl-jar__goo').style.background = `radial-gradient(circle at 35% 30%, #fff 0 10%, ${hx} 45%, ${css(mix(rgb(hx), [10, 0, 30], 0.3))})`;
      if (j.type === 'glitter') b.querySelector('.sl-jar__goo').classList.add('is-glit');
      b.querySelector('span').textContent = j.name;
      b.addEventListener('click', () => { setRecipe(j.type, j.color, j.add); jarsEl.querySelectorAll('.sl-jar').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); });
      jarsEl.append(b);
    });
    function surprise() {
      const pool = SIMPLE ? ['glossy', 'glitter', 'clear', 'cloud', 'butter'] : Object.keys(TYPES);
      setRecipe(Curio.pick(pool), Curio.randInt(0, SIMPLE ? 7 : COLORS.length - 1), Object.keys(ADDINS).filter(() => Math.random() < 0.35));
      jarsEl.querySelectorAll('.sl-jar').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      Curio.toast(`🎲 ${COLORS[color][0]} ${TYPES[type].name.toLowerCase()} slime`, 1600);
    }
    document.getElementById('surprise').addEventListener('click', surprise);
    const shop = Curio.store.get('slime:shop', { sold: 0, coins: 0, recipes: {}, i: 0 });
    const WHO = [['🧒', 'Milo, age 8'], ['👵', 'Grandma June'], ['🧑‍🎨', 'An art teacher'], ['🧑‍🚀', 'An astronaut on leave'], ['🐱', 'A very polite cat'], ['🧛', 'A night-shift vampire'], ['👩‍🍳', 'A pastry chef'], ['🤖', 'A curious robot'], ['🧜', 'A mermaid'], ['🦖', 'A small dinosaur']];
    let order = null, kneads = 0;
    function newOrder() {
      const r = (n) => Curio.randInt(0, n - 1);
      const w = WHO[r(WHO.length)];
      const adds = Object.keys(ADDINS).filter(() => Math.random() < 0.3).slice(0, 2);
      order = { face: w[0], who: w[1], type: Curio.pick(Object.keys(TYPES)), color: r(COLORS.length), add: adds, knead: Curio.randInt(4, 12) };
      kneads = 0; paintOrder();
    }
    function paintOrder() {
      if (!order) return;
      document.getElementById('ordFace').textContent = order.face;
      document.getElementById('ordWho').textContent = order.who;
      const addTxt = order.add.length ? ` with ${order.add.map((k) => ADDINS[k].replace(/^\S+\s/, '').toLowerCase()).join(' and ')}` : '';
      document.getElementById('ordWant').textContent = `wants ${COLORS[order.color][0].toLowerCase()} ${TYPES[order.type].name.toLowerCase()} slime${addTxt}, kneaded ${order.knead} times (${Math.min(kneads, order.knead)}/${order.knead}).`;
      document.getElementById('ordStat').textContent = `${shop.sold} sold · ${shop.coins} coins · ${Object.keys(shop.recipes).length} recipes found`;
    }
    function noteRecipe() { const k = `${type}:${color}`; if (!shop.recipes[k]) { shop.recipes[k] = 1; Curio.store.set('slime:shop', shop); paintOrder(); } }
    document.getElementById('sell').addEventListener('click', () => {
      const miss = [];
      if (type !== order.type) miss.push(TYPES[order.type].name.toLowerCase());
      if (color !== order.color) miss.push(COLORS[order.color][0].toLowerCase());
      for (const k of Object.keys(ADDINS)) if (!!addins[k] !== order.add.includes(k)) miss.push(order.add.includes(k) ? `add ${ADDINS[k].replace(/^\S+\s/, '').toLowerCase()}` : `no ${ADDINS[k].replace(/^\S+\s/, '').toLowerCase()}`);
      if (kneads < order.knead) miss.push(`knead ${order.knead - kneads} more`);
      if (miss.length) { Curio.toast(`${order.face} Hmm: ${miss.join(', ')}`); if (navigator.vibrate) navigator.vibrate([20, 40, 20]); return; }
      const pay = 10 + order.add.length * 5 + order.knead;
      shop.sold++; shop.coins += pay; Curio.store.set('slime:shop', shop);
      Curio.confetti(); [523, 784, 1047].forEach((f, i) => setTimeout(() => Curio.beep(f, 0.1, 'triangle', 0.06), i * 80));
      Curio.toast(`${order.face} Perfect! +${pay} coins`);
      if (navigator.vibrate) navigator.vibrate([10, 40, 10, 40, 30]);
      newOrder();
    });
    document.getElementById('nextOrd').addEventListener('click', newOrder);
    stage.addEventListener('pointerdown', () => { kneads++; if (!SIMPLE && order) paintOrder(); });
    document.getElementById('slap').addEventListener('click', () => { kneads++; if (!SIMPLE && order) paintOrder(); });
    document.getElementById('png').addEventListener('click', () => { const a = document.createElement('a'); a.download = `slime-${Date.now()}.png`; a.href = canvas.toDataURL('image/png'); a.click(); Curio.toast('📷 Slime photo saved'); });
    addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey || e.altKey || (e.target.closest && e.target.closest('input,button'))) return;
      const k = e.key.toLowerCase();
      if (k === 'r') surprise();
      else if (k === 'e' && !SIMPLE) document.getElementById('png').click();
      else if (k === ' ') kneads++;
    });
    newOrder(); noteRecipe();
    addEventListener('resize', resize);
    addEventListener('curio:theme', paintBg);
    window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', paintBg);
    resize(); seedParts(); syncUi(); start();
    window.__sl = { poke, slap, pts: () => pts, centroid, grabs };
  })();
  </script>
</body>
