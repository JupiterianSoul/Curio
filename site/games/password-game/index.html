<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Password Game · Curio</title>
  <meta name="description" content="Please choose a password. It must follow 41 rules, including a fire, a fly, a dice roll, Morse code, bubble wrap and an egg called Paul who will hatch if you keep him safe.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="password-game">
  <main class="c-wrap pw-wrap">
    <header class="pw-head">
      <h1 class="c-title">The Password Game</h1>
      <p class="c-sub">Please choose a password. We have a few requirements.</p>
    </header>

    <section class="c-card pw-menu" id="menu">
      <div class="pw-hero-art" id="heroArt" aria-hidden="true"></div>
      <h2 class="pw-h2">Choose your difficulty</h2>
      <div class="pw-modes" id="modes"></div>
      <div class="pw-statsrow" id="statsRow"></div>
      <div class="c-row">
        <button class="c-btn c-btn--ghost" type="button" id="howBtn">❔ How to play</button>
        <button class="c-btn c-btn--ghost" type="button" id="badgeBtn">🏅 Badges and memorial</button>
      </div>
      <div id="menuExtra"></div>
    </section>

    <section id="game" hidden>
      <div class="pw-top">
        <div class="pw-pet" id="pet" aria-live="polite">
          <div class="pw-pet-art" id="petArt"></div>
          <div class="pw-pet-info"><b id="petName">Paul</b><span id="petStatus">Not here yet.</span><div class="pw-hunger" id="hunger" hidden><i id="hungerBar"></i></div></div>
        </div>
        <div class="pw-meta">
          <div class="pw-chip" id="modeChip">Classic</div>
          <div class="pw-chip">⏱ <b id="timer">0:00</b></div>
          <div class="pw-chip">📜 <b id="ruleCount">0</b> rules</div>
        </div>
      </div>
      <div id="confirm"></div>
      <div class="pw-box" id="box">
        <label class="pw-label" for="pw"><span>Your password</span><span class="pw-count" id="count" aria-live="polite">0</span></label>
        <textarea id="pw" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Type something..."></textarea>
        <div class="pw-fly-zone" id="flyZone"></div>
      </div>
      <div class="pw-tray" id="tray" aria-label="Emoji keyboard"></div>
      <div class="pw-progress" aria-hidden="true"><i id="bar"></i></div>
      <div class="rules" id="rules" aria-live="polite"></div>
      <div class="pw-foot c-row">
        <button class="c-btn c-btn--ghost" id="undo" type="button">↶ Undo</button>
        <button class="c-btn c-btn--ghost" id="restart" type="button">Start over</button>
        <button class="c-btn c-btn--ghost" id="quit" type="button">Menu</button>
      </div>
    </section>

    <section class="c-card pw-end" id="end" hidden></section>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
