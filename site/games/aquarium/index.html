<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aquarium · Curio</title>
  <meta name="description" content="Fill your own fish tank with schooling tetras, grumpy pufferfish, swaying plants and a bubbling treasure chest. Feed them, tap the glass, change the light.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <style>
    .c-wrap { padding-top: 10px; padding-bottom: 16px; width: min(100%, 1100px); }
    .aq-head { text-align: center; }
    .aq-head .c-title { margin: 0; font-size: clamp(26px, 4.5vw, 38px); }
    .aq-head .c-sub { margin: 2px 0 10px; font-size: 15px; }
    .aq-stage { position: relative; height: max(360px, calc(100dvh - var(--bar-h) - 270px)); border-radius: 18px; overflow: hidden; background: #0b4f6c; box-shadow: 0 0 0 6px #2b2a33, 0 0 0 8px #44434f, var(--shadow); margin: 8px 8px 0; }
    #cv { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .aq-count { position: absolute; top: 10px; left: 12px; font-size: 12px; font-weight: 800; color: rgba(255,255,255,.85); background: rgba(0,0,0,.22); padding: 3px 10px; border-radius: 999px; pointer-events: none; }
    .aq-tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
    .tab { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 800; font-size: 14px; color: var(--ink-2); touch-action: manipulation; }
    .tab[aria-pressed="true"] { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
    .aq-items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; min-height: 52px; }
    .it { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 3px 6px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 800; color: var(--ink-2); touch-action: manipulation; min-width: 62px; }
    .it canvas { width: 54px; height: 32px; }
    .it[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--ink); }
    .aq-note { font-size: 14px; color: var(--ink-2); font-weight: 700; align-self: center; text-align: center; }
    .aq-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; margin-top: 10px; }
    .aq-row select { padding: 7px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; }
    .aq-row label { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; color: var(--ink-2); font-size: 14px; }
    .aq-row .c-btn { padding: 8px 14px; font-size: 14px; }
    @media (max-width: 560px) {
      .aq-stage { height: max(330px, calc(100dvh - var(--bar-h) - 330px)); margin: 6px 6px 0; }
      .tab { padding: 5px 9px; font-size: 13px; }
      .it { min-width: 56px; }
      .it canvas { width: 46px; height: 28px; }
      .aq-row .c-btn { padding: 8px 11px; font-size: 13px; }
    }
  </style>
</head>
<body data-game="aquarium">
  <main class="c-wrap">
    <div class="aq-head">
      <h1 class="c-title">Aquarium</h1>
      <p class="c-sub">Pick a fish, plant or ornament and click the tank to add it. Then sprinkle some food and watch the feeding frenzy.</p>
    </div>
    <div class="aq-stage" id="stage">
      <canvas id="cv" role="img" aria-label="A fish tank with swimming fish, swaying plants and bubbles. Click to add the selected item. The Remove tab, right-click or long-press removes things."></canvas>
      <div class="aq-count" id="count"></div>
    </div>
    <div class="aq-tabs" id="tabs" role="toolbar" aria-label="What to add">
      <button class="tab" type="button" data-tab="fish" title="Fish (1)">🐟 Fish</button>
      <button class="tab" type="button" data-tab="plant" title="Plants (2)">🌿 Plants</button>
      <button class="tab" type="button" data-tab="decor" title="Decor (3)">🪨 Decor</button>
      <button class="tab" type="button" data-tab="feed" title="Feed (4)">🍤 Feed</button>
      <button class="tab" type="button" data-tab="tap" title="Tap glass (5)">👆 Tap glass</button>
      <button class="tab" type="button" data-tab="remove" title="Remove (X)">🧽 Remove</button>
    </div>
    <div class="aq-items" id="items"></div>
    <div class="aq-row">
      <label>Light <select id="light" aria-label="Lighting"></select></label>
      <button class="c-btn c-btn--ghost" type="button" id="undo" aria-label="Undo">↶ Undo</button>
      <button class="c-btn c-btn--ghost" type="button" id="empty">🫧 Empty tank</button>
      <button class="c-btn" type="button" id="png">📷 Save PNG</button>
    </div>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script>
  (() => {
    const cv = document.getElementById('cv'), g = cv.getContext('2d');
    const stage = document.getElementById('stage');
    const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
    let W = 0, Hc = 0, dpr = 1, t = 0, sandTop = 0, FS = 1;
    const R = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const LIGHTS = {
      day: { name: 'Sunny day', top: '#5fd0e6', bot: '#0d6e96', ray: 'rgba(255,255,230,', rayA: 0.13, sand: ['#f0d9a4', '#d9b97a'], shade: null, glow: 0.2 },
      tropic: { name: 'Tropical', top: '#62e6d0', bot: '#0a7f8a', ray: 'rgba(255,255,210,', rayA: 0.16, sand: ['#f6e6bb', '#e2c88b'], shade: null, glow: 0.2 },
      sunset: { name: 'Sunset', top: '#ff9e73', bot: '#3d2d6e', ray: 'rgba(255,200,150,', rayA: 0.15, sand: ['#e8b98e', '#a77b6a'], shade: 'rgba(80,30,60,.12)', glow: 0.4 },
      deep: { name: 'Deep blue', top: '#1d6fa6', bot: '#061d3d', ray: 'rgba(170,220,255,', rayA: 0.08, sand: ['#a6a08a', '#6b6a5f'], shade: 'rgba(0,10,40,.2)', glow: 0.7 },
      night: { name: 'Moonlight', top: '#16325c', bot: '#040a1c', ray: 'rgba(190,210,255,', rayA: 0.06, sand: ['#59607a', '#353a52'], shade: 'rgba(0,5,30,.38)', glow: 1 }
    };
    let light = 'day';

    const SPECIES = [
      { id: 'clown', name: 'Clownfish', L: 34, h: 0.5, body: '#ff7a1a', belly: '#ffa45c', fin: '#ff8d2e', edge: '#1b1b1b', tail: 'round', stripes: [[0.26, 0.09], [0.0, 0.1], [-0.3, 0.06]], stripeCol: '#ffffff', spd: 50, mode: 'hover', zone: [0.45, 0.85] },
      { id: 'neon', name: 'Neon tetra', L: 20, h: 0.32, body: '#b8c6d8', belly: '#e9eef5', fin: 'rgba(220,230,240,.6)', tail: 'fork', neon: true, spd: 85, mode: 'school', school: 1, zone: [0.2, 0.7] },
      { id: 'angel', name: 'Angelfish', L: 40, h: 0.62, body: '#d9c98e', belly: '#f7f1dc', fin: 'rgba(225,212,160,.85)', tail: 'fan', angel: true, spd: 34, mode: 'glide', zone: [0.2, 0.7] },
      { id: 'tang', name: 'Blue tang', L: 42, h: 0.56, body: '#2f6fe0', belly: '#4f8cf0', fin: '#1d4fb8', tail: 'fork', tailCol: '#ffd43b', tang: true, spd: 95, mode: 'dart', zone: [0.15, 0.75] },
      { id: 'gold', name: 'Goldfish', L: 38, h: 0.52, body: '#ff9c1a', belly: '#ffd27a', fin: 'rgba(255,160,60,.75)', tail: 'flow', spd: 42, mode: 'wander', zone: [0.15, 0.8] },
      { id: 'puffer', name: 'Pufferfish', L: 36, h: 0.72, body: '#d9b25c', belly: '#f6ecc8', fin: 'rgba(220,190,110,.8)', tail: 'round', puffer: true, spd: 26, mode: 'wander', zone: [0.3, 0.85] },
      { id: 'betta', name: 'Betta', L: 36, h: 0.42, body: '#7b2cbf', belly: '#c0392b', fin: 'rgba(170,40,120,.8)', tail: 'flow', betta: true, spd: 30, mode: 'glide', zone: [0.1, 0.5] },
      { id: 'seahorse', name: 'Seahorse', L: 34, special: 'seahorse', body: '#f2a541', spd: 14, mode: 'bob', zone: [0.35, 0.85] },
      { id: 'jelly', name: 'Jellyfish', L: 40, special: 'jelly', body: 'rgba(255,160,210,', spd: 18, mode: 'pulse', zone: [0.1, 0.75] },
      { id: 'pleco', name: 'Catfish', L: 50, h: 0.3, body: '#6b5a45', belly: '#9b8a70', fin: '#5a4a38', tail: 'fork', spots: '#3b3025', whiskers: true, spd: 22, mode: 'bottom', zone: [0.95, 1] },
      { id: 'guppy', name: 'Guppy', L: 22, h: 0.36, body: '#9fb6a8', belly: '#dfe8e0', fin: 'rgba(255,120,80,.85)', tail: 'flow', rainbow: true, spd: 60, mode: 'school', school: 0.5, zone: [0.1, 0.6] },
      { id: 'danio', name: 'Zebra danio', L: 22, h: 0.26, body: '#e7e0c8', belly: '#f5f2e6', fin: 'rgba(230,225,200,.6)', tail: 'fork', hstripes: '#2f4b8f', spd: 110, mode: 'school', school: 1, zone: [0.1, 0.5] },
      { id: 'shark', name: 'Tiny shark', L: 64, h: 0.26, body: '#7f93a3', belly: '#e8edf0', fin: '#6d8191', tail: 'shark', shark: true, spd: 70, mode: 'patrol', zone: [0.25, 0.75] }
    ];
    const SP = Object.fromEntries(SPECIES.map((s) => [s.id, s]));
    const PLANTS = [
      { id: 'weed', name: 'Seaweed' }, { id: 'kelp', name: 'Kelp' }, { id: 'grass', name: 'Grass' }, { id: 'coral', name: 'Coral' }, { id: 'anemone', name: 'Anemone' }
    ];
    const DECOR = [{ id: 'rock', name: 'Rock' }, { id: 'chest', name: 'Treasure' }, { id: 'bubbler', name: 'Bubbler' }, { id: 'castle', name: 'Castle' }, { id: 'shell', name: 'Shell' }];

    let fish = [], plants = [], decor = [], bubbles = [], flakes = [], ripples = [];
    let tab = 'fish', sel = { fish: 'clown', plant: 'weed', decor: 'rock' };
    let undo = [], fed = 0;
    const schoolTarget = {};

    function bodyPath(c, L, Hh) {
      c.beginPath(); c.moveTo(L * 0.5, 0);
      c.bezierCurveTo(L * 0.42, -Hh * 0.62, -L * 0.12, -Hh * 0.62, -L * 0.42, -Hh * 0.13);
      c.lineTo(-L * 0.42, Hh * 0.13);
      c.bezierCurveTo(-L * 0.12, Hh * 0.62, L * 0.42, Hh * 0.62, L * 0.5, 0);
      c.closePath();
    }
    function drawTail(c, s, L, Hh, w) {
      c.save(); c.translate(-L * 0.4, 0); c.rotate(w);
      c.fillStyle = s.tailCol || s.fin;
      c.beginPath();
      if (s.tail === 'fork') { c.moveTo(0, 0); c.lineTo(-L * 0.24, -Hh * 0.42); c.quadraticCurveTo(-L * 0.12, 0, -L * 0.24, Hh * 0.42); c.closePath(); }
      else if (s.tail === 'round') { c.moveTo(0, -Hh * 0.08); c.quadraticCurveTo(-L * 0.28, -Hh * 0.45, -L * 0.24, 0); c.quadraticCurveTo(-L * 0.28, Hh * 0.45, 0, Hh * 0.08); c.closePath(); }
      else if (s.tail === 'fan') { c.moveTo(0, 0); c.lineTo(-L * 0.26, -Hh * 0.3); c.lineTo(-L * 0.26, Hh * 0.3); c.closePath(); }
      else if (s.tail === 'shark') { c.moveTo(0, 0); c.quadraticCurveTo(-L * 0.12, -Hh * 0.3, -L * 0.22, -Hh * 0.75); c.quadraticCurveTo(-L * 0.12, 0, -L * 0.16, Hh * 0.4); c.closePath(); }
      else {
        const w2 = Math.sin(t * 5 + L) * 0.15;
        c.moveTo(0, -Hh * 0.05);
        c.bezierCurveTo(-L * 0.2, -Hh * 0.7, -L * 0.55, -Hh * (0.8 + w2), -L * 0.62, -Hh * 0.2);
        c.quadraticCurveTo(-L * 0.45, 0, -L * 0.62, Hh * (0.25 - w2));
        c.bezierCurveTo(-L * 0.55, Hh * 0.85, -L * 0.2, Hh * 0.7, 0, Hh * 0.05);
        c.closePath();
      }
      c.fill();
      if (s.rainbow) {
        const gr = c.createLinearGradient(0, -Hh, -L * 0.6, Hh);
        gr.addColorStop(0, 'rgba(255,90,120,.85)'); gr.addColorStop(0.5, 'rgba(255,200,60,.85)'); gr.addColorStop(1, 'rgba(80,160,255,.85)');
        c.fillStyle = gr; c.fill();
      }
      c.restore();
    }
    function drawGeneric(c, s, L, ph, puff = 0) {
      let Hh = L * s.h;
      if (s.puffer) Hh *= 1 + puff * 0.55;
      const w = Math.sin(ph) * (s.tail === 'flow' ? 0.2 : 0.32);
      if (s.angel || s.betta) {
        c.fillStyle = s.fin;
        c.beginPath(); c.moveTo(L * 0.18, -Hh * 0.42);
        c.quadraticCurveTo(-L * 0.1, -Hh * (s.angel ? 1.5 : 1.0), -L * (s.angel ? 0.42 : 0.5), -Hh * (s.angel ? 1.25 : 0.75) + Math.sin(ph * 0.5) * 2);
        c.quadraticCurveTo(-L * 0.25, -Hh * 0.3, -L * 0.32, -Hh * 0.2); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(L * 0.18, Hh * 0.42);
        c.quadraticCurveTo(-L * 0.1, Hh * (s.angel ? 1.5 : 1.0), -L * (s.angel ? 0.42 : 0.5), Hh * (s.angel ? 1.25 : 0.75) - Math.sin(ph * 0.5) * 2);
        c.quadraticCurveTo(-L * 0.25, Hh * 0.3, -L * 0.32, Hh * 0.2); c.closePath(); c.fill();
      }
      drawTail(c, s, L, Hh, w);
      if (!s.angel && !s.betta) {
        c.fillStyle = s.fin;
        c.beginPath();
        if (s.shark) { c.moveTo(L * 0.12, -Hh * 0.42); c.quadraticCurveTo(-L * 0.02, -Hh * 1.25, -L * 0.1, -Hh * 1.3); c.quadraticCurveTo(-L * 0.06, -Hh * 0.7, -L * 0.14, -Hh * 0.38); }
        else { c.moveTo(L * 0.16, -Hh * 0.44); c.quadraticCurveTo(-L * 0.05, -Hh * 0.95, -L * 0.3, -Hh * 0.3); }
        c.closePath(); c.fill();
      }
      bodyPath(c, L, Hh);
      const gr = c.createLinearGradient(0, -Hh / 2, 0, Hh / 2);
      gr.addColorStop(0, s.body); gr.addColorStop(1, s.belly);
      c.fillStyle = gr; c.fill();
      c.save(); bodyPath(c, L, Hh); c.clip();
      if (s.stripes) {
        for (const [x, wdt] of s.stripes) {
          c.fillStyle = s.edge; c.fillRect(L * x - L * wdt / 2 - L * 0.025, -Hh, L * wdt + L * 0.05, Hh * 2);
          c.fillStyle = s.stripeCol; c.fillRect(L * x - L * wdt / 2, -Hh, L * wdt, Hh * 2);
        }
      }
      if (s.neon) {
        c.fillStyle = '#26c6f0'; c.fillRect(-L * 0.42, -Hh * 0.18, L * 0.85, Hh * 0.2);
        c.fillStyle = 'rgba(120,240,255,.6)'; c.fillRect(-L * 0.42, -Hh * 0.14, L * 0.85, Hh * 0.07);
        c.fillStyle = '#e8304a'; c.fillRect(-L * 0.42, Hh * 0.04, L * 0.5, Hh * 0.4);
      }
      if (s.hstripes) { c.fillStyle = s.hstripes; for (const y of [-0.18, 0.02, 0.2]) c.fillRect(-L * 0.45, Hh * y, L * 0.85, Hh * 0.09); }
      if (s.tang) {
        c.fillStyle = '#10204a';
        c.beginPath(); c.moveTo(L * 0.3, -Hh * 0.28); c.quadraticCurveTo(0, -Hh * 0.05, -L * 0.36, -Hh * 0.3); c.quadraticCurveTo(-L * 0.1, Hh * 0.25, L * 0.12, -Hh * 0.08); c.quadraticCurveTo(L * 0.2, -Hh * 0.2, L * 0.3, -Hh * 0.28); c.fill();
      }
      if (s.angel) { c.fillStyle = 'rgba(40,40,40,.75)'; for (const x of [0.22, 0.0, -0.22]) c.fillRect(L * x - L * 0.03, -Hh, L * 0.06, Hh * 2); }
      if (s.betta) { const g2 = c.createLinearGradient(L * 0.4, 0, -L * 0.4, 0); g2.addColorStop(0, 'rgba(60,40,160,.0)'); g2.addColorStop(1, 'rgba(200,40,100,.6)'); c.fillStyle = g2; c.fillRect(-L, -Hh, 2 * L, 2 * Hh); }
      if (s.spots) { c.fillStyle = s.spots; for (let i = 0; i < 9; i++) { c.beginPath(); c.arc(L * (0.3 - i * 0.08), Hh * (((i * 37) % 7) / 7 - 0.5) * 0.7, L * 0.022, 0, 7); c.fill(); } }
      if (s.puffer) { c.fillStyle = 'rgba(90,70,30,.55)'; for (let i = 0; i < 12; i++) { c.beginPath(); c.arc(L * (0.28 - (i % 4) * 0.15), Hh * (-0.32 + Math.floor(i / 4) * 0.16), L * 0.025, 0, 7); c.fill(); } }
      if (s.shark) { c.fillStyle = 'rgba(255,255,255,.25)'; c.fillRect(-L, Hh * 0.05, 2 * L, Hh); }
      c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(L * 0.1, -Hh * 0.22, L * 0.28, Hh * 0.1, -0.05, 0, 7); c.fill();
      c.restore();
      if (s.puffer && puff > 0.05) {
        c.strokeStyle = 'rgba(120,90,40,.8)'; c.lineWidth = 1.2;
        for (let i = 0; i < 16; i++) {
          const a = i / 16 * Math.PI * 2, rx = L * 0.46, ry = Hh * 0.5;
          const x0 = Math.cos(a) * rx * 0.95, y0 = Math.sin(a) * ry * 0.95;
          c.beginPath(); c.moveTo(x0, y0); c.lineTo(x0 + Math.cos(a) * 5 * puff, y0 + Math.sin(a) * 5 * puff); c.stroke();
        }
      }
      if (s.whiskers) {
        c.strokeStyle = s.belly; c.lineWidth = 1;
        c.beginPath(); c.moveTo(L * 0.46, Hh * 0.1); c.quadraticCurveTo(L * 0.6, Hh * 0.3, L * 0.62, Hh * 0.55 + Math.sin(ph) * 2);
        c.moveTo(L * 0.46, Hh * 0.12); c.quadraticCurveTo(L * 0.55, Hh * 0.4, L * 0.5, Hh * 0.7 + Math.cos(ph) * 2); c.stroke();
      }
      c.fillStyle = s.fin;
      c.save(); c.translate(L * 0.12, Hh * 0.12); c.rotate(0.5 + Math.sin(ph * 1.3) * 0.35);
      c.beginPath(); c.ellipse(-L * 0.06, 0, L * 0.09, Hh * 0.09, 0, 0, 7); c.fill(); c.restore();
      const er = Math.max(1.6, Hh * (s.puffer ? 0.12 : 0.11));
      const ex = L * (s.puffer ? 0.3 : 0.33), ey = -Hh * 0.1;
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex, ey, er, 0, 7); c.fill();
      c.fillStyle = '#111'; c.beginPath(); c.arc(ex + er * 0.2, ey, er * 0.62, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + er * 0.35, ey - er * 0.3, er * 0.22, 0, 7); c.fill();
    }
    function drawSeahorse(c, s, L, ph) {
      const u = L / 34;
      c.save(); c.scale(u, u);
      c.strokeStyle = '#d88a2a'; c.lineWidth = 5; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-2, 12); c.quadraticCurveTo(4, 22, -2, 26); c.quadraticCurveTo(-8, 28, -6, 22); c.stroke();
      c.fillStyle = s.body;
      c.beginPath(); c.moveTo(2, -16); c.quadraticCurveTo(10, -10, 7, 0); c.quadraticCurveTo(5, 10, -1, 14); c.quadraticCurveTo(-7, 8, -5, -2); c.quadraticCurveTo(-6, -10, -2, -14); c.closePath(); c.fill();
      c.beginPath(); c.ellipse(2, -17, 6, 5, -0.2, 0, 7); c.fill();
      c.beginPath(); c.moveTo(5, -19); c.lineTo(15, -16); c.lineTo(15, -12); c.lineTo(5, -14); c.closePath(); c.fill();
      c.fillStyle = 'rgba(255,220,140,.9)';
      c.save(); c.translate(-5, -2); c.rotate(Math.sin(ph * 2) * 0.4); c.beginPath(); c.ellipse(-3, 0, 4, 2.5, 0, 0, 7); c.fill(); c.restore();
      c.strokeStyle = 'rgba(160,90,20,.5)'; c.lineWidth = 1;
      for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(-4 + i * 0.3, -8 + i * 4); c.lineTo(6 - i * 0.6, -8 + i * 4); c.stroke(); }
      c.fillStyle = '#d88a2a'; c.beginPath(); c.moveTo(-2, -21); c.lineTo(0, -26); c.lineTo(3, -21); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(4, -18, 2.2, 0, 7); c.fill();
      c.fillStyle = '#111'; c.beginPath(); c.arc(4.6, -18, 1.3, 0, 7); c.fill();
      c.restore();
    }
    function drawJelly(c, s, L, ph, pulse, glow) {
      const u = L / 40, sq = 1 - pulse * 0.25;
      c.save(); c.scale(u, u);
      if (glow > 0.3) { const gg = c.createRadialGradient(0, 0, 2, 0, 0, 40); gg.addColorStop(0, `rgba(255,140,220,${0.35 * glow})`); gg.addColorStop(1, 'rgba(255,140,220,0)'); c.fillStyle = gg; c.beginPath(); c.arc(0, 0, 40, 0, 7); c.fill(); }

    function stepBubbles(dt) {
      for (const d of decor) {
        d.grow = (d.grow || 0) + dt * 2;

            d.ct = R(6, 10); d.opening = 2.4;
            for (let i = 0; i < 16; i++) setTimeout(() => bubbles.push({ x: d.x + R(-16, 16) * d.s, y: sandY(d.x) - 26 * d.s, r: R(2, 6), vy: R(40, 90), ph: R(0, 6) }), i * 60);
            [520, 660, 780].forEach((fq, i) => setTimeout(() => bubbleSound(fq), 150 + i * 120));

        const f = flakes[i];

    function render() {
      const L = LIGHTS[light];
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.drawImage(bg, 0, 0);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 6; i++) {
        const x = W * (i / 5) + Math.sin(t * 0.25 + i * 1.3) * 40;
        const a = L.rayA * (0.5 + 0.5 * Math.sin(t * 0.6 + i * 2));
        const gr = g.createLinearGradient(0, 0, 0, Hc * 0.9);
        gr.addColorStop(0, L.ray + a + ')'); gr.addColorStop(1, L.ray + '0)');
        g.fillStyle = gr;
        g.beginPath(); g.moveTo(x - 20, 0); g.lineTo(x + 30, 0); g.lineTo(x + 30 + Hc * 0.35 + 50, Hc * 0.9); g.lineTo(x - 20 + Hc * 0.35 - 30, Hc * 0.9); g.closePath(); g.fill();

        g.beginPath(); g.ellipse(x, y, 16 + Math.sin(t + i) * 5, 3, 0, 0, 7); g.fill();
      }
      for (const p of plants) if (!p.front) drawPlant(g, p, t);
      for (const d of decor) drawDecor(g, d);
      const order = fish.slice().sort((a, b) => (SP[a.sp].special === 'jelly') - (SP[b.sp].special === 'jelly') || a.size * SP[a.sp].L - b.size * SP[b.sp].L);
      for (const f of order) drawFish(f);
      for (const p of plants) if (p.front) drawPlant(g, p, t);
      for (const f of flakes) {
        g.save(); g.translate(f.x, f.y); g.rotate(f.rot); g.fillStyle = f.c; g.globalAlpha = Math.min(1, f.life / 2);
        g.fillRect(-2.5, -1.5, 5, 3); g.restore();
      }
      g.globalAlpha = 1;
      for (const b of bubbles) {
        g.strokeStyle = 'rgba(255,255,255,.65)'; g.lineWidth = 1;
        g.fillStyle = 'rgba(255,255,255,.12)';
        g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); g.stroke();
        g.fillStyle = 'rgba(255,255,255,.75)'; g.beginPath(); g.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.28, 0, 7); g.fill();
      }
      const sy = Hc * 0.06;
      g.fillStyle = 'rgba(255,255,255,.14)';
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, sy);
      for (let x = 0; x <= W; x += 12) g.lineTo(x, sy + Math.sin(x * 0.03 + t * 1.6) * 2.5 + Math.sin(x * 0.011 - t) * 2);
      g.lineTo(W, 0); g.closePath(); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = 1.5;
      g.beginPath();
      for (let x = 0; x <= W; x += 12) g.lineTo(x, sy + Math.sin(x * 0.03 + t * 1.6) * 2.5 + Math.sin(x * 0.011 - t) * 2);
      g.stroke();
      for (const r of ripples) { g.strokeStyle = `rgba(255,255,255,${r.a})`; g.lineWidth = 2; g.beginPath(); g.arc(r.x, r.y, r.r, 0, 7); g.stroke(); }
      if (L.shade) { g.fillStyle = L.shade; g.fillRect(0, 0, W, Hc); }
      if (L.glow > 0.5) {
        g.globalCompositeOperation = 'lighter';
        for (const f of fish) if (SP[f.sp].special === 'jelly' || SP[f.sp].neon) {
          const rr = SP[f.sp].special === 'jelly' ? 34 : 14;
          const gg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, rr);
          gg.addColorStop(0, SP[f.sp].neon ? 'rgba(60,200,255,.35)' : 'rgba(255,120,210,.3)'); gg.addColorStop(1, 'rgba(0,0,0,0)');

    function tone(f, d = 0.15, type = 'sine', v = 0.06, slide = 0) {

        d: decor.map((d) => [d.type, Math.round(d.x / W * 1000), +d.s.toFixed(2), d.v]),

    }
    function unserial(o, instant = true) {

    let saveT = 0;

    const countEl = document.getElementById('count');
    function updateCount() {
      const sp = new Set(fish.map((f) => f.sp)).size;
      countEl.textContent = fish.length ? `${fish.length} ${fish.length === 1 ? 'creature' : 'creatures'} · ${sp} ${sp === 1 ? 'species' : 'species'}` : 'An empty tank. Add some fish!';
    }

    function addAt(x, y) {
      if (tab === 'fish') {
        if (fish.length >= 70) { Curio.toast('The tank is full. Fish need elbow room!'); return; }
        snapshot();
        const s = SP[sel.fish];
        const n = s.school ? 5 : 1;
        for (let i = 0; i < n; i++) fish.push(newFish(sel.fish, clamp(x + R(-20, 20) * (n > 1), 20, W - 20), clamp(s.mode === 'bottom' ? sandY(x) - 10 : y + R(-15, 15) * (n > 1), Hc * 0.1, sandY(x) - 10)));
        for (let i = 0; i < 8; i++) bubbles.push({ x: x + R(-10, 10), y: y + R(-6, 6), r: R(1.5, 4), vy: R(40, 90), ph: R(0, 6) });
        tone(420, 0.1, 'sine', 0.06, 1.8); setTimeout(() => bubbleSound(700), 80);
        if (n > 1) Curio.toast(`A little school of ${s.name.toLowerCase()}s`);
      } else if (tab === 'plant') {
        snapshot();
        plants.push({ type: sel.plant, x, h: R(0.5, 0.8) * (sandTop) * (sel.plant === 'kelp' ? 1.1 : sel.plant === 'grass' ? 0.6 : 0.75), v: Curio.randInt(0, 3), front: Math.random() < 0.3, ph: R(0, 6), grow: 0 });
        tone(330, 0.3, 'triangle', 0.05, 1.5);
      } else if (tab === 'decor') {
        snapshot();
        decor.push({ type: sel.decor, x, s: R(0.85, 1.2) * Math.min(1.2, Math.max(0.7, W / 900)), v: Curio.randInt(0, 2), grow: 0 });
        tone(180, 0.2, 'sine', 0.1); setTimeout(() => bubbleSound(500), 120);
        for (let i = 0; i < 6; i++) bubbles.push({ x: x + R(-14, 14), y: sandY(x) - 6, r: R(1.5, 3.5), vy: R(40, 70), ph: R(0, 6) });
      } else if (tab === 'feed') {
        const cols = ['#e2683c', '#f2b134', '#c94f3d', '#7a9a3a', '#e8c070'];
        for (let i = 0; i < 9; i++) flakes.push({ x: clamp(x + R(-24, 24), 10, W - 10), y: Hc * 0.065 + R(-3, 3), vy: R(16, 30), ph: R(0, 6), rot: R(0, 6), vr: R(-2, 2), c: Curio.pick(cols), life: 6 });
        for (let i = 0; i < 3; i++) ripples.push({ x: x + R(-14, 14), y: Hc * 0.06, r: 2, a: 0.6, s: 26 });

    function tapGlass(x, y) {

        f.tt = 0;

    }
    function removeAt(x, y) {

      if (!best) {

      }
      if (!best) return;
      snapshot();

      for (let i = 0; i < 8; i++) bubbles.push({ x: x + R(-10, 10), y: y + R(-10, 10), r: R(1.5, 4), vy: R(50, 100), ph: R(0, 6) });
      tone(500, 0.15, 'sine', 0.05, 0.5);
      updateCount(); save();
    }

    const tabsEl = document.getElementById('tabs'), itemsEl = document.getElementById('items');
    function iconFor(kind, id) {

      const x = c.getContext('2d'); x.scale(2, 2);

        const s = SP[id];
        const L = s.special ? 24 : Math.min(40, 46 / (s.tail === 'flow' ? 1.25 : 1.05));
        if (s.special === 'seahorse') { x.scale(0.75, 0.75); x.translate(-2, 2); }
        if (s.special === 'jelly') { x.translate(0, -4); }

      } else if (kind === 'plant') {

    const feedNote = () => `${Curio.touchpad ? 'Click to start sprinkling, move around, click again to stop.' : 'Click or drag to sprinkle flakes.'} ${fed ? fed + (fed === 1 ? ' flake' : ' flakes') + ' gobbled so far.' : 'Everyone is peckish.'}`;
    function paintTabs() {

      itemsEl.innerHTML = '';
      const list = tab === 'fish' ? SPECIES : tab === 'plant' ? PLANTS : tab === 'decor' ? DECOR : null;
      if (!list) {
        const p = document.createElement('div'); p.className = 'aq-note';
        p.textContent = tab === 'feed' ? feedNote() : tab === 'remove' ? 'Click a fish, plant or ornament to scoop it out. Undo puts it back.' : 'Click the glass to give everyone a fright. The pufferfish takes it personally.';

    function setTab(id) { tab = id; paintTabs(); tone(520, 0.06); save(); }

    const lightSel = document.getElementById('light');

    lightSel.addEventListener('change', () => { light = lightSel.value; bakeBg(); save(); tone(440, 0.3, 'sine', 0.05, 1.5); });
    function doUndo() { if (!undo.length) { Curio.toast('Nothing to undo'); return; } unserial(JSON.parse(undo.pop())); updateCount(); save(); tone(330, 0.1); }

    document.getElementById('empty').addEventListener('click', () => {

    document.getElementById('png').addEventListener('click', () => {

    const TABKEYS = { 1: 'fish', 2: 'plant', 3: 'decor', 4: 'feed', 5: 'tap', 6: 'remove', x: 'remove' };

    const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    let pressT = 0, downP = null, longDone = false, feeding = false, feedT = 0;

    });
    cv.addEventListener('pointercancel', () => { clearTimeout(pressT); downP = null; });
    addEventListener('curio:touchpad', (e) => { if (e.detail) Curio.toast('Touchpad mode: in Feed, click to start sprinkling and click again to stop. Remove tab (X) takes things out', 3800); if (tab === 'feed') paintTabs(); });
    if (!Curio.touchpad && !Curio.store.get('tp-hint-aquarium', false) && matchMedia('(pointer: fine)').matches) { Curio.store.set('tp-hint-aquarium', true); setTimeout(() => Curio.toast('Tip: on a laptop touchpad, turn on Touchpad mode in the top bar: click to start sprinkling food, click again to stop', 4200), 1800); }

    let last = performance.now(), raf = 0;
    function frame(now) {
      raf = 0;
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; t += dt;
      for (const id in schoolTarget) {
        const st = schoolTarget[id]; st.t -= dt;
        if (st.t <= 0) { st.t = R(3, 6); st.x = R(W * 0.12, W * 0.88); st.y = zoneY(SP[id], R(0, 1)); }
      }
      for (const p of plants) p.grow = Math.min(1, (p.grow || 0) + dt * 1.6);
      for (const f of fish) stepFish(f, dt);
      stepBubbles(dt);
      render();
      if (!document.hidden) raf = requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); } });
    addEventListener('resize', resize);

    resize();
    const saved = Curio.store.get('aquarium', null);
    if (saved && Array.isArray(saved.f)) {
      light = LIGHTS[saved.l] ? saved.l : 'day';
      if (saved.sel) Object.assign(sel, saved.sel);
      if (['fish', 'plant', 'decor', 'feed', 'tap', 'remove'].includes(saved.tab)) tab = saved.tab;
      unserial(saved);
    } else {
      unserial({
        f: [['clown', 300, 650, 1], ['clown', 340, 690, 0.9], ['neon', 600, 300, 1], ['neon', 620, 320, 0.9], ['neon', 640, 290, 1.1], ['neon', 610, 340, 1], ['neon', 650, 310, 0.95], ['neon', 590, 280, 1],
          ['angel', 450, 400, 1.1], ['gold', 750, 500, 1], ['puffer', 200, 500, 1], ['tang', 800, 250, 1], ['seahorse', 120, 600, 1], ['jelly', 880, 200, 1], ['pleco', 500, 900, 1]],
        p: [['weed', 90, 280, 0, 0], ['kelp', 160, 380, 1, 0], ['anemone', 300, 90, 0, 0], ['grass', 560, 160, 2, 1], ['coral', 680, 260, 0, 0], ['weed', 930, 300, 3, 1], ['grass', 980, 140, 0, 0]],
        d: [['rock', 420, 1.1, 0], ['chest', 780, 1, 0], ['bubbler', 870, 1, 0], ['shell', 250, 1, 0]]
      });
      for (const p of plants) p.h = p.h / 380 * sandTop * 0.9;
    }
    lightSel.value = light;
    paintTabs(); updateCount(); bakeBg();
    raf = requestAnimationFrame(frame);
  })();
  </script>
</body>
