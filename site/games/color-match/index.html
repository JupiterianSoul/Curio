<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Color Match · Curio</title>
  <meta name="description" content="See a colour, then rebuild it from memory. Classic rounds, today's daily colours, a palette memory test and a name-to-colour challenge, all scored with CIEDE2000.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="fx.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="color-match">
  <main class="c-wrap cm">
    <header>
      <h1 class="c-title">Color Match</h1>
      <p class="c-sub">Humans are famously bad at remembering colours. Look closely, then rebuild what you saw.</p>
    </header>
    <div class="cm-bar" id="bar">
      <div class="cm-opt"><span>Mode</span><div id="oMode"></div></div>
      <div class="cm-opt" id="viewOpt"><span>Look time</span><div id="oView"></div></div>
    </div>
    <div class="cm-hud">
      <div class="c-stat"><b id="round">-</b><span>Round</span></div>
      <div class="c-stat"><b id="total">0</b><span>Score</span></div>
      <div class="c-stat"><b id="best">-</b><span>Best</span></div>
    </div>
    <section class="cm-stage" id="stage" aria-live="polite"></section>
    <div id="tabs"></div>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="fx.js"></script>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
