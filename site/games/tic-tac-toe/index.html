<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tic Tac Toe · Zoble</title>
  <meta name="description" content="Tic Tac Toe four ways: classic, misère, 4x4 and Ultimate, against three animated opponents or a friend, with piece skins and trophies.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="tic-tac-toe">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="tg-gold" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff3a8"/><stop offset=".5" stop-color="#ffc83d"/><stop offset="1" stop-color="#f08a00"/></radialGradient>
      <radialGradient id="tg-planet" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#c6a8ff"/><stop offset=".55" stop-color="#7c4dff"/><stop offset="1" stop-color="#3b1f8f"/></radialGradient>
      <radialGradient id="tg-berry" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ff8a80"/><stop offset=".6" stop-color="#e53935"/><stop offset="1" stop-color="#a51d1d"/></radialGradient>
      <radialGradient id="tg-orange" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffe0a3"/><stop offset=".7" stop-color="#ffab2e"/><stop offset="1" stop-color="#f57c00"/></radialGradient>
      <radialGradient id="tg-slime" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#b9f6a8"/><stop offset=".6" stop-color="#4caf50"/><stop offset="1" stop-color="#1b7a2a"/></radialGradient>
      <radialGradient id="tg-monster" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#e1b3ff"/><stop offset=".6" stop-color="#9c4dcc"/><stop offset="1" stop-color="#5e1f8a"/></radialGradient>
      <linearGradient id="tg-metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd8e3"/><stop offset="1" stop-color="#7d8ea3"/></linearGradient>
    </defs>
  </svg>
  <div class="tt-sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <main class="c-wrap tt">
    <section id="menu" class="tt-menu">
      <header class="tt-hero">
        <div class="tt-cast" id="cast" aria-hidden="true"></div>
        <h1 class="c-title">Tic Tac Toe</h1>
        <p class="c-sub">Four ways to play the oldest game on the napkin. Pick a board, pick a rival, pick your pieces.</p>
      </header>
      <h2 class="tt-h">1. Board</h2>
      <div class="tt-modes" id="modes" role="radiogroup" aria-label="Board"></div>
      <h2 class="tt-h">2. Opponent</h2>
      <div class="tt-opps" id="opps" role="radiogroup" aria-label="Opponent"></div>
      <h2 class="tt-h">3. Pieces</h2>
      <div class="tt-skins" id="skins" role="radiogroup" aria-label="Pieces"></div>
      <div class="tt-go">
        <button class="c-btn tt-play" id="playBtn" type="button">Play</button>
      </div>
      <div class="c-row tt-links">
        <button class="c-btn c-btn--ghost" id="howBtn" type="button">📖 How to play</button>
        <button class="c-btn c-btn--ghost" id="trophyBtn" type="button">🏆 Trophies <span id="trophyCount"></span></button>
        <button class="c-btn c-btn--ghost" id="statsBtn" type="button">📊 Stats</button>
      </div>
    </section>

    <section id="game" class="tt-game" hidden>
      <div class="tt-top">
        <div class="tt-player" id="pX">
          <div class="tt-face" id="faceX"></div>
          <div class="tt-pinfo"><b id="nameX">You</b><span id="scoreX">0</span></div>
        </div>
        <div class="tt-mid">
          <div class="tt-modechip" id="modeChip"></div>
          <div class="tt-draws"><b id="scoreD">0</b><span>draws</span></div>
        </div>
        <div class="tt-player tt-player--o" id="pO">
          <div class="tt-pinfo"><b id="nameO">Hoot</b><span id="scoreO">0</span></div>
          <div class="tt-face" id="faceO"></div>
          <div class="tt-bubble" id="bubble" aria-live="polite"></div>
        </div>
      </div>
      <p class="tt-status" id="status" aria-live="polite"></p>
      <div class="tt-stage" id="stage">
        <div class="tt-board" id="board" role="grid" aria-label="Board"></div>
        <div class="tt-result" id="result" hidden></div>
      </div>
      <div class="tt-tools">
        <button class="tt-tool" id="undoBtn" type="button"><i>↶</i>Undo</button>
        <button class="tt-tool" id="hintBtn" type="button"><i>💡</i>Hint</button>
        <button class="tt-tool" id="newBtn" type="button"><i>↻</i>Restart</button>
        <button class="tt-tool" id="ruleBtn" type="button"><i>📖</i>Rules</button>
        <button class="tt-tool" id="menuBtn" type="button"><i>☰</i>Menu</button>
      </div>
      <p class="c-muted tt-keys">Keys: <span class="c-kbd">1</span>-<span class="c-kbd">9</span> on the classic boards, arrows plus <span class="c-kbd">Enter</span> anywhere, <span class="c-kbd">U</span> undo, <span class="c-kbd">H</span> hint, <span class="c-kbd">N</span> new round, <span class="c-kbd">Esc</span> menu.</p>
    </section>
  </main>
  <div class="tt-fx" id="fx" aria-hidden="true"></div>
  <div class="tt-badge" id="badge" role="status" aria-live="polite"></div>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="logic.js"></script>
  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>
