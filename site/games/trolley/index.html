<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Absurd Trolley Problems · Zoble</title>
  <meta name="description" content="Pull the lever or don't. 67 increasingly unreasonable moral dilemmas, a speed round, a daily dilemma and a verdict on your soul.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-game="trolley">
  <main class="c-wrap tr-wrap">
    <header class="tr-hero">
      <h1 class="c-title">Absurd Trolley Problems</h1>
      <p class="c-sub">A trolley is coming. You are next to a lever. Choose wisely, or at least quickly.</p>
    </header>
    <div class="tr-hud" id="hud" hidden>
      <span class="tr-prog" id="prog">Problem 1</span>
      <span class="tr-kills">Kill count <b id="kills">0</b></span>
    </div>
    <div class="tr-timer" id="timer" hidden><i id="timerBar"></i></div>
    <p class="tr-q" id="q" hidden></p>
    <div class="tr-scene" id="scene"><svg id="svg" viewBox="0 0 720 300" role="img" aria-label="Trolley track illustration"></svg></div>

    <section id="menu" class="c-card tr-panel">
      <div class="tr-resume" id="resume" hidden></div>
      <h2 class="tr-h2">Pick a line</h2>
      <div class="tr-modes" id="modes"></div>
      <div class="tr-statsrow" id="statsRow"></div>
      <div class="c-row">
        <button class="c-btn c-btn--ghost" type="button" id="howBtn">❔ How it works</button>
        <button class="c-btn c-btn--ghost" type="button" id="badgeBtn">🏅 Badges and history</button>
      </div>
    </section>

    <section id="play" hidden>
      <div class="tr-choices" id="choices">
        <button class="c-btn tr-pull" id="pull" type="button"><span class="tr-lev" aria-hidden="true"></span>Pull the lever <span class="c-kbd">P</span></button>
        <button class="c-btn c-btn--ghost tr-nothing" id="nothing" type="button">Do nothing <span class="c-kbd">N</span></button>
      </div>
      <div id="result"></div>
    </section>

    <section id="end" class="c-card tr-panel tr-end" hidden></section>
    <section id="extra" class="c-card tr-panel" hidden></section>
    <p class="c-muted tr-foot">Poll numbers are invented for fun, much like the trolley. Keys: <span class="c-kbd">P</span> pull, <span class="c-kbd">N</span> do nothing, <span class="c-kbd">Enter</span> next.</p>
  </main>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="data.js"></script>
  <script src="art.js"></script>
  <script src="game.js"></script>
</body>
</html>
