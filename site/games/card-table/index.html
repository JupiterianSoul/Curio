<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Card Table · Zoble</title>
  <meta name="description" content="Solitaire and Blackjack on one felt table: Klondike, FreeCell, Spider and a six deck blackjack shoe.">
  <link rel="icon" href="thumb.svg">
  <link rel="stylesheet" href="../../shared.css">
  <link rel="stylesheet" href="cafe.css">
  <link rel="stylesheet" href="table.css">
</head>
<body data-game="card-table" data-modes class="cafe" data-table="oak" data-cafe-sign="off">
  <header class="tp-head">
    <div class="tp-sign">
      <span class="cafe-plate">Zoble Classics</span>
      <p class="tp-title">Card Table</p>
      <span id="table-tools" class="tp-tools"></span>
    </div>
    <p class="tp-tag">Two decks, one felt. Patience for one, or beat the dealer.</p>
    <nav id="table-pick" class="tp-pick" aria-label="Choose a game"></nav>
  </header>
  <div id="table-stage" class="tp-stage"></div>
  <template id="v-solitaire">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="s0" viewBox="0 0 100 100"><path d="M50 4C38 22 6 38 6 60c0 13 10 22 22 22 8 0 14-4 17-9-1 9-5 15-12 21h34c-7-6-11-12-12-21 3 5 9 9 17 9 12 0 22-9 22-22C94 38 62 22 50 4z"/></symbol>
      <symbol id="s1" viewBox="0 0 100 100"><path d="M50 90C22 68 5 52 5 31 5 17 16 7 29 7c9 0 16 5 21 12 5-7 12-12 21-12 13 0 24 10 24 24 0 21-17 37-45 59z"/></symbol>
      <symbol id="s2" viewBox="0 0 100 100"><path d="M50 3L86 50 50 97 14 50z"/></symbol>
      <symbol id="s3" viewBox="0 0 100 100"><path d="M50 8a19 19 0 1 1-.1 0zM28 40a19 19 0 1 1-.1 0zM72 40a19 19 0 1 1-.1 0zM44 55h12c0 16 4 26 14 37H30c10-11 14-21 14-37z"/></symbol>
    </defs>
  </svg>
  <main class="c-wrap">
    <header class="g-head">
      <svg class="fan" viewBox="-5 -14 160 100" aria-hidden="true">
        <g transform="rotate(-24 75 70)"><rect x="55" y="6" width="40" height="56" rx="5" fill="#fffdf8" stroke="#d8cfc0"/><use href="#s0" x="63" y="22" width="24" height="24" fill="#1d1b19"/></g>
        <g transform="rotate(-8 75 70)"><rect x="55" y="6" width="40" height="56" rx="5" fill="#fffdf8" stroke="#d8cfc0"/><use href="#s1" x="63" y="22" width="24" height="24" fill="#d32f2f"/></g>
        <g transform="rotate(8 75 70)"><rect x="55" y="6" width="40" height="56" rx="5" fill="#fffdf8" stroke="#d8cfc0"/><use href="#s3" x="63" y="22" width="24" height="24" fill="#1d1b19"/></g>
        <g transform="rotate(24 75 70)"><rect x="55" y="6" width="40" height="56" rx="5" fill="#fffdf8" stroke="#d8cfc0"/><use href="#s2" x="63" y="22" width="24" height="24" fill="#d32f2f"/></g>
      </svg>
      <h1 class="c-title">Solitaire</h1>
      <p class="c-sub" id="sub">Three classics on one felt: Klondike, FreeCell and Spider. Build the suits home from Ace to King.</p>
    </header>
    <div class="modes">
      <div class="seg big" id="games" role="group" aria-label="Game">
        <button type="button" data-g="klondike">Klondike</button>
        <button type="button" data-g="freecell">FreeCell</button>
        <button type="button" data-g="spider">Spider</button>
      </div>
      <div class="seg" id="opts" role="group" aria-label="Variant"></div>
    </div>
    <div class="bar2">
      <div class="stats">
        <div class="c-stat"><b id="score">0</b><span id="score-l">Score</span></div>
        <div class="c-stat"><b id="moves">0</b><span>Moves</span></div>
        <div class="c-stat"><b id="time">0:00</b><span>Time</span></div>
      </div>
      <div class="ctrls">
        <button class="c-btn c-btn--ghost" type="button" id="hint">💡 Hint</button>
        <button class="c-btn c-btn--ghost" type="button" id="undo">↶ Undo</button>
        <button class="c-btn c-btn--ghost" type="button" id="daily">📅 Daily</button>
        <button class="c-btn c-btn--ghost" type="button" id="restart">↺ Restart</button>
        <button class="c-btn" type="button" id="new">New deal</button>
      </div>
    </div>
    <p class="dealno" id="dealno"></p>
    <div class="table" id="table" role="application" aria-label="Solitaire table">
      <div class="layer" id="layer"></div>
    </div>
    <p class="g-help c-muted" id="help">Drag cards, or tap one and it jumps to the best spot. Double-click sends a card home. Keys: <span class="c-kbd">D</span> draw or deal, <span class="c-kbd">U</span> undo, <span class="c-kbd">H</span> hint, <span class="c-kbd">N</span> new deal, <span class="c-kbd">Tab</span> + <span class="c-kbd">Enter</span> to move a card.</p>
    <div class="panels">
      <details class="c-card" id="rules-card">
        <summary>📜 How to play <span id="rules-name" class="c-muted" style="margin-left:auto;font-size:13px"></span></summary>
        <ul class="rules" id="rules"></ul>
      </details>
      <details class="c-card">
        <summary>🎨 Card backs and felt</summary>
        <p class="sub">Card back</p>
        <div class="backs" id="backs" role="group" aria-label="Card back"></div>
        <p class="sub">Table</p>
        <div class="felts" id="felts" role="group" aria-label="Table colour"></div>
      </details>
      <details class="c-card">
        <summary>🏅 Stats and badges <span id="ach-count" class="c-muted" style="margin-left:auto;font-size:13px"></span></summary>
        <div class="st-grid" id="st-grid"></div>
        <div class="achs" id="achs"></div>
      </details>
    </div>
  </main>
  </template>
  <template id="v-blackjack">
    <main class="c-wrap bj" id="bj">
    <h1 class="c-title">Blackjack</h1>
    <p class="c-sub">Six decks, dealer stands on soft 17, blackjack pays 3 to 2. Side bets, a strategy coach and a card counting trainer. The house edge is tiny if you play perfectly. Do you?</p>
    <div class="topline">
      <div class="c-stat"><b id="bal">$1,000</b><span>Balance</span></div>
      <div class="c-stat"><b id="peak">$1,000</b><span>Peak</span></div>
      <div class="c-stat"><b id="rec">0-0-0</b><span>W-L-P</span></div>
      <div class="c-stat"><b id="acc">-</b><span>By the book</span></div>
    </div>
    <div class="table" id="table">
      <div class="tray" aria-hidden="true" id="tray"></div>
      <svg class="print" viewBox="0 0 720 300" aria-hidden="true">
        <path id="arc1" d="M70 120 Q360 290 650 120" fill="none"/>
        <path id="arc2" d="M110 150 Q360 300 610 150" fill="none"/>
        <text font-size="24" text-anchor="middle"><textPath href="#arc1" startOffset="50%">BLACKJACK PAYS 3 TO 2</textPath></text>
        <text font-size="13" text-anchor="middle"><textPath href="#arc2" startOffset="50%">DEALER MUST STAND ON SOFT 17 · INSURANCE PAYS 2 TO 1</textPath></text>
      </svg>
      <div class="countbox hidden" id="countbox">Running <b id="rc">0</b><br>True <b id="tc">0</b></div>
      <div class="shoe" aria-hidden="true"><span id="shoe-n">312</span><i id="shoe-fill"></i></div>
      <section class="area dealer">
        <h2>Dealer <span class="tot" id="d-tot"></span></h2>
        <div class="cards" id="d-cards" aria-live="polite"></div>
      </section>
      <div class="banner" id="banner" aria-live="polite"></div>
      <section class="area player">
        <div class="hands" id="hands"></div>
        <div class="spots" id="spots">
          <button type="button" class="spot side" data-spot="pp" aria-label="Perfect Pairs side bet"><span class="ring" data-label="PAIRS"><span class="stack"></span></span><b>$0</b><span class="pay">up to 25:1</span></button>
          <button type="button" class="spot main sel" data-spot="main" aria-label="Main bet"><span class="ring" data-label="BET"><span class="stack"></span></span><b>$0</b><span class="pay">main</span></button>
          <button type="button" class="spot side" data-spot="t3" aria-label="21 plus 3 side bet"><span class="ring" data-label="21+3"><span class="stack"></span></span><b>$0</b><span class="pay">up to 100:1</span></button>
        </div>
      </section>
    </div>
    <div class="controls">
      <div class="chips" id="chips">
        <button type="button" class="chip" data-v="1" aria-label="Add 1 dollar chip">1</button>
        <button type="button" class="chip" data-v="5" aria-label="Add 5 dollar chip">5</button>
        <button type="button" class="chip" data-v="25" aria-label="Add 25 dollar chip">25</button>
        <button type="button" class="chip" data-v="100" aria-label="Add 100 dollar chip">100</button>
        <button type="button" class="chip" data-v="500" aria-label="Add 500 dollar chip">500</button>
      </div>
      <div class="acts" id="bet-acts">
        <button type="button" class="c-btn c-btn--ghost" id="clear">Clear <span class="c-kbd">C</span></button>
        <button type="button" class="c-btn c-btn--ghost" id="rebet">Rebet x2 <span class="c-kbd">R</span></button>
        <button type="button" class="c-btn" id="deal">Deal <span class="c-kbd">Enter</span></button>
      </div>
      <div class="acts hidden" id="ins-acts">
        <button type="button" class="c-btn" id="ins-yes">Insurance <span class="c-kbd">Y</span></button>
        <button type="button" class="c-btn c-btn--ghost" id="ins-no">No thanks <span class="c-kbd">N</span></button>
      </div>
      <div class="acts hidden" id="play-acts">
        <button type="button" class="c-btn" id="a-hit" data-a="hit">Hit <span class="c-kbd">H</span></button>
        <button type="button" class="c-btn" id="a-stand" data-a="stand">Stand <span class="c-kbd">S</span></button>
        <button type="button" class="c-btn" id="a-double" data-a="double">Double <span class="c-kbd">D</span></button>
        <button type="button" class="c-btn" id="a-split" data-a="split">Split <span class="c-kbd">P</span></button>
        <button type="button" class="c-btn c-btn--ghost" id="a-surrender" data-a="surrender">Surrender <span class="c-kbd">U</span></button>
      </div>
      <p class="hint" id="hint"></p>
      <div class="acts">
        <button type="button" class="c-btn c-btn--ghost hidden" id="refill">💸 Refill bankroll</button>
      </div>
    </div>

    <div class="panels">
      <section class="c-card">
        <h3>🎛️ Table</h3>
        <div class="opt"><span>Strategy coach</span><button type="button" class="sw" data-opt="coach" aria-pressed="false" aria-label="Strategy coach"></button></div>
        <div class="opt"><span>Hi-Lo count overlay</span><button type="button" class="sw" data-opt="count" aria-pressed="false" aria-label="Count overlay"></button></div>
        <div class="opt"><span>Count quiz every 5 hands</span><button type="button" class="sw" data-opt="quiz" aria-pressed="false" aria-label="Count quiz"></button></div>
        <div class="opt"><span>Offer insurance</span><button type="button" class="sw" data-opt="insurance" aria-pressed="true" aria-label="Offer insurance"></button></div>
        <div class="opt"><span>Late surrender</span><button type="button" class="sw" data-opt="surrender" aria-pressed="true" aria-label="Late surrender"></button></div>
        <div class="opt"><span>Fast dealing</span><button type="button" class="sw" data-opt="fast" aria-pressed="false" aria-label="Fast dealing"></button></div>
        <div class="opt"><span>Felt</span><div class="swatches" id="felts"></div></div>
        <div class="opt"><span>Card backs</span><div class="swatches" id="backs"></div></div>
      </section>
      <section class="c-card drill" id="drill">
        <h3>🧮 Counting drill</h3>
        <p class="c-muted" style="margin:0;font-size:14px">Hi-Lo: 2 to 6 are <b>+1</b>, 7 to 9 are <b>0</b>, tens and aces are <b>-1</b>. Watch the cards fly and keep the running count.</p>
        <div class="stage" id="d-stage"><span id="d-msg">Ready when you are</span></div>
        <div class="c-row" style="justify-content:center;gap:8px;flex-wrap:wrap">
          <div class="seg" id="d-len"><button type="button" data-v="10" aria-pressed="true">10</button><button type="button" data-v="20" aria-pressed="false">20</button><button type="button" data-v="52" aria-pressed="false">Deck</button></div>
          <div class="seg" id="d-spd"><button type="button" data-v="1100" aria-pressed="false">Slow</button><button type="button" data-v="700" aria-pressed="true">Pro</button><button type="button" data-v="380" aria-pressed="false">Pit boss</button></div>
        </div>
        <div class="answers" id="d-ans" style="margin-top:10px"></div>
        <p style="margin:10px 0 0"><button type="button" class="c-btn" id="d-go">Start drill</button></p>
        <p class="c-muted" style="margin:6px 0 0;font-size:13px" id="d-best"></p>
      </section>
      <section class="c-card">
        <h3>📊 Your stats</h3>
        <div class="statgrid" id="statgrid"></div>
        <div class="badges" id="badges"></div>
        <div class="c-row" style="gap:8px;margin-top:12px;flex-wrap:wrap">
          <button type="button" class="c-btn c-btn--ghost" id="share">📋 Share</button>
          <button type="button" class="c-btn c-btn--ghost" id="reset">Reset stats</button>
        </div>
      </section>
      <section class="c-card">
        <h3>💰 Side bets</h3>
        <p class="c-muted" style="margin:0;font-size:14px">Tap a ring on the felt to choose where your chips go. Side bets settle the moment the cards land.</p>
        <table class="paytable"><tbody>
          <tr><td colspan="2"><b>Perfect Pairs</b> (your first two cards)</td></tr>
          <tr><td>Perfect pair (same suit)</td><td>25:1</td></tr>
          <tr><td>Coloured pair (same colour)</td><td>12:1</td></tr>
          <tr><td>Mixed pair</td><td>6:1</td></tr>
          <tr><td colspan="2"><b>21+3</b> (your two cards and the dealer's up card)</td></tr>
          <tr><td>Suited trips</td><td>100:1</td></tr>
          <tr><td>Straight flush</td><td>40:1</td></tr>
          <tr><td>Three of a kind</td><td>30:1</td></tr>
          <tr><td>Straight</td><td>10:1</td></tr>
          <tr><td>Flush</td><td>5:1</td></tr>
        </tbody></table>
      </section>
    </div>
    <p class="c-muted rules">Rules: 6-deck shoe reshuffled at the cut card. Dealer peeks for blackjack with an ace or ten showing. Double on any two cards, including after a split. Split up to four hands; split aces get one card each. Late surrender returns half your bet. Keys: H S D P U to play, Enter to deal, C to clear, R to rebet. Your bankroll is saved on this device.</p>
  </main>
  </template>
  <script src="../../games.js"></script>
  <script src="../../shared.js"></script>
  <script src="cafe.js"></script>

  <script src="table.js"></script>
</body>
</html>
